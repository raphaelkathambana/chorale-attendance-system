// -- Upcoming sessions dropdown (single, unified session picker) ----------
var apolSessions = [];
var apolCustomDate = false;

function loadUpcomingSessions() {
  var pick = document.getElementById("apolDate");
  if (pick && !pick.min) pick.min = todayStr();   // no apologising for dates already gone
  var sel = document.getElementById("apolSessionSelect");
  if (!sel) return;
  google.script.run.withSuccessHandler(renderApolSessionOptions)
    .withFailureHandler(function () {
      sel.innerHTML = '<option value="">Couldn\u2019t load sessions</option>';
    })
    .getUpcomingSessions();
}

function renderApolSessionOptions(list) {
  apolSessions = (list || []).slice();
  upcomingCache = apolSessions.slice();
  var sel = document.getElementById("apolSessionSelect");
  if (!sel) return;
  if (!apolSessions.length) {
    sel.innerHTML = '<option value="">No upcoming sessions \u2014 pick a date below</option>';
    apolNextInfo = null;
    updateApolConfirm();
    return;
  }
  var h = "", defaultIdx = -1;
  for (var i = 0; i < apolSessions.length; i++) {
    var s = apolSessions[i];
    var isMeeting = String(s.kind || "").toLowerCase() === "meeting";
    var lbl = (s.dayName || "") + " \u00b7 " + fmtDayMon(s.date)
            + " \u00b7 " + (s.title ? s.title : (isMeeting ? "Meeting" : "Practice"))
            + " \u00b7 " + fmtTime12(s.time);
    if (s.myApology) lbl += " \u2014 " + myApologyView(s.myApology).short;
    else if (s.deadlinePassed) lbl += " \u2014 closed";
    if (defaultIdx === -1 && !s.deadlinePassed && !s.myApology) defaultIdx = i;
    h += '<option value="' + i + '">' + esc(lbl) + '</option>';
  }
  if (defaultIdx === -1) defaultIdx = 0;
  // After a submit, stay on the session the member was looking at.
  if (apolKeepKey) {
    for (var k = 0; k < apolSessions.length; k++) if (apolSessKey(apolSessions[k]) === apolKeepKey) { defaultIdx = k; break; }
    apolKeepKey = null;
  }
  sel.innerHTML = h;
  sel.value = String(defaultIdx);
  apolCustomDate = false;
  applyApolSession(apolSessions[defaultIdx]);
}

function onApolSessionSelect() {
  var sel = document.getElementById("apolSessionSelect");
  if (!sel) return;
  var idx = parseInt(sel.value, 10);
  if (isNaN(idx) || !apolSessions[idx]) return;
  apolCustomDate = false;
  var custom = document.getElementById("apolCustomOpt");
  if (custom && custom.parentNode) custom.parentNode.removeChild(custom);
  var sub = document.getElementById("apolOtherDateSub");
  if (sub) sub.textContent = "NOT LISTED ABOVE? PICK A DATE";
  applyApolSession(apolSessions[idx]);
}

// Fill the session detail (meta + deadline + cut-off + confirmation) from a session.
function applyApolSession(s) {
  apolNextInfo = s || null;
  if (!s) { updateApolConfirm(); return; }
  var p = String(s.date).split("-");
  var dn3 = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
  var dObj = (p.length === 3) ? new Date(p[0], p[1] - 1, p[2]) : null;

  var d = document.getElementById("apolDate");
  if (d) d.value = s.date;

  var isMeeting = String(s.kind || "").toLowerCase() === "meeting";
  var grp = (s.groups && s.groups.length) ? s.groups.join(" / ").toUpperCase() : "";
  var meta = document.getElementById("apolSessionMeta");
  if (meta) meta.textContent = (s.title ? s.title.toUpperCase() + " \u00b7 " : "")
    + (isMeeting ? "MEETING" : "PRACTICE") + " \u00b7 " + fmtTime12(s.time) + (grp ? " \u00b7 " + grp : "");

  var dl = document.getElementById("apolSessionDeadline");
  if (dl) {
    dl.textContent = s.deadlinePassed ? "APOLOGY DEADLINE PASSED"
      : "APOLOGISE BY " + fmtTime12(s.deadline, true) + " \u00b7 " + fmtDayMonUpper(s.date);
    dl.className = "apol-session-deadline" + (s.deadlinePassed ? " passed" : "");
  }

  var cutoff = document.getElementById("apolCutoff");
  if (cutoff && dObj) cutoff.textContent = "CUT-OFF \u00b7 " + dn3[dObj.getDay()] + " " + fmtDayMonUpper(s.date) + " \u00b7 " + fmtTime12(s.deadline);

  updateApolConfirm();
}

// Confirmation notice — reflects the chosen session's deadline state + apology type.
function updateApolConfirm() {
  var conf  = document.getElementById("apolConfirm");
  var mark  = document.getElementById("apolConfirmMark");
  var title = document.getElementById("apolConfirmTitle");
  var body  = document.getElementById("apolConfirmBody");
  var type  = (document.getElementById("apolType") || {}).value || "Absent";
  var info  = apolNextInfo;
  var onFile = !apolCustomDate && info && info.myApology;
  syncApolSubmitBtn(onFile);
  if (onFile) {
    var v = myApologyView(info.myApology);
    if (conf)  conf.className = "apol-confirm " + ({ pending: "passed", ok: "", muted: "muted", no: "refused" }[v.tone] || "");
    if (mark)  mark.textContent = v.tone === "no" ? "!" : v.tone === "muted" ? "\u2013" : "\u2713";
    if (title) title.textContent = v.title + ".";
    if (body)  body.innerHTML = esc(v.body || (info.myApology.longTerm
      ? "It already covers this session, so there\u2019s nothing more to send."
      : "Each session takes one apology, so there\u2019s nothing more to send for this one."));
    return;
  }
  if (apolCustomDate || !info || !info.date) {
    if (conf)  conf.className = "apol-confirm";
    if (mark)  mark.textContent = "\u2713";
    if (title) title.textContent = "Timing is checked when you submit.";
    if (body)  body.innerHTML = "Before the 4\u00a0PM cut-off on the day it auto-accepts as <strong>" + esc(type) + "&nbsp;\u00b7&nbsp;Excused</strong>. After that it counts as Unexcused.";
    return;
  }
  if (info.deadlinePassed) {
    if (conf)  conf.className = "apol-confirm passed";
    if (mark)  mark.textContent = "!";
    if (title) title.textContent = "This session is past the cut-off.";
    if (body)  body.innerHTML = "Submitted now, it will be counted as <strong>Unexcused</strong> \u2014 points are still deducted.";
  } else {
    if (conf)  conf.className = "apol-confirm";
    if (mark)  mark.textContent = "\u2713";
    if (title) title.textContent = "You\u2019re submitting in time.";
    if (body)  body.innerHTML = "This will auto-accept and pre-fill your attendance as <strong>" + esc(type) + "&nbsp;\u00b7&nbsp;Excused</strong> when the admin marks " + esc(info.dayName || "the session") + ".";
  }
}

function setApologyKind(kind) {
  apologyKind = kind;
  var isEm = kind === 'emergency';
  // The toggle offers the two ordinary routes only. Emergency has no button here:
  // it is entered from the deadline-passed card, and the whole page becomes it.
  var tog = document.getElementById('apologyTypeToggle');
  if (tog) tog.style.display = isEm ? 'none' : 'inline-flex';
  var btns = document.querySelectorAll('#apologyTypeToggle button');
  if (btns[0]) btns[0].className = kind === 'single'   ? 'active' : '';
  if (btns[1]) btns[1].className = kind === 'extended' ? 'active' : '';
  document.getElementById('apologySingleForm').style.display = kind === 'single'   ? 'block' : 'none';
  document.getElementById('apologyLongForm').style.display   = kind === 'extended' ? 'block' : 'none';
  var em = document.getElementById('apologyEmergencyForm');
  if (em) em.style.display = isEm ? 'block' : 'none';
  var hint = document.getElementById('apolLongHint');
  if (hint) hint.style.display = kind === 'single' ? 'flex' : 'none';
  // Header copy follows the mode — an emergency filing is not the normal cycle.
  var eyebrow = document.getElementById('apolPageEyebrow');
  var title = document.getElementById('apolPageTitle');
  var sub = document.getElementById('apolPageSub');
  if (title) title.textContent = isEm ? 'File an emergency apology.' : 'Submit an apology.';
  if (eyebrow) {
    eyebrow.textContent = isEm ? 'DEADLINE PASSED \u00b7 EMERGENCY ONLY' : '';
    eyebrow.style.color = isEm ? 'var(--crimson-600)' : '';
    eyebrow.style.display = isEm ? 'block' : 'none';
  }
  if (sub) {
    sub.textContent = isEm
      ? 'The ordinary deadline for this session has gone. This route is for genuine emergencies only, covers today\u2019s session until midnight, and always waits on an admin\u2019s decision.'
      : 'Tell admins ahead of time. Apologies submitted before the cut-off on the day are auto-accepted as Late or Absent \u00b7 Excused.';
  }
  syncEmergencyHint();
  // Re-check on every entry: eligibility and phase change with the clock.
  if (isEm) loadEmergencyApologyOption();
}

// ─── Emergency apology (after the deadline, most recent session only) ──────
// Everything here is decided by the backend: eligibility, which session, and the
// window. The client only renders what it is told and never assumes eligibility.
var emergencyOption = null;

function loadEmergencyApologyOption() {
  google.script.run
    .withSuccessHandler(function (o) {
      emergencyOption = o || { eligible: false, reason: 'Emergency apologies are unavailable right now.' };
      renderEmergencyApology();
      paintMyAttNextSession();
      syncEmergencyHint();
      scheduleEmergencyExpiry(emergencyOption);
    })
    .withFailureHandler(function (e) {
      emergencyOption = { eligible: false, reason: (e && e.message) ? e.message : 'Could not check your last session.' };
      renderEmergencyApology();
      paintMyAttNextSession();
    })
    .getEmergencyApologyOption();
}

// "11:59 PM TONIGHT" when closesAt is today, else "SUN · 14 JUN · 11:59 PM".
function emClosesLabel(closes) {
  if (!closes || closes.length !== 2) return 'MIDNIGHT';
  var d = new Date(), pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var today = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  return closes[0] === today
    ? fmtTime12(closes[1]).toUpperCase() + ' TONIGHT'
    : formatDateShort(closes[0]).toUpperCase() + ' \u00b7 ' + fmtTime12(closes[1]).toUpperCase();
}

// Sentence-case twin of emClosesLabel for running copy: "11:59 PM tonight" or
// "Thu · 18 Jun · 11:59 PM".
function emClosesSentence(closesAt) {
  var c = closesAt ? String(closesAt).split(' ') : null;
  if (!c || c.length !== 2) return 'midnight';
  var d = new Date(), pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var today = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  return c[0] === today ? fmtTime12(c[1]) + ' tonight' : formatDateShort(c[0]) + ' \u00b7 ' + fmtTime12(c[1]);
}

// Apology-page entry to the emergency route. Only ever shown when the backend says
// eligible — which it never does before the deadline — so a normal apology cycle
// still shows just One session / Extended period. It matters most in the "hidden"
// phase, when the card has moved on and this is the only door left.
function syncEmergencyHint() {
  var eh = document.getElementById('apolEmHint');
  if (!eh) return;
  var o = emergencyOption;
  var show = !!(o && o.eligible) && apologyKind !== 'emergency' && !emergencyHasApology(o);
  eh.style.display = show ? 'flex' : 'none';
  var t = document.getElementById('apolEmHintText');
  if (t && show) {
    t.innerHTML = 'Kept away from <b>' + esc(formatDateShort(o.date)) + '</b> by a genuine emergency? '
                + 'You can still file for it until ' + esc(emClosesSentence(o.closesAt)) + '.';
  }
}

function renderEmergencyApology() {
  var c = document.getElementById('emergencyApolMount');
  if (!c) return;
  var o = emergencyOption;
  if (!o) { c.innerHTML = '<p class="loading">Checking your last session\u2026</p>'; return; }

  if (!o.eligible) {
    c.innerHTML = '<div class="em-card">'
      + '<div class="em-head"><span class="eyebrow">Emergency apology \u00b7 not available</span></div>'
      + '<div class="em-body">'
      +   '<div class="em-blocked">'
      +     '<div class="em-blocked-mark">\u2014</div>'
      +     '<div><div style="font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:4px">'
      +       (o.date ? esc(formatDateDisplay(o.date)) : 'Nothing to file for') + '</div>'
      +       '<div style="font-size:12.5px;color:var(--ink-600);line-height:1.55">' + esc(o.reason || '') + '</div></div>'
      +   '</div>'
      +   '<p style="font-size:12px;color:var(--ink-500);line-height:1.55;margin-top:14px">Emergency apologies cover today\u2019s session only, and close at midnight. For anything still to come, use <b>One session</b> before the deadline.</p>'
      + '</div></div>';
    return;
  }

  var groups = (o.groups && o.groups.length) ? o.groups.join(' / ').toUpperCase() : '';
  // closesAt is an absolute "yyyy-MM-dd HH:mm" from the backend — state the real
  // cut-off rather than a vague "within N hours".
  var closes = o.closesAt ? String(o.closesAt).split(' ') : null;
  var win = 'OPEN UNTIL ' + emClosesLabel(closes);
  var recorded = (o.status && o.status !== 'Not yet recorded')
                 ? ('RECORDED AS ' + esc(o.status).toUpperCase())
                 : 'REGISTER NOT YET MARKED';
  c.innerHTML = '<div class="em-card">'
    + '<div class="em-head"><span class="eyebrow">Emergency apology \u00b7 after the deadline</span></div>'
    + '<div class="em-body">'
    +   '<p class="subtitle" style="margin-bottom:14px;max-width:58ch">The deadline for this session has gone. If you missed it because of a genuine emergency, you can still add yours here for this one session. An admin will review it.</p>'
    +   '<div class="em-session">'
    +     '<span class="em-session-date">' + esc(formatDateDisplay(o.date)) + '</span>'
    +     '<span class="em-meta">' + (o.time ? fmtTime12(o.time) + ' \u00b7 ' : '') + (groups ? groups + ' \u00b7 ' : '') + recorded + '</span>'
    +   '</div>'
    +   '<div class="form-label" style="margin-top:18px">What happened <span style="color:var(--crimson-600)">*</span></div>'
    +   '<textarea id="emReason" class="apol-reason" rows="3" placeholder="Took my mother to hospital and I couldn\u2019t get to a phone before the cut-off."></textarea>'
    +   '<div class="apol-hint">Required. Say plainly what stopped you.</div>'
    +   '<div class="em-rules">'
    +     '<div class="em-rule"><span>!</span><div>For <b>genuine emergencies</b> only \u2014 illness, an accident, a family crisis. A clash you knew about belongs in an ordinary apology, filed before the deadline.</div></div>'
    +     '<div class="em-rule"><span>!</span><div><b>Always needs admin approval.</b> Nothing is applied automatically, and filing this does not change your record on its own.</div></div>'
    +     '<div class="em-rule"><span>!</span><div>If it is approved, your status for that session is corrected retroactively.</div></div>'
    +   '</div>'
    +   '<div class="apol-foot">'
    +     '<div class="apol-cutoff">WINDOW \u00b7 ' + win + '</div>'
    +     '<div class="apol-foot-actions">'
    +       '<button class="btn btn-secondary" onclick="closeApology()">Cancel</button>'
    +       '<button class="btn btn-crimson" id="btnEmApology" onclick="submitEmergencyApologyNow()">File emergency apology</button>'
    +     '</div>'
    +   '</div>'
    + '</div></div>';
}

function submitEmergencyApologyNow() {
  if (roBlock()) return;

  var reason = t ? t.value.trim() : '';
  if (!reason) { showToast('Describe what happened \u2014 a reason is required.', 'error'); if (t) t.focus(); return; }
  var btn = document.getElementById('btnEmApology');
  if (btn) { btn.disabled = true; btn.textContent = 'Filing\u2026'; }
  google.script.run.withSuccessHandler(function (r) {

    emergencyOption = null;

  }).withFailureHandler(function (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'File emergency apology'; }
    if (isDuplicateNotice(e)) { showToast(serverError(e), "info"); return; }
    showToast(serverError(e), 'error');
    refreshUpcomingAfterApology();
  }).submitEmergencyApology(reason);
}

// Type pills (Late / Absent) — mirror selection into the hidden #apolType field.
function setApolType(type) {
  var hidden = document.getElementById('apolType');
  if (hidden) hidden.value = type;
  var pills = document.querySelectorAll('#apolTypePills .apol-type-btn');
  for (var i = 0; i < pills.length; i++) {
    pills[i].className = 'apol-type-btn' + (pills[i].getAttribute('data-type') === type ? ' active' : '');
  }

// User picked an arbitrary date via "Apologise for another date".
// Past dates are refused: an apology is notice for a session still to come.
function onApolDateChange() {
  var d = document.getElementById('apolDate');
  if (!d || !d.value) return;
  if (d.value < todayStr()) {
    d.value = apolCustomDate && apolNextInfo && apolNextInfo.date ? apolNextInfo.date : '';
    showToast('That date has already passed \u2014 pick today or a later one.', 'error');
    return;
  }
  apolCustomDate = true;
  apolNextInfo = { date: d.value };

  var sub = document.getElementById('apolOtherDateSub');
  if (sub) sub.textContent = 'APOLOGISING FOR ' + fmtDayMonUpper(d.value);

  var meta = document.getElementById('apolSessionMeta');
  if (meta) meta.textContent = formatDateShort(d.value).toUpperCase() + ' \u00b7 TIMING CHECKED ON SUBMIT';
  var dl = document.getElementById('apolSessionDeadline');
  if (dl) { dl.textContent = ''; dl.className = 'apol-session-deadline'; }

  // Reflect the custom date inside the dropdown so the two stay in sync.
  var sel = document.getElementById('apolSessionSelect');
  if (sel) {
    var opt = document.getElementById('apolCustomOpt');
    if (!opt) { opt = document.createElement('option'); opt.id = 'apolCustomOpt'; sel.insertBefore(opt, sel.firstChild); }
    opt.value = 'custom';
    opt.textContent = 'Another date \u00b7 ' + fmtDayMon(d.value);
    sel.value = 'custom';
  }
  updateApolConfirm();
}

function loadMyApologies() {
  google.script.run.withSuccessHandler(renderMyApologies)
    .withFailureHandler(function(){}).getMyApologies();
}

function submitMemberApology() {
  if (roBlock()) return;
  var dateStr = document.getElementById("apolDate").value;
  var type    = document.getElementById("apolType").value;
  var reason  = document.getElementById("apolReason").value.trim();
  if (!dateStr) { showToast("Select a date.", "error"); return; }
  if (!reason)  { showToast("Enter a reason.", "error"); return; }
  var btn = document.getElementById("btnSubmitApology");
  btn.disabled = true; btn.textContent = "Submitting…";
  var lookupGroups = myGroups.length > 0 ? myGroups : ["Choir","Band","Orchestra"];
  // If a specific upcoming session is selected, carry its label + groups so the
  // backend matches the apology to that exact session (per-session matching).
  var selLabel = "", selGroups = [];
  if (apolNextInfo && apolNextInfo.date === dateStr) {
    selLabel = (String(apolNextInfo.kind||"").toLowerCase()==="meeting") ? (apolNextInfo.title || "Meeting") : "Practice";
    selGroups = apolNextInfo.groups || [];
  }
  google.script.run.withSuccessHandler(function (info) {
    var sessionTime = info.found ? (info.latest || info.time) : "";
    // Prefer the selected session's exact time when available
    if (apolNextInfo && apolNextInfo.date === dateStr && apolNextInfo.time) sessionTime = apolNextInfo.time;
    google.script.run.withSuccessHandler(function (r) {
      btn.disabled = false; btn.textContent = "Submit apology";
      showToast(r.onTime ? "Apology submitted on time." : "Apology submitted but past the deadline.", r.onTime ? "success" : "error");
      document.getElementById("apolReason").value = "";
      loadMyApologies();
      refreshUpcomingAfterApology();
    }).withFailureHandler(function (e) {
      btn.disabled = false; btn.textContent = "Submit apology";
      if (isDuplicateNotice(e)) { showToast(serverError(e), "info"); return; }
      // A refusal already says what happened to the first apology — show it as is.
      showToast(serverError(e), "error");
      refreshUpcomingAfterApology();
    }).submitApology(dateStr, type, reason, sessionTime, selLabel, selGroups);
  }).withFailureHandler(function () {
    google.script.run.withSuccessHandler(function () {
      btn.disabled = false; btn.textContent = "Submit apology";
      showToast("Apology submitted (no schedule found for timing check).", "success");
      document.getElementById("apolReason").value = ""; loadMyApologies(); refreshUpcomingAfterApology();
    }).withFailureHandler(function (e) {
      btn.disabled = false; btn.textContent = "Submit apology";
      if (isDuplicateNotice(e)) { showToast(serverError(e), "info"); return; }
      showToast(serverError(e), "error");
      refreshUpcomingAfterApology();
    }).submitApology(dateStr, type, reason, "", selLabel, selGroups);
  }).getSessionTime(dateStr, lookupGroups);
}

function submitLtApology() {

// ═══════════════════════════════════════════════════════════════════════════
//  8.  APOLOGY REVIEW (admin)
// ═══════════════════════════════════════════════════════════════════════════

var apologyQueue = [];

function loadApologyQueue() {
  serverCall("getApologyQueue", [], function (data) {
    apologyQueue = data;
    if (activeTab === "requests") refreshRequestsChrome(); // refresh type-filter counts
    else if (viewMode === "apologies") renderViewTab();
    renderApologyQueueContent();
  }, function (e) { showToast("Failed: " + e.message, "error"); });
}

function adminApprove(rowIndex) {
  if (roBlock()) return;
  var note = getReviewNote("Optional note (leave blank for none):");
  if (note === null) return;
  var done = beginDecision(rowIndex); if (!done) return;
  google.script.run.withSuccessHandler(function (r) {
    done();
    r = r || {};
    // Approval now cascades backwards: past registers get excused, the automatic
    // 3-AU offenses they caused are re-checked, and a removal that no longer holds
    // is flagged for an admin. Say all of it in the toast.
    var parts = ["Approved"];
    if (r.backfilled)      parts.push(r.backfilled + " past record" + (r.backfilled === 1 ? "" : "s") + " updated");
    if (r.offensesRemoved) parts.push(r.offensesRemoved + " offense" + (r.offensesRemoved === 1 ? "" : "s") + " removed");
    if (r.reinstatementFlagged) parts.push("flagged for reinstatement");
    var pNote = probationFlagToastPart(r.probationFlag ? [r.probationFlag] : []);
    if (pNote) parts.push(pNote);
    // backfillNote explains what the retroactive correction did (or why it couldn't),
    // e.g. for an emergency approved before the register was marked.
    var msg = parts.join(" \u00b7 ") + ".";
    if (r.backfillNote) msg += " " + String(r.backfillNote);
    showToast(msg, "success");
    selectedApologyIdx = null;
    loadApologyQueue();
    loadReinstatementFlags();
    loadProbationOutcomeFlags();
  })
    .withFailureHandler(function (e) { done(); showToast(serverError(e), "error"); })
    .approveApology(rowIndex, note || "");
}

function adminReject(rowIndex) {
  if (roBlock()) return;
  var note = getReviewNote("Reason for rejection:");
  if (note === null) return;
  var done = beginDecision(rowIndex); if (!done) return;
  google.script.run.withSuccessHandler(function (r) {
    done(); r = r || {};
    var msg = "Apology " + String(r.newStatus || "rejected").toLowerCase() + ".";
    if (r.cascaded > 0) msg += " " + r.cascaded + " attendance record(s) updated.";
    showToast(msg, "success"); selectedApologyIdx = null; loadApologyQueue();
  }).withFailureHandler(function (e) { done(); showToast(serverError(e), "error"); })
    .rejectApology(rowIndex, note || "");
}

function adminRevoke(rowIndex) {
  if (roBlock()) return;
  var note = prompt("Reason for revoking:");
  if (note === null) return;
  var done = beginDecision(rowIndex); if (!done) return;
  google.script.run.withSuccessHandler(function (r) {
    done(); r = r || {};
    var msg = "Apology revoked.";
    if (r.cascaded > 0) msg += " " + r.cascaded + " attendance record(s) updated.";
    showToast(msg, "success"); loadApologyQueue();
  }).withFailureHandler(function (e) { done(); showToast(serverError(e), "error"); })
    .rejectApology(rowIndex, note || "");
}

function adminApproveRestart(memberName, rowIndex) {
  if (roBlock()) return;
  if (!confirm("Approve probation restart for " + memberName + "? This resets their probation with today as the start date.")) return;
  var done = beginDecision(rowIndex); if (!done) return;
  google.script.run.withSuccessHandler(function (r) {
    showToast(r.name + "'s probation restarted.", "success");
    google.script.run.withSuccessHandler(function () { done(); loadApologyQueue(); })
      .withFailureHandler(function (e) { done(); showToast(serverError(e), "error"); loadApologyQueue(); })
      .approveApology(rowIndex, "Restart approved");
  }).withFailureHandler(function (e) { done(); showToast(serverError(e), "error"); })
    .approveProbationRestart(memberName);
}

// Rejoin: approve a returning member's request from the queue. The member re-enters
// a fresh re-entry probation; approveRejoin also stamps the request row Approved.
function approveRejoin(rowIndex, memberName) {
  if (roBlock()) return;
  if (!confirm("Approve " + memberName + "'s rejoin request? They return on a fresh re-entry probation.")) return;
  var done = beginDecision(rowIndex); if (!done) return;
  google.script.run.withSuccessHandler(function () {
    done();
    showToast(memberName + " reinstated \u2014 re-entry probation started.", "success");
    selectedApologyIdx = null;
    loadApologyQueue();
  }).withFailureHandler(function (e) { done(); showToast(serverError(e), "error"); })
    .approveRejoin(rowIndex, memberName);
}

// ─── REINSTATEMENT FLAGS ──────────────────────────────────────────────────
// Members still marked inactive whose removal no longer holds, because the
// absences behind it were excused retroactively. The backend only flags; the
// admin decides, so every row carries both reinstatement modes explicitly.
var reinstateFlags = [];

function loadReinstatementFlags() {
  if (!google.script.run || typeof google.script.run.getReinstatementFlags !== "function") return;
  google.script.run.withSuccessHandler(function (f) { reinstateFlags = f || []; renderReinstateFlags(); })
    .withFailureHandler(function () { reinstateFlags = []; renderReinstateFlags(); })
    .getReinstatementFlags();
}

function renderReinstateFlags() {
  var el = document.getElementById("reinstateFlagsPanel");
  if (!el) return;
  if (!reinstateFlags.length) { el.style.display = "none"; el.innerHTML = ""; return; }
  el.style.display = "";
  var h = '<div class="stat-card" style="padding:16px 18px;margin-bottom:18px">'
        +   '<div class="eyebrow">FLAGGED FOR REINSTATEMENT \u00b7 ' + reinstateFlags.length + '</div>'
        +   '<p style="font-size:12.5px;color:var(--ink-600);line-height:1.5;margin:6px 0 4px">Their removal no longer holds \u2014 the absences behind it have since been excused. Reinstating stays your call.</p>';
  for (var i = 0; i < reinstateFlags.length; i++) {
    var f = reinstateFlags[i], safe = String(f.name).replace(/'/g, "\\'");
    h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:12px 0 0;margin-top:11px;border-top:1px solid var(--paper-200)">'
      +    '<div style="flex:1;min-width:180px">'
      +      '<div style="font-size:13px;font-weight:600;color:var(--ink)">' + esc(f.name) + '</div>'
      +      '<div style="font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-500);margin-top:4px">'
      +        esc((f.groups || []).join(" \u00b7 ")) + ' \u00b7 STREAK NOW ' + f.currentStreak
      +      '</div>'
      +      '<div style="font-size:12px;color:var(--ink-600);line-height:1.45;margin-top:6px">' + esc(f.reason || "") + '</div>'
      +    '</div>'
      +    '<div style="display:flex;gap:6px;flex-wrap:wrap">'
      +      '<button class="btn-export" onclick="reinstateFlagged(\'' + safe + '\',\'probation\')">Reinstate \u00b7 probation</button>'
      +      '<button class="btn-export" onclick="reinstateFlagged(\'' + safe + '\',\'active\')">Reinstate \u00b7 active</button>'
      +    '</div>'
      + '</div>';
  }
  el.innerHTML = h + '</div>';
}

function reinstateFlagged(name, mode) {
  if (roBlock()) return;
  if (!confirm("Reinstate " + name + (mode === "active"
      ? " as active, with no probation?"
      : " on a fresh re-entry probation?"))) return;
  var safeSel = String(name).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
  var btns = [].filter.call(document.querySelectorAll('#reinstateFlagsPanel button[onclick]'), function (b) { return b.getAttribute("onclick").indexOf("('" + safeSel + "'") !== -1; });
  var done = beginAction("reinstate:" + name, btns); if (!done) return;
  google.script.run.withSuccessHandler(function () {
    done();
    showToast(name + (mode === "active" ? " reinstated as active." : " reinstated \u2014 re-entry probation started."), "success");
    loadReinstatementFlags();
    if (activeTab === "members" && typeof refreshMemberList === "function") refreshMemberList();
  }).withFailureHandler(function (e) { done(); showToast(serverError(e), "error"); })
    .adminReinstateMember(name, mode);
}

// Reinstate: the direct admin route from the Members tab (no request needed).
// Mode is explicit — this route always applies a fresh re-entry probation.
function adminReinstateMember(memberName) {
  if (roBlock()) return;

// ─── PROBATION OUTCOME CORRECTIONS ──────────────────────────────────────────
// A concluded probation result is never re-evaluated automatically, so an
// attendance correction can leave it wrong. getProbationOutcomeFlags() lists
// them; only improvements (canApply) can be applied here. A result getting
// worse shows the backend note and no button — that one is left to a human.
var probationOutcomeFlags = [];

// "Brian’s probation result may need correcting" / "2 probation results …"
function probationFlagToastPart(flags) {
  flags = (flags || []).filter(Boolean);
  if (!flags.length) return "";
  if (flags.length === 1) {
    var first = String(flags[0].name || "").split(/\s+/)[0] || "A member";
    return first + "\u2019s probation result may need correcting";
  }
  return flags.length + " probation results may need correcting";
}

function loadProbationOutcomeFlags() {
  if (!google.script.run || typeof google.script.run.getProbationOutcomeFlags !== "function") return;
  google.script.run.withSuccessHandler(function (f) { probationOutcomeFlags = f || []; renderProbationOutcomeFlags(); })
    .withFailureHandler(function () { probationOutcomeFlags = []; renderProbationOutcomeFlags(); })
    .getProbationOutcomeFlags();
}

function renderProbationOutcomeFlags() {
  var el = document.getElementById("probationFlagsPanel");
  if (!el) return;
  if (!probationOutcomeFlags.length) { el.style.display = "none"; el.innerHTML = ""; return; }
  el.style.display = "";
  var h = '<div class="stat-card" style="padding:16px 18px;margin-bottom:18px">'
        +   '<div class="eyebrow">PROBATION RESULT MAY NEED CORRECTING \u00b7 ' + probationOutcomeFlags.length + '</div>'
        +   '<p style="font-size:12.5px;color:var(--ink-600);line-height:1.5;margin:6px 0 4px">A concluded probation result is never re-evaluated automatically. After attendance corrections, these no longer match the register.</p>';
  for (var i = 0; i < probationOutcomeFlags.length; i++) {
    var f = probationOutcomeFlags[i], safe = String(f.name).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    var meta = esc((f.groups || []).join(" \u00b7 ")) + ' \u00b7 ' + esc(String(f.recordedLabel || "").toUpperCase())
             + ' \u2192 ' + esc(String(f.recomputedLabel || "").toUpperCase())
             + ' \u00b7 ATTENDED ' + f.attendedNow + '/' + f.required
             + (f.recomputedPenalty ? ' \u00b7 PENALTY ' + f.recomputedPenalty : '');
    h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:12px 0 0;margin-top:11px;border-top:1px solid var(--paper-200)">'
      +    '<div style="flex:1;min-width:180px">'
      +      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
      +        '<span style="font-size:13px;font-weight:600;color:var(--ink)">' + esc(f.name) + '</span>'
      +        (f.canApply ? '' : '<span class="prob-tag">DECIDE MANUALLY</span>')
      +      '</div>'
      +      '<div style="font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-500);margin-top:4px">' + meta + '</div>'
      +      '<div style="font-size:12px;color:var(--ink-600);line-height:1.45;margin-top:6px">' + esc(String(f.note || "").replace(/->/g, "\u2192")) + '</div>'
      +    '</div>';
    if (f.canApply) {
      h += '<div class="pof-actions" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
        +    '<label class="pof-notify" style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-600);cursor:pointer">'
        +      '<input type="checkbox" id="pofNotify' + i + '" checked style="width:auto;margin:0;accent-color:var(--gold)"> Email the member'
        +    '</label>'
        +    '<button class="btn-export" id="pofApply' + i + '" onclick="applyProbationCorrection(\'' + safe + '\',' + i + ')">Apply correction</button>'
        +  '</div>';
    }
    h += '</div>';
  }
  el.innerHTML = h + '</div>';
}

function applyProbationCorrection(name, i) {
  if (roBlock()) return;
  var f = probationOutcomeFlags[i] || {};
  var cb = document.getElementById("pofNotify" + i);
  var notify = cb ? !!cb.checked : true;
  if (!confirm("Change " + name + "\u2019s probation result from " + (f.recordedLabel || "the recorded result") + " to "
      + (f.recomputedLabel || "the corrected result") + "?" + (notify ? " They\u2019ll be emailed." : " No email will be sent."))) return;
  var done = beginAction("overturn:" + name, [document.getElementById("pofApply" + i), cb], "Applying\u2026");
  if (!done) return;
  google.script.run.withSuccessHandler(function (r) {
    done();
    r = r || {};
    var parts = [name + ": " + (r.from || f.recordedLabel) + " \u2192 " + (r.to || f.recomputedLabel)];
    if (r.membershipRestored) parts.push("membership restored");
    if (r.rejoinClosed) parts.push(r.rejoinClosed + " rejoin request" + (r.rejoinClosed === 1 ? "" : "s") + " closed");
    if (r.emailed) parts.push("member emailed");
    else if (notify) parts.push("email not sent");
    showToast(parts.join(" \u00b7 ") + ".", "success");
    loadProbationOutcomeFlags();
    if (r.rejoinClosed) loadApologyQueue();
    if (activeTab === "members" && typeof refreshMemberList === "function") refreshMemberList();
  }).withFailureHandler(function (e) { done(); showToast(serverError(e), "error"); })
    .overturnProbationOutcome(name, notify);
}

function exportDateRange(f) {

      function (err) { showToast("Failed: " + err.message, "error"); });

// emailDeniedAdmin / signInDifferentAccount are client-side (mailto + Google
// account chooser). sendReminder + emailSessionSummary delegate to server
// functions (sendPracticeReminder / emailAttendanceSummary in Code.gs), which
// send via MailApp and return { success, count, message }.
//
// emailDeniedAdmin reads two globals set during auth (see §3 getUserRole):
//   window.adminContactEmail — the chorale admin address
//   window.deniedUserEmail   — the signed-in (unrecognised) user's email

function emailDeniedAdmin(){
  var admin=window.adminContactEmail||"";
  var userEmail=window.deniedUserEmail||"";
  var subject=encodeURIComponent("Request to join Strathmore Chorale Attendance System");
  var body=encodeURIComponent("Hello,\n\nI would like to be added to the Chorale Attendance System. My email is: "+userEmail+"\n\nThank you.");
  if(admin){window.location.href="mailto:"+admin+"?subject="+subject+"&body="+body;}
  else{showToast("No admin contact configured.","error");}
}

function signInDifferentAccount(){
  // Apps Script runs sandboxed in an iframe, so we can't redirect the iframe to
  // Google's account chooser (it refuses to load in a frame). Open a new tab to
  // Google's logout, which then lets the user pick a different account; they
  // reopen the app URL from there. window.open escapes the iframe sandbox.
  var appUrl = (window.APP_URL_FOR_SWITCH || "");
  var logoutUrl = "https://accounts.google.com/Logout";
  var win = window.open(logoutUrl, "_blank");
  if(!win){
    showToast("Please allow pop-ups, then tap again to switch accounts.","error");
    return;
  }
  showToast("Signed out in a new tab. Sign in with the other account, then reopen the app.","success");
}

// Sign out from within the app (members + admins). Same iframe constraint:
// we open Google logout in a new tab; the app session ends when they re-auth.
function signOut(){
  if(!confirm("Sign out? This opens Google sign-out in a new tab. You'll need to sign back in to use the app."))return;
  var win=window.open("https://accounts.google.com/Logout","_blank");
  if(!win){showToast("Please allow pop-ups to sign out.","error");return;}
  showToast("Signed out in a new tab.","success");
}

// Send practice reminder — called from Record tab. Opens a dialog so the admin
// can add a note and choose which signature the email is sent with.
var reminderPending = null;

function sendReminder(){
  if (roBlock()) return;
  var ds=document.getElementById("attendanceDate").value;
  var groups=getSelectedGroups();
  var time=document.getElementById("sessionTime").value;
  if(!ds){showToast("Select a date first.","error");return;}
  if(groups.length===0){showToast("Select at least one group.","error");return;}
  reminderPending={ds:ds,groups:groups,time:time};

  document.getElementById("reminderContext").textContent=groups.join(" · ")+" — "+formatDateDisplay(ds)+(time?" at "+time:"");
  document.getElementById("reminderNote").value="";

  // Populate the signature picker from the server (falls back to a default).
  var sel=document.getElementById("reminderSignature");
  sel.innerHTML='<option value="general">Loading signatures…</option>';
  sel.disabled=true;
  google.script.run.withSuccessHandler(function(opts){
    sel.innerHTML="";
    (opts&&opts.length?opts:[{key:"general",label:"Chorale Committee (default)"}]).forEach(function(o){
      var op=document.createElement("option");
      op.value=o.key; op.textContent=o.label;
      sel.appendChild(op);
    });
    sel.disabled=false;
  }).withFailureHandler(function(){
    sel.innerHTML='<option value="general">Chorale Committee (default)</option>';
    sel.disabled=false;
  }).getSignatureOptions();

  document.getElementById("reminderDialog").style.display="flex";
}

function closeReminderDialog(){
  document.getElementById("reminderDialog").style.display="none";
  reminderPending=null;
}

function confirmSendReminder(){
  if (roBlock()) return;
  if(!reminderPending){closeReminderDialog();return;}
  var note=document.getElementById("reminderNote").value||"";
  var sig=document.getElementById("reminderSignature").value||"general";
  var p=reminderPending;
  var btn=document.getElementById("btnSendReminder");
  btn.disabled=true; btn.textContent="Sending…";
  google.script.run.withSuccessHandler(function(r){
    btn.disabled=false; btn.textContent="Send reminder";
    closeReminderDialog();
    if(r.success)showToast("Reminder sent to "+r.count+" member(s).","success");
    else showToast(r.message||"No reminders sent.","error");
  }).withFailureHandler(function(e){
    btn.disabled=false; btn.textContent="Send reminder";
    if (isDuplicateNotice(e)) { showToast(serverError(e), "info"); return; }
    showToast("Failed: "+e.message,"error");
  }).sendPracticeReminder(p.ds,p.groups,p.time,note,sig);
}

// Email attendance summary to admins — called from a session in View & Edit
function emailSessionSummary(dateStr,group){
  showToast("Sending summary...","success");
  google.script.run.withSuccessHandler(function(r){
    if(r.success)showToast("Summary sent to "+r.count+" admin(s).","success");
    else showToast(r.message||"Failed to send.","error");
  }).withFailureHandler(function(e){if (isDuplicateNotice(e)) { showToast(serverError(e), "info"); return; }showToast("Failed: "+e.message,"error");}).emailAttendanceSummary(dateStr,group||"All");
}

function onCommRecipChange(){
  var sel=document.querySelector('input[name="commRecip"]:checked');if(!sel)return;
  var val=sel.value;
  if(val==="all"&&!isFullAdmin())val="groups"; // safety net

// Replace {first name}/{last name}/{full name} in HTML with highlighted sample values
function commResolveTokens(html,fullName){
  var parts=String(fullName||"").trim().split(/\s+/);
  var first=parts[0]||fullName||"there";
  var last=parts.length>1?parts[parts.length-1]:first;
  var full=fullName||first;
  function wrap(v){return '<span class="cp-merge">'+esc(v)+'</span>';}
  return String(html)
    .replace(/\{\s*first\s*name\s*\}/gi,wrap(first))
    .replace(/\{\s*last\s*name\s*\}/gi,wrap(last))
    .replace(/\{\s*full\s*name\s*\}/gi,wrap(full));
}

// datetime-local helpers — the input's value is the admin's LOCAL wall-clock time.
function toLocalInput_(d){function p(n){return n<10?"0"+n:""+n;}return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());}
function commMinDateTime(){return toLocalInput_(new Date(Date.now()+2*60000));}
function commDefaultDateTime(){var d=new Date(Date.now()+60*60000);d.setSeconds(0,0);d.setMinutes(d.getMinutes()-(d.getMinutes()%5));return toLocalInput_(d);}
function commTZLabel(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||"local time";}catch(e){return "local time";}}
// ISO → friendly local label, e.g. "Tue 8 Jul, 7:00 AM"
function fmtSchedWhen(iso){
  var d=new Date(iso);if(isNaN(d.getTime()))return iso||"";
  var days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],mons=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var h=d.getHours(),mn=d.getMinutes(),ap=h<12?"AM":"PM",h12=h%12;if(h12===0)h12=12;
  return days[d.getDay()]+" "+d.getDate()+" "+mons[d.getMonth()]+", "+h12+":"+(mn<10?"0"+mn:mn)+" "+ap;
}

// Shared: read + validate the composer into a payload (returns null on invalid).
function buildCommuniquePayload(){
  var subject=document.getElementById("commSubject").value.trim();
  var bodyHtml=commBodyHtml();
  var bodyText=commBodyText().trim();
  if(!subject){showToast("Subject is required.","error");return null;}
  if(!bodyText){showToast("Message is required.","error");return null;}
  var rtype=communiqueData.recipientType||"all";
  if(rtype==="all"&&!isFullAdmin()){showToast("Only full admins can send to all members.","error");return null;}
  var payload={subject:subject,body:bodyHtml,format:"html",signatureKey:document.getElementById("commSignature").value,recipientType:rtype,ccAdmins:document.getElementById("commCcAdmins").checked,attachments:(communiqueData.attachments||[]).map(function(a){return {id:a.id,name:a.name};})};
  if(rtype==="groups"){
    var groups=[];document.querySelectorAll(".commGroup:checked").forEach(function(cb){if(sectionAllowed(cb.value))groups.push(cb.value);});
    if(groups.length===0){showToast("Select at least one section you manage.","error");return null;}
    payload.groups=groups;
  } else if(rtype==="individuals"){
    var emails=selectedCommMembers();
    if(emails.length===0){showToast("Select at least one member.","error");return null;}
    payload.emails=emails;
  }
  return payload;
}

function commSentToast(r){

// Button dispatcher — branch on the send mode.
function submitCommunique(){
  if (roBlock()) return;
  if((communiqueData.sendMode||"now")==="later")return scheduleCommuniqueSend();
  return sendCommuniqueNow();
}

function sendCommuniqueNow(){
  var payload=buildCommuniquePayload();if(!payload)return;
  if(inFlight.communique)return;
  if(!confirm("Send this message now? It will go out with the letterhead to the selected recipients."))return;
  var done=beginAction("communique",[document.getElementById("btnSendComm")],"Sending\u2026");if(!done)return;
  // Tag the payload so the backend removes the spent draft.
  if(composerDraft.id)payload.draftId=composerDraft.id;
  google.script.run.withSuccessHandler(function(r){
    done();
    showToast(commSentToast(r),"success");
    composerDraft={id:null,updatedAt:null};commDraftOwner="";
    resetCommuniqueForm();
    refreshDraftsCount();
  }).withFailureHandler(function(e){done();if (isDuplicateNotice(e)) { showToast(serverError(e), "info"); return; }showToast(serverError(e),"error");
  }).sendCommunique(payload);
}

function scheduleCommuniqueSend(){
  var payload=buildCommuniquePayload();if(!payload)return;
  var input=document.getElementById("commSendAt");
  var val=input?input.value:"";
  if(!val){showToast("Pick a date and time to schedule.","error");return;}
  var when=new Date(val); // datetime-local parsed as local wall-clock time
  if(isNaN(when.getTime())){showToast("That date and time isn\u2019t valid.","error");return;}
  if(when.getTime()<Date.now()+60*1000){showToast("Please schedule at least a minute in the future.","error");return;}
  payload.sendAt=when.toISOString();
  var done=beginAction("communique",[document.getElementById("btnSendComm")],"Scheduling\u2026");if(!done)return;
  if(composerDraft.id)payload.draftId=composerDraft.id;
  google.script.run.withSuccessHandler(function(r){
    done();
    showToast("Scheduled for "+fmtSchedWhen(r.sendAt)+" \u2014 "+r.recipientCount+" recipient"+(r.recipientCount===1?"":"s")+".","success");
    composerDraft={id:null,updatedAt:null};commDraftOwner="";
    resetCommuniqueForm();
    refreshDraftsCount();
    showCommSubtab("scheduled");
  }).withFailureHandler(function(e){done();if (isDuplicateNotice(e)) { showToast(serverError(e), "info"); return; }showToast(serverError(e),"error");
  }).scheduleCommunique(payload);
}

// ── Attachments (composer) ────────────────────────────────────────────────────
// Files upload to Drive immediately (so scheduled sends work); the payload only
// ever carries {id,name}. Delivery mode (real attachment vs Drive link) is decided
// by the backend and disclosed via getCommuniquePlan() before sending.
var COMM_ATTACH_MAX_BYTES=8*1024*1024; // ~8MB — base64 inflates ~33%, larger gets unreliable

function onCommFilesPicked(files){
  if(!files||!files.length)return;
  for(var i=0;i<files.length;i++)uploadOneCommFile(files[i]);
  var input=document.getElementById("commFileInput");if(input)input.value=""; // allow re-picking the same file
}

function uploadOneCommFile(file){
  if(file.size>COMM_ATTACH_MAX_BYTES){
    showToast("\u201c"+file.name+"\u201d is "+(file.size/1048576).toFixed(1)+" MB \u2014 keep attachments under 8 MB so uploads stay reliable.","error");
    return;
  }
  var tmpId="tmp_"+Date.now()+"_"+Math.floor(Math.random()*1e4);
  communiqueData.uploading=communiqueData.uploading||[];
  communiqueData.uploading.push({tmpId:tmpId,name:file.name,sizeMB:file.size/1048576});
  renderCommAttachList();
  var reader=new FileReader();
  reader.onload=function(){
    var res=reader.result||"";
    var comma=res.indexOf(",");
    var base64=comma!==-1?res.substring(comma+1):res; // strip "data:...;base64," prefix
    google.script.run.withSuccessHandler(function(meta){
      communiqueData.uploading=(communiqueData.uploading||[]).filter(function(u){return u.tmpId!==tmpId;});
      communiqueData.attachments=communiqueData.attachments||[];
      communiqueData.attachments.push(meta);
      renderCommAttachList();
      refreshCommPlan();
      renderCommuniquePreview();
    }).withFailureHandler(function(e){
      communiqueData.uploading=(communiqueData.uploading||[]).filter(function(u){return u.tmpId!==tmpId;});
      renderCommAttachList();
      showToast("Couldn\u2019t upload \u201c"+file.name+"\u201d: "+e.message,"error");
    }).uploadCommuniqueAttachment(file.name,file.type||"application/octet-stream",base64);
  };
  reader.onerror=function(){
    communiqueData.uploading=(communiqueData.uploading||[]).filter(function(u){return u.tmpId!==tmpId;});
    renderCommAttachList();
    showToast("Couldn\u2019t read \u201c"+file.name+"\u201d.","error");
  };
  reader.readAsDataURL(file);
}

// ── Delivery disclosure (getCommuniquePlan) ──────────────────────────────────
// Only meaningful when there are attachments; skipped (and the notice cleared)
// otherwise, so typing / recipient changes stay quiet until a file is attached.
var _commPlanTimer=null,_commPlanSeq=0;
function scheduleCommPlanRefresh(){
  if((communiqueData.attachments||[]).length===0){communiqueData.plan=null;renderCommPlanNotice(null);return;}
  if(_commPlanTimer)clearTimeout(_commPlanTimer);
  _commPlanTimer=setTimeout(refreshCommPlan,400);
}
function refreshCommPlan(){
  if((communiqueData.attachments||[]).length===0){communiqueData.plan=null;renderCommPlanNotice(null);return;}
  var payload=buildCommPlanPayload();
  var seq=++_commPlanSeq;
  google.script.run.withSuccessHandler(function(plan){
    if(seq!==_commPlanSeq)return; // ignore stale responses
    communiqueData.plan=plan;
    renderCommPlanNotice(plan);
  }).withFailureHandler(function(){}).getCommuniquePlan(payload);
}
// Unvalidated payload snapshot for the plan call (no toasts, subject not required).
function buildCommPlanPayload(){
  var rtype=communiqueData.recipientType||"all";
  var payload={body:commBodyHtml(),format:"html",recipientType:rtype,
    ccAdmins:!!((document.getElementById("commCcAdmins")||{}).checked),
    attachments:(communiqueData.attachments||[]).map(function(a){return {id:a.id,name:a.name};})};
  if(rtype==="groups"){var g=[];document.querySelectorAll(".commGroup:checked").forEach(function(cb){if(sectionAllowed(cb.value))g.push(cb.value);});payload.groups=g;}
  else if(rtype==="individuals"){payload.emails=selectedCommMembers();}
  return payload;
}
function renderCommPlanNotice(plan){
  var el=document.getElementById("commPlanNotice");if(!el)return;
  if(!plan||!plan.attachmentMode||plan.attachmentMode==="none"||plan.attachmentMode==="attach"){
    el.style.display="none";el.innerHTML="";return;
  }
  // attachmentMode === "link": forced = loud warning; otherwise a quieter note.
  var forced=!!plan.forced;
  var reason=plan.reason||("Attachments total "+plan.totalMB+" MB \u2014 recipients get a secure Drive link instead of a file.");
  el.className="comm-plan-notice "+(forced?"is-forced":"is-info");
  el.innerHTML='<span class="cpn-icon">'+(forced?"\u26A0":"\u2139")+'</span>'
    +'<div class="cpn-body"><div class="cpn-title">'+(forced?"Will send as a Drive link":"Sending as a Drive link")+'</div>'
    +'<div class="cpn-reason">'+esc(reason)+'</div></div>';
  el.style.display="flex";
}

//  BIRTHDAYS (admin) — getBirthdayDashboard / sendCustomBirthdayCard /

// ═══════════════════════════════════════════════════════════════════════════
var birthdaysLoaded = false, birthdayRange = "today", birthdayData = null, bdayPeople = {};

function loadBirthdays() { birthdaysLoaded = true; fetchBirthdays(); }

function fetchBirthdays() {
  var c = document.getElementById("birthdaysContent");
  if (!c) return;
  c.innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading birthdays…</div></div>';
  google.script.run.withSuccessHandler(function (d) {
    birthdayData = d || {};
    renderBirthdays();
  }).withFailureHandler(function (e) {
    c.innerHTML = '<p class="bday-empty">Could not load birthdays: ' + esc(e.message) + '</p>';
  }).getBirthdayDashboard(birthdayRange);
}

function setBirthdayRange(mode) {
  if (mode === birthdayRange) return;
  birthdayRange = mode;
  fetchBirthdays();
}

function bpid(email) { return "bp-" + String(email || "").replace(/[^a-z0-9]/gi, "_"); }

// Birthday month+day, derived from daysAway (today + N days). Returns e.g. "25 Jun".
function bdayDateLabel(daysAway) {
  if (daysAway == null || isNaN(daysAway)) return "";
  var d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + Number(daysAway));
  var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return d.getDate() + " " + months[d.getMonth()];
}

function renderBirthdays() {
  var c = document.getElementById("birthdaysContent");
  if (!c) return;
  var d = birthdayData || {};
  var autoSend = !!d.autoSend;
  bdayPeople = {};

  var ranges = [
    { id: "today", label: "Today / Tomorrow" },
    { id: "week",  label: "This Week" },
    { id: "month", label: "This Month" }
  ];
  var html = '<div class="bday-range">';
  for (var i = 0; i < ranges.length; i++) {
    html += '<button class="bday-range__opt' + (ranges[i].id === birthdayRange ? ' active' : '') +
            '" onclick="setBirthdayRange(\'' + ranges[i].id + '\')">' + ranges[i].label + '</button>';
  }
  html += '</div>';

  // Auto-send setting toggle
  html += '<div class="bday-setting">' +
            '<div class="bday-setting__copy">' +
              '<div class="bday-setting__label">Send birthday cards automatically</div>' +
              '<div class="bday-setting__hint">' + (autoSend
                ? 'On — each member gets their card on the day, no action needed.'
                : 'Off — review and send each card yourself.') + '</div>' +
            '</div>' +
            '<button class="bswitch" role="switch" aria-checked="' + (autoSend ? 'true' : 'false') + '" ' +
              'aria-label="Send birthday cards automatically" onclick="toggleAutoSend(this)"></button>' +
          '</div>';

  var today = d.today || [], tomorrow = d.tomorrow || [], upcoming = d.upcoming || [];
  var total = today.length + tomorrow.length + upcoming.length;

  if (!total) {
    html += '<div class="bday-empty">No birthdays in this range. Check back soon — someone\u2019s always about to celebrate.</div>';
  } else {
    // Today and Tomorrow always shown prominently (even when empty, as a quiet line)
    html += renderBdaySection("Today", today, autoSend, true);
    html += renderBdaySection("Tomorrow", tomorrow, autoSend, true);
    // Upcoming only appears in week/month mode
    if (birthdayRange !== "today") html += renderBdaySection("Upcoming", upcoming, autoSend, false);
  }
  c.innerHTML = html;
}

function renderBdaySection(title, list, autoSend, prominent) {
  list = list || [];
  if (!list.length) {
    if (!prominent) return "";
    return '<div class="bday-section"><div class="bday-section__head">' +
             '<span class="bday-section__title">' + title + '</span></div>' +
           '<p class="bday-quiet">No one\u2019s celebrating ' + title.toLowerCase() + '.</p></div>';
  }
  var cards = "";
  for (var i = 0; i < list.length; i++) cards += renderBpersonCard(list[i], autoSend);
  var noun = list.length === 1 ? "person" : "people";
  return '<div class="bday-section"><div class="bday-section__head">' +
           '<span class="bday-section__title">' + title + '</span>' +
           '<span class="bday-section__count">' + list.length + ' ' + noun + '</span>' +
         '</div><div class="bday-cards">' + cards + '</div></div>';
}

function renderBpersonCard(p, autoSend) {
  var id = bpid(p.email);
  bdayPeople[id] = p;

  var avatar = p.avatar
    ? '<img class="bperson__avatar" src="' + p.avatar + '" alt="">'
    : '<span class="bperson__avatar bperson__avatar--initial">' + esc(p.first ? p.first.charAt(0) : "\u266A") + '</span>';

  var ageTxt = (p.age != null && p.age !== "") ? "Turns " + esc(String(p.age)) : "Birthday";
  var dateTxt = bdayDateLabel(p.daysAway);
  var ageLine = dateTxt ? (ageTxt + ' \u00b7 ' + dateTxt) : ageTxt;
  var sent = p.cardSent ? '<span class="bperson__sent">\u2713 Card sent</span>' : "";

  var copyBtn   = '';

  var actions;
  if (autoSend) {
    actions = '<div class="bperson__auto">\u2713 Sent automatically</div>' +
              '<div class="bperson__actions">' + posterBtn + '</div>';
  } else {
    actions = '<div class="bperson__actions">' +
                '<button class="bbtn bbtn--accent" onclick="sendBdayCardNow(\'' + id + '\', this)">Send card</button>' +
                '<button class="btn btn-secondary" onclick="openBdayEdit(\'' + id + '\')">Edit &amp; send</button>' +
                posterBtn +
              '</div>';
  }

  var edit = '<div class="bperson__edit">' +
               '<label class="form-label" for="' + id + '-msg">Card message</label>' +
               '<textarea class="bperson__msg" id="' + id + '-msg">' + esc(p.messageDraft || "") + '</textarea>' +
               '<div class="bperson__edit-actions">' +
                 '<button class="bbtn bbtn--accent" onclick="sendBdayCard(\'' + id + '\')">Send card</button>' +
                 '<button class="btn btn-ghost" onclick="closeBdayEdit(\'' + id + '\')">Cancel</button>' +
               '</div>' +
             '</div>';

  var accent = p.accent || "var(--gold)";
  var group = '<div class="bperson__group">' +
                '<label class="form-label" for="' + id + '-group">Group message (WhatsApp)</label>' +
                '<div class="bperson__group-row">' +
                  '<textarea class="bperson__group-ta" id="' + id + '-group">' + esc(p.groupDraft || "") + '</textarea>' +
                  '<button class="bbtn bbtn--accent" onclick="copyBdayGroup(\'' + id + '\')">Copy</button>' +
                '</div>' +
              '</div>';
  return '<div class="bperson" id="' + id + '" style="--accent:' + accent + ';">' +
           '<div class="bperson__top">' + avatar +
             '<div class="bperson__id">' +
               '<div class="bperson__name">' + esc(p.name) + '</div>' +
               '<div class="bperson__age">' + ageLine + '</div>' +
             '</div>' + sent +
           '</div>' + actions + edit + group +
         '</div>';
}

function openBdayEdit(id) {

function sendBdayCard(id) {
  if (roBlock()) return;
  var p = bdayPeople[id];
  if (!p) return;

  var msg = ta ? ta.value : (p.messageDraft || "");

function copyBdayGroup(id) {

// Default (un-edited) card send — distinct from the edited path (sendCustomBirthdayCard)
function sendBdayCardNow(id, btn) {
  if (roBlock()) return;
  var p = bdayPeople[id];
  if (!p) return;
  if (btn) { btn.disabled = true; btn.textContent = "Sending…"; }
  google.script.run.withSuccessHandler(function (res) {
    p.cardSent = true;
    showToast("Card sent to " + ((res && res.name) || p.first || "member") + ".", "success");
    renderBirthdays();
  }).withFailureHandler(function (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Send card"; }
    if (isDuplicateNotice(e)) { showToast(serverError(e), "info"); return; }
    showToast("Failed: " + e.message, "error");
  }).sendBirthdayCardNow(p.email);

// Auto-send setting — optimistic UI, reverts on failure, re-renders cards to swap states
function toggleAutoSend(el) {
  if (roBlock()) return;
  var next = el.getAttribute("aria-checked") !== "true";
  el.disabled = true;
  google.script.run.withSuccessHandler(function () {
    el.disabled = false;
    if (birthdayData) birthdayData.autoSend = next;
    showToast(next ? "Birthday cards will send automatically." : "Automatic sending turned off.", "success");
    renderBirthdays();

    el.disabled = false;
    showToast("Couldn\u2019t update setting: " + e.message, "error");
  }).setAutoSendBirthdayCard(next);

function makeBdayPoster(id, btn) {
  var p = bdayPeople[id];
  if (!p) return;
  var orig = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "Making…"; }
  google.script.run.withSuccessHandler(function (res) {
    if (btn) { btn.disabled = false; btn.textContent = orig; }
    if (res && res.url) {
      window.open(res.url, "_blank");
      showToast("Poster ready for " + ((res.name) || p.first) + ".", "success");
    } else {
      showToast("Poster could not be generated.", "error");
    }
  }).withFailureHandler(function (e) {
    if (btn) { btn.disabled = false; btn.textContent = orig; }
    showToast(e.message || "No poster template configured yet.", "error");
  }).makeBirthdayPoster(p.email);
}

function copyTextToClipboard(text, cb) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { cb(true); }, function () { fallbackCopy(text, cb); });
    return;
  }
  fallbackCopy(text, cb);
}
function fallbackCopy(text, cb) {
  try {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.top = "-1000px"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok = document.execCommand("copy");
    document.body.removeChild(ta);
    cb(ok);
  } catch (e) { cb(false); }
}

var ACTIVE_YEAR = null;   // null = the live year; otherwise a past label like "2025/26"

// Use this instead of google.script.run.<fn>(...) in every view that supports past years.
function serverCall(fnName, args, onOk, onErr) {
  var r = google.script.run.withSuccessHandler(onOk)
            .withFailureHandler(onErr || function (e) { showToast(e.message, "error"); });
  if (ACTIVE_YEAR) return r.callForYear(ACTIVE_YEAR, fnName, args || []);
  return r[fnName].apply(r, args || []);
}

function setActiveYear(label) {          // label null/"" = back to the live year
  ACTIVE_YEAR = label || null;
  document.body.classList.toggle("year-archived", !!ACTIVE_YEAR);

}

// Views that exist per year (their loaders go through serverCall). Everything
// else is live-year only and shows renderYearGate() while an archive is open.

var YR_MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var YR_MONTH = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function yrParts(ds) { var p = String(ds || "").split("-"); return p.length === 3 ? p : null; }
function niceDay(ds) { var p = yrParts(ds); return p ? Number(p[2]) + " " + YR_MON[Number(p[1]) - 1] + " " + p[0] : (ds || ""); }
function niceDayLong(ds) { var p = yrParts(ds); return p ? Number(p[2]) + " " + YR_MONTH[Number(p[1]) - 1] + " " + p[0] : (ds || ""); }
// A past year's endsOn is the day the next year started (exclusive) — show the last day.
function prevDayStr(ds) {
  var p = yrParts(ds); if (!p) return ds || "";
  var d = new Date(+p[0], +p[1] - 1, +p[2] - 1);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function yearLabelShort(l) { return String(l || "").replace(/^20(\d\d)\/(\d\d)$/, "$1/$2"); }

// The rollover lives on the Chorale year page. When the window is open (1 November

function yearTabVisible() {

        +   '<div class="ny-apol-sub">' + apologySubLine(a) + ' \u00b7 ' + esc(apologyKindLabel(a).toUpperCase()) + '</div>'
        +   '<div class="ny-apol-reason">\u201c' + esc(pr.cleanReason || a.reason || "") + '\u201d</div>'
        + '</div><span class="ny-apol-st">PENDING</span></div>';
  if (!isReadOnly()) {
    h += '<div class="ny-apol-acts">' + (isApol
      ? '<button type="button" class="btn-export ny-rej" onclick="nyReject(' + a.rowIndex + ')">Reject</button><button type="button" class="btn-export ny-app" onclick="nyApprove(' + a.rowIndex + ')">Approve</button>'
      : '<button type="button" class="btn-export" onclick="switchTab(\'requests\')">Decide in Requests \u2192</button>') + '</div>';
  }
  return h + '</div>';
}
function nyApprove(rowIndex) { nyDecide(rowIndex, true); }
function nyReject(rowIndex) { nyDecide(rowIndex, false); }
function nyDecide(rowIndex, approve) {
  if (roBlock()) return;
  var note = prompt(approve ? "Optional note (leave blank for none):" : "Reason for rejection:");
  if (note === null) return;
  var done = beginDecision(rowIndex); if (!done) return;
  var run = google.script.run.withSuccessHandler(function (r) {
    done(); r = r || {};
    var parts = [approve ? "Approved" : "Rejected"];
    if (r.backfilled) parts.push(r.backfilled + " past record" + (r.backfilled === 1 ? "" : "s") + " updated");
    if (r.offensesRemoved) parts.push(r.offensesRemoved + " offense" + (r.offensesRemoved === 1 ? "" : "s") + " removed");
    showToast(parts.join(" \u00b7 ") + ".", "success");
    requestsTabLoaded = false;   // the queue changed
    runYearPreview();            // row numbers shift when the sheet changes — never reuse an old rowIndex
  }).withFailureHandler(function (e) { done(); showToast(serverError(e), "error"); runYearPreview(); });
  if (approve) run.approveApology(rowIndex, note || ""); else run.rejectApology(rowIndex, note || "");
}

var activityLimit = 200, activityTimer = null;

}
// "15/9/26", "15-09-2026", "2026-09-15", "15th Sep", "Sep 15 2026", "15th" → "2026-09-15".
// Day first (15/9 = 15 Sep). No year → the most recent one; "15th" alone → the latest 15th.
// A bare number is text, not a date.
function actParseDate(q) {
  var t = String(q || "").toLowerCase().trim().replace(/,/g, " ").replace(/\s+of\s+/g, " ").replace(/\s+/g, " ");
  var hadOrdinal = /\d(st|nd|rd|th)\b/.test(t);
  t = t.replace(/(\d+)(st|nd|rd|th)\b/g, "$1");
  var MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12 };
  function mon(w) { w = String(w || "").slice(0, 4); return MON[w] || MON[w.slice(0, 3)] || 0; }
  var base = actDateBase(), y = 0, m = 0, d = 0, mm;
  if ((mm = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) { y = +mm[1]; m = +mm[2]; d = +mm[3]; }
  else if ((mm = t.match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2}|\d{4}))?$/))) {
    d = +mm[1]; m = +mm[2]; y = mm[3] ? +mm[3] : 0;
    if (m > 12 && d <= 12) { var x = d; d = m; m = x; }
  }
  else if ((mm = t.match(/^(\d{1,2}) ([a-z]{3,9})\.?(?: (\d{2}|\d{4}))?$/)) && mon(mm[2])) { d = +mm[1]; m = mon(mm[2]); y = mm[3] ? +mm[3] : 0; }
  else if ((mm = t.match(/^([a-z]{3,9})\.? (\d{1,2})(?: (\d{2}|\d{4}))?$/)) && mon(mm[1])) { m = mon(mm[1]); d = +mm[2]; y = mm[3] ? +mm[3] : 0; }
  else if (hadOrdinal && (mm = t.match(/^(\d{1,2})$/))) { d = +mm[1]; }

  if (y && y < 100) y += 2000;
  if (!m) {                                         // "15th": this month's, else last month's
    m = base.getMonth() + 1; y = base.getFullYear();
    if (d > base.getDate()) { m -= 1; if (!m) { m = 12; y -= 1; } }
  } else if (!y) {                                  // "15 Sep": the most recent one
    y = base.getFullYear();
    if (new Date(y, m - 1, d) > base) y -= 1;
  }
  var dt = new Date(y, m - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return "";

}

}

var composerDraft = { id: null, updatedAt: null };
var commDraftLabel = "", commDraftOwner = "", commCleanSig = null, commDraftsList = [], commLastSavedId = null;

// Non-validating read of the composer — the fields the send payload carries, so a

function buildCommuniquePayloadForSend() {

            signatureKey: g("commSignature") ? g("commSignature").value : "", recipientType: rtype,
            ccAdmins: !!(g("commCcAdmins") && g("commCcAdmins").checked),
            attachments: (communiqueData.attachments || []).map(function (a) { return { id: a.id, name: a.name }; }) };
  if (rtype === "groups") {
    var gs = []; document.querySelectorAll(".commGroup:checked").forEach(function (cb) { if (sectionAllowed(cb.value)) gs.push(cb.value); });
    p.groups = gs;
  } else if (rtype === "individuals") p.emails = selectedCommMembers();
  if ((communiqueData.sendMode || "now") === "later" && g("commSendAt") && g("commSendAt").value) {

  dismissDraftNotice();

  if (!asNew && composerDraft.id) { p.id = composerDraft.id; p.expectedUpdatedAt = composerDraft.updatedAt; }
  google.script.run.withSuccessHandler(function (r) {
    done();
    // Saved: clear the composer and land on Drafts, with the saved one marked.
    showToast("Draft saved \u00b7 " + (r.savedLabel || ""), "success");
    composerDraft = { id: null, updatedAt: null }; commDraftOwner = ""; commDraftLabel = "";
    commLastSavedId = r.id;
    resetCommuniqueForm();
    showCommSubtab("drafts");
  }).withFailureHandler(function (e) {
    done();
    // Conflict (saved in another tab/device) or someone else's draft: offer "Save as new draft".
    if (/saved somewhere else|Save it as a new draft|no longer exists/.test(e.message)) offerSaveAsNew(serverError(e));
    else showToast(serverError(e), "error");
  }).saveCommuniqueDraft(p);
}

  else if (composerDraft.id && dirty) { txt = "Unsaved changes \u00b7 draft last saved " + commDraftLabel; cls = "is-dirty"; }
  else if (dirty) { txt = commDraftOwner ? "Not saved \u2014 saving creates your own copy" : "Not saved as a draft yet"; cls = "is-dirty"; }

// ─── 13a. ONE APOLOGY PER SESSION ─────────────────────────────────────────
// getUpcomingSessions() entries carry myApology: null, or
// { status, type, longTerm, startDate, endDate }. The backend refuses a second
// apology for the same session, so where one exists the card and the apology page
// show its status instead of a submit control.
var upcomingCache = [];
var apolKeepKey = null;
function apolSessKey(s) { return s ? (s.date + "|" + (s.time || "")) : ""; }

// "12–30 Nov" · "28 Nov – 3 Dec"
function apolRangeLabel(a, b) {
  var pa = String(a || "").split("-"), pb = String(b || "").split("-");
  if (pa.length < 3 || pb.length < 3) return String(a || "") + " \u2013 " + String(b || "");
  if (pa[0] === pb[0] && pa[1] === pb[1]) return parseInt(pa[2], 10) + "\u2013" + fmtDayMon(b);
  return fmtDayMon(a) + " \u2013 " + fmtDayMon(b);
}

// One wording for the card, the picker and the apology page.
function myApologyView(a) {
  a = a || {};
  var st = String(a.status || "");
  if (a.longTerm) {
    var pend = st === "Pending";
    return { tone: pend ? "pending" : "ok",
             title: "Covered by your long-term apology (" + apolRangeLabel(a.startDate, a.endDate) + ")",
             sub: "LONG-TERM \u00b7 " + (pend ? "WAITING FOR REVIEW" : "ACCEPTED"),
             short: "covered by long-term apology" };
  }
  var type = String(a.type || "").toUpperCase();
  if (st === "Pending") return { tone: "pending", title: (/emergency/i.test(a.type || "") ? "Emergency apology" : "Apology") + " sent \u00b7 waiting for review", sub: type, short: "apology sent" };
  if (st === "Approved" || st === "Applied" || st === "Accepted") return { tone: "ok", title: "Apology accepted", sub: type, short: "apology accepted" };
  if (st === "Not needed") return { tone: "muted", title: "Apology closed \u00b7 you attended", sub: type, short: "apology closed" };
  return { tone: "no", title: "Apology not accepted",
           body: "Another one can\u2019t be sent for this session. Speak to your section admin if you think that\u2019s wrong.",
           sub: type, short: "apology not accepted" };
}

function myApologyStatusHtml(a) {
  var v = myApologyView(a);
  return '<div class="na-st na-' + v.tone + '">'
    +   '<span class="na-st-dot"></span>'
    +   '<div style="min-width:0">'
    +     '<div class="na-st-t">' + esc(v.title) + '</div>'
    +     (v.body ? '<div class="na-st-b">' + esc(v.body) + '</div>' : '')
    +     (v.sub ? '<div class="na-st-s">' + esc(v.sub) + '</div>' : '')
    +   '</div>'
    + '</div>';
}

// The emergency route stays shut when the session already has an apology (the
// backend refuses it anyway). Matched on date, and time when both sides know it.
function emergencyHasApology(o) {
  if (!o || !o.date) return false;
  var pools = [upcomingCache, (typeof apolSessions !== "undefined" ? apolSessions : []), myAttNextInfo ? [myAttNextInfo] : []];
  for (var p = 0; p < pools.length; p++) {
    var l = pools[p] || [];
    for (var i = 0; i < l.length; i++) {
      var s = l[i];
      if (s && s.myApology && s.date === o.date && (!o.time || !s.time || s.time === o.time)) return true;
    }
  }
  return false;
}

var WHO_TONE = { all: "is-all", present: "t-green", attended: "t-gold", absent: "t-crimson" };
function whoLabel(v) { for (var i = 0; i < EXPORT_WHO_OPTS.length; i++) if (EXPORT_WHO_OPTS[i][0] === v) return EXPORT_WHO_OPTS[i][1]; return "Everyone"; }

// Collect the form, send only the fields that changed.
function submitMeetingEdit(id) {
  if (roBlock()) return;
  var m = null;
  for (var i = 0; i < scheduledMeetings.length; i++) if (String(scheduledMeetings[i].id) === String(id)) m = scheduledMeetings[i];
  if (!m) { showToast("This meeting is no longer on the list - reload and try again.", "error"); return; }
  var date  = document.getElementById("mtgEditDate").value;
  var time  = document.getElementById("mtgEditTime").value;
  var title = document.getElementById("mtgEditTitle").value.trim();
  var boxes = document.querySelectorAll(".mtgEditGroup");
  var groups = [];
  for (var j = 0; j < boxes.length; j++) if (boxes[j].checked) groups.push(boxes[j].value);
  if (!date)          { showToast("Pick a date.", "error"); return; }
  if (!time)          { showToast("Pick a time.", "error"); return; }
  if (!title)         { showToast("Enter a meeting title.", "error"); return; }
  if (!groups.length) { showToast("Select at least one group.", "error"); return; }
  var key = function (a) { return (a || []).slice().sort().join(","); };
  var changes = {};
  if (date !== m.date) changes.date = date;
  if (time !== m.time) changes.time = time;
  if (title !== (m.title || "")) changes.title = title;
  if (key(groups) !== key(m.groups)) changes.groups = groups;
  if (!Object.keys(changes).length) { showToast("Nothing has changed.", "info"); return; }
  saveMeetingEdit(m, changes, document.getElementById("btnSaveMtgEdit"));

// Save button locked while saving through the shared in-flight lock (beginAction):
// key "meetingEdit:<id>" refuses a second start, and done() re-enables the button
// after success AND failure.
function saveMeetingEdit(m, changes, btn) {

  var done = beginAction("meetingEdit:" + m.id, [btn], "Saving\u2026");
  if (!done) return;
  google.script.run.withSuccessHandler(function (r) {
    done();
    meetingEditId = null;
    showToast("Meeting updated.", "success");
    if (r.apologiesForOldSlot) {
      showToast(r.apologiesForOldSlot + " member(s) had sent apologies for the old date/time - they'll need to send them again.", "warning");
    }
    loadMeetings();
  }).withFailureHandler(function (e) {
    done();
    if (isDuplicateNotice(e)) { showToast(e.message, "info"); return; }
    showToast(e.message, "error");
  }).updateMeeting(m.id, changes);
}
</script>
