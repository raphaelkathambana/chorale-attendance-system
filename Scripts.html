}
// Single source of truth for the membership-status badge, used by the roster table,
// the mobile cards and the detail pane. `sty` is an optional base style string.
function memberStatusBadges(m, sty) {
  function tag(cls, extra, label) {
    var s = [sty || "", extra || ""].filter(Boolean).join(";");
    return '<span class="' + cls + '"' + (s ? ' style="' + s + '"' : "") + '>' + label + '</span>';
  }
  var gold = "background:var(--gold-100);color:var(--gold-700)";
  // On Hiatus is inactive in Members but is a planned break, not a removal — it must
  // never read as INACTIVE, since those two states return by different routes.
  if (isOnHiatus(m)) return tag("prob-tag", gold, "ON HIATUS");
  if (!m.active) return tag("inactive-tag", "", "INACTIVE");
  if (isRejoining(m)) return tag("prob-tag", gold, "REJOINING");
  if (m.probation) return tag("prob-tag", "", "PROBATION");
  if (m.probationPassed) return tag("prob-tag", "background:var(--present-bg);color:var(--present)", "PASSED");
  if (m.probationFailed) return tag("inactive-tag", "", "FAILED");
  return tag("prob-tag", "background:var(--present-bg);color:var(--present)", "ACTIVE");
}
// ─── Roster profile data ──────────────────────────────────────────────────
// Attendance: getMemberList().attendanceRate / attended / totalSessions when the
// backend sends them; otherwise the getMemberHistory() figure, fetched when the
// profile opens (the same number the By member view shows). Never estimated.
// Rank: the scoreboard's own rank (getScoreboard("All"), current Competitive /
// Dense mode) — management only, like every other rank in the app.
var memberDetailMode = "view";          // "view" | "edit" — async loads never repaint an open edit form
var memberAttCache = {}, memberAttPending = {};
var memberDetailsCache = {}, memberDetailsPending = {}, memberInfoOpen = false;
var rosterRanks = null, rosterRanksLoading = false;

function hasServerFn(fn) {
  return !!(window.google && google.script && google.script.run && typeof google.script.run[fn] === "function");
}
function attColor(r) { return r >= 80 ? 'var(--present)' : r >= 60 ? 'var(--gold)' : 'var(--crimson)'; }
function memberAttendance(m) {
  if (!m) return null;
  if (typeof m.attendanceRate === "number") return { rate: m.attendanceRate, attended: m.attended || 0, total: m.totalSessions || 0 };
  return memberAttCache[m.name] || null;
}
// Same aggregation as renderMemberHistory(): Present + Late (either) over every row.
function attFromHistory(r) {
  var att = 0, tot = 0, st = (r && r.stats) || {};
  for (var g in st) {
    att += (st[g].Present || 0) + (st[g]["Late Excused"] || 0) + (st[g]["Late Unexcused"] || 0);
    tot += st[g].total || 0;
  }
  return { rate: tot ? Math.round((att / tot) * 100) : 0, attended: att, total: tot };
}
function rosterAttBar(m) {
  var a = memberAttendance(m);
  if (!a || !a.total) {
    var why = !a ? 'Opens with the member\u2019s profile' : a.failed ? 'Unavailable' : 'No sessions recorded yet';
    return '<div class="att-bar is-empty" title="' + why + '"><div class="att-bar-track"></div><span class="att-bar-label">\u2014</span></div>';
  }
  return '<div class="att-bar" title="' + a.attended + ' of ' + a.total + ' sessions"><div class="att-bar-track"><div class="att-bar-fill" style="width:' + a.rate + '%;background:' + attColor(a.rate) + '"></div></div><span class="att-bar-label">' + a.rate + '%</span></div>';
}
function loadMemberAttendance(name) {
  if (memberAttPending[name] || memberAttCache[name]) return;
  memberAttPending[name] = true;
  google.script.run.withSuccessHandler(function (r) {
    delete memberAttPending[name];
    memberAttCache[name] = attFromHistory(r);
    renderMemberList();
    refreshMemberDetailView(name);
  }).withFailureHandler(function () {
    delete memberAttPending[name];
    memberAttCache[name] = { rate: 0, attended: 0, total: 0, failed: true };
    refreshMemberDetailView(name);
  }).getMemberHistory(name);
}

function setRosterRanks(rows) {
  rosterRanks = { byName: {}, count: (rows || []).length };
  (rows || []).forEach(function (r) { rosterRanks.byName[r.name] = r; });
}
function loadRosterRanks() {
  if (!isManagement() || rosterRanks || rosterRanksLoading) return;
  rosterRanksLoading = true;
  google.script.run.withSuccessHandler(function (rows) {
    rosterRanksLoading = false;
    setRosterRanks(rows);
    refreshMemberDetailView(selectedMemberName);
  }).withFailureHandler(function () {
    rosterRanksLoading = false;
    rosterRanks = { byName: {}, count: 0, failed: true };
    refreshMemberDetailView(selectedMemberName);
  }).getScoreboard("All");
}
function memberRankInfo(m) {
  if (!rosterRanks) return { num: '\u2026', sub: 'LOADING' };
  if (rosterRanks.failed) return { num: '\u2014', sub: 'SCOREBOARD UNAVAILABLE' };
  var r = rosterRanks.byName[m.name];
  if (r) return { num: '#' + (sbRankMode === 'competitive' ? r.compRank : r.denseRank), sub: 'OF ' + rosterRanks.count + ' \u00b7 ' + r.totalPoints + ' PTS' };
  if (isOnHiatus(m)) return { num: '\u2014', sub: 'ON HIATUS \u00b7 UNRANKED' };
  if (!m.active) return { num: '\u2014', sub: 'INACTIVE \u00b7 UNRANKED' };
  if (m.probation) return { num: '\u2014', sub: 'ON PROBATION \u00b7 UNRANKED' };
  return { num: '\u2014', sub: 'NOT ON SCOREBOARD' };
}
function mdStat(label, num, sub) {
  return '<div class="md-stat"><div class="eyebrow" style="font-size:9px">' + label + '</div>'
       + '<div class="num">' + num + '</div><div class="md-stat-sub">' + sub + '</div></div>';
}

// Additional info (Member Details) — read-only on the profile, no Edit needed.
// getMemberDetails(name) when the backend has it (management + view-only, scoped);
// until then full admins read it through getMemberForEdit(name).
function canViewMemberDetails() {
  return isFullAdmin() || (isManagement() && hasServerFn("getMemberDetails"));
}
function loadMemberDetails(name) {
  if (memberDetailsPending[name]) return;
  memberDetailsPending[name] = true;
  var useNew = hasServerFn("getMemberDetails");
  var run = google.script.run.withSuccessHandler(function (r) {
    delete memberDetailsPending[name];
    memberDetailsCache[name] = (useNew ? r : (r && r.details)) || {};
    paintMemberInfo(name);
  }).withFailureHandler(function (e) {
    delete memberDetailsPending[name];
    memberDetailsCache[name] = { __error: serverError(e) };
    paintMemberInfo(name);
  });
  if (useNew) run.getMemberDetails(name); else run.getMemberForEdit(name);
}
function fmtDob(v) {
  var p = String(v || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!p) return v || "";
  var mn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return Number(p[3]) + ' ' + mn[Number(p[2]) - 1] + ' ' + p[1];
}
function memberInfoHtml(name) {
  var d = memberDetailsCache[name];
  if (d === undefined) { loadMemberDetails(name); return '<div class="md-info-loading"><div class="spinner"></div></div>'; }
  if (d.__error) return '<p class="md-info-note">' + esc(d.__error) + '</p>';
  var keys = ['courseFaculty','courseName','yearOfStudy','gender','dateOfBirth','nationality','residence','passportNumber','nationalIdNumber','nokName','nokRelationship','nokPhone','nokResidence'];
  if (!keys.some(function (k) { return d[k] && String(d[k]).trim(); }) && !(d.redacted || []).length) {
    return '<p class="md-info-note">No additional details on file yet. They are collected at onboarding.</p>';
  }
  // Section admins get passport, national ID and next of kin blank, listed in redacted[].
  var red = d.redacted || [];
  function row(k, v, key) {
    var hidden = key && red.indexOf(key) !== -1;
    return '<div class="md-kv"><span class="k">' + k + '</span><span class="v">'
         + (hidden ? '<span class="restricted" title="Full admins only">Restricted</span>' : v ? esc(v) : '<span class="nil">\u2014</span>') + '</span></div>';
  }
  function block(t, rows) { return '<div class="eyebrow" style="margin:14px 0 6px;font-size:9.5px">' + t + '</div><div class="md-box">' + rows + '</div>'; }
  return block('Academic', row('FACULTY', d.courseFaculty) + row('COURSE', d.courseName) + row('YEAR', d.yearOfStudy))
       + block('Personal', row('GENDER', d.gender) + row('BORN', fmtDob(d.dateOfBirth)) + row('NATIONALITY', d.nationality)
               + row('RESIDENCE', d.residence) + row('PASSPORT', d.passportNumber, 'passportNumber') + row('NATIONAL ID', d.nationalIdNumber, 'nationalIdNumber'))
       + block('Next of kin', row('NAME', d.nokName, 'nokName') + row('RELATIONSHIP', d.nokRelationship, 'nokRelationship') + row('PHONE', d.nokPhone, 'nokPhone') + row('RESIDENCE', d.nokResidence, 'nokResidence'))
       + (red.length ? '<p class="md-info-foot">Identity documents and next of kin are visible to full admins only.</p>' : '');
}
function memberInfoSection(m) {
  if (!canViewMemberDetails()) return "";
  return '<button type="button" class="ep-toggle" onclick="toggleMemberInfo()">'
       +   (memberInfoOpen ? '\u25be Hide additional info' : '\u25b8 Show additional info') + '</button>'
       + (memberInfoOpen ? '<div class="md-info" id="mdInfo">' + memberInfoHtml(m.name) + '</div>' : '');
}
function toggleMemberInfo() { memberInfoOpen = !memberInfoOpen; renderMemberDetail(); }
function paintMemberInfo(name) {
  if (memberDetailMode !== "view" || selectedMemberName !== name) return;
  var el = document.getElementById("mdInfo");
  if (el) el.innerHTML = memberInfoHtml(name);
  fitMemberDetailPane();
}
function refreshMemberDetailView(name) {
  if (name && memberDetailMode === "view" && selectedMemberName === name) renderMemberDetail();
}

// Desktop: the profile / edit pane scrolls on its own and always fits the
// viewport, so a long Edit Profile never makes you scroll the whole page.
function fitMemberDetailPane() {
  var dp = document.querySelector("#membersRosterPane .two-pane-detail");
  if (!dp) return;
  var desktop = window.matchMedia && window.matchMedia("(min-width: 1024px)").matches;
  if (!desktop || !dp.offsetParent) { dp.style.maxHeight = ""; return; }
  var top = Math.max(28, dp.getBoundingClientRect().top);
  dp.style.maxHeight = Math.max(260, window.innerHeight - top - 24) + "px";
}
function resetMemberDetailScroll() {
  var dp = document.querySelector("#membersRosterPane .two-pane-detail");
  if (dp) dp.scrollTop = 0;
}
window.addEventListener("scroll", fitMemberDetailPane, { passive: true });
window.addEventListener("resize", fitMemberDetailPane);

function selectMember(name) {
  selectedMemberName = name;
  renderMemberList();
  renderMemberDetail();
  resetMemberDetailScroll();
  // Mobile master-detail: bring the member's detail into view instead of
  // letting it render far below the list. Swap the list out for the detail
  // and scroll back to the top so the profile starts where the user is looking.
  var isDesktop = window.matchMedia && window.matchMedia('(min-width: 1024px)').matches;
  if (!isDesktop) {
    var pane = document.getElementById("membersRosterPane");
    if (pane) pane.classList.add("detail-open");
    window.scrollTo(0, 0);
  }
}

// Mobile: return from a member's detail back to the roster list.
function closeMemberDetail() {
  var pane = document.getElementById("membersRosterPane");
  if (pane) pane.classList.remove("detail-open");
  selectedMemberName = null;
  renderMemberList();
  renderMemberDetail();
  window.scrollTo(0, 0);
}

function renderMemberDetail() {
  var c = document.getElementById("memberDetailPane");
  if (!c) return;
  memberDetailMode = "view";
  if (!selectedMemberName) {
    c.innerHTML = '<div class="empty-pane">Select a member to see their profile.</div>';
    return;
  }
  var m = null;
  for (var i = 0; i < memberListData.length; i++) {
    if (memberListData[i].name === selectedMemberName) { m = memberListData[i]; break; }
  }
  if (!m) { c.innerHTML = '<div class="empty-pane">Member not found.</div>'; return; }

  // Mobile-only back affordance (hidden on desktop via CSS).
  var backBtn = '<button class="back-btn member-detail-back" onclick="closeMemberDetail()"><span style="font-family:var(--f-display);font-size:14px">\u2190</span> Back to roster</button>';

  var initial = (m.name || '\u00b7').trim().charAt(0).toUpperCase();
  var status = memberStatusBadges(m, "font-size:9.5px;padding:3px 7px");

  var rolesHtml = '';
  for (var g = 0; g < m.groups.length; g++) {
    var grp = m.groups[g], rl = m.roles && m.roles[grp] ? m.roles[grp] : '';
    rolesHtml += '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--paper-200)">'
              +    '<span class="form-label" style="margin:0">' + esc(grp).toUpperCase() + '</span>'
              +    '<span style="font-size:13px;color:var(--ink);font-weight:500">' + esc(rl || '\u2014') + '</span>'
              + '</div>';
  }

  // Profile header
  var h = backBtn + '<div class="card" style="padding:22px 24px">'
        +   '<div style="display:flex;align-items:center;gap:14px;margin-bottom:18px">'
        +     memberAvatar(m.profilePhoto, initial, { size: 56, font: 24, bg: 'var(--paper-200)' })
        +     '<div style="flex:1;min-width:0">'
        +       '<div class="display" style="font-size:22px;line-height:1.1">' + esc(m.name) + '</div>'
        +       '<div style="display:flex;align-items:center;gap:6px;margin-top:4px">'
        +         '<span style="font-family:var(--f-mono);font-size:10px;color:var(--ink-500);letter-spacing:.12em">' + (m.groups || []).map(function(g){ return g.toUpperCase(); }).join(' \u00b7 ') + '</span>'
        +       '</div>'
        +       '<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">' + status + '</div>'
        +     '</div>'
        +   '</div>';

  // Attendance (real figure) + scoreboard rank (management only)
  var att = memberAttendance(m);
  if (!att) loadMemberAttendance(m.name);
  var showRank = isManagement();
  if (showRank) loadRosterRanks();
  var attNum = !att ? '\u2026' : (att.total ? att.rate + '%' : '\u2014');
  var attSub = !att ? 'LOADING' : att.failed ? 'UNAVAILABLE' : att.total ? att.attended + ' OF ' + att.total + ' SESSIONS' : 'NO SESSIONS YET';
  var rk = showRank ? memberRankInfo(m) : null;
  h += '<div class="md-stats' + (showRank ? '' : ' one') + '">'
    +    mdStat('ATTENDANCE', attNum, attSub)
    +    (rk ? mdStat('RANK', rk.num, rk.sub) : '')
    + '</div>';

  // Groups & roles
  h += '<div class="eyebrow" style="margin-bottom:6px;font-size:9.5px">Groups & roles</div>'
    +  '<div style="margin-bottom:16px">' + rolesHtml + '</div>';

  // Contact
  h += '<div class="eyebrow" style="margin-bottom:6px;font-size:9.5px">Contact</div>'
    +  '<div style="padding:12px 14px;background:var(--paper);border-radius:10px;border:1px solid var(--paper-200);margin-bottom:16px">';
  if (m.email) {
    h += '<div style="display:flex;justify-content:space-between;margin-bottom:8px">'
      +    '<span style="font-family:var(--f-mono);font-size:10px;color:var(--ink-500);letter-spacing:.1em">EMAIL</span>'
      +    '<span style="font-size:11.5px;color:var(--ink)">' + esc(m.email) + '</span>'
      + '</div>';
  }
  if (m.phone) {
    h += '<div style="display:flex;justify-content:space-between;margin-bottom:8px">'
      +    '<span style="font-family:var(--f-mono);font-size:10px;color:var(--ink-500);letter-spacing:.1em">PHONE</span>'
      +    '<span style="font-family:var(--f-mono);font-size:11.5px;color:var(--ink)">' + esc(m.phone) + '</span>'
      + '</div>';
  }
  if (m.admNo) {
    h += '<div style="display:flex;justify-content:space-between">'
      +    '<span style="font-family:var(--f-mono);font-size:10px;color:var(--ink-500);letter-spacing:.1em">ADM NO</span>'
      +    '<span style="font-family:var(--f-mono);font-size:11.5px;color:var(--ink)">' + esc(m.admNo) + '</span>'
      + '</div>';
  }
  h += '</div>';

  // Probation section — detailed progress when on probation
  if (m.probation) {
    var attended = m.probationAttended || 4;
    var maxSess  = m.probationMax || 10;
    var remaining = maxSess - attended;
    var pRate = Math.round((attended / maxSess) * 100);
    var pColor = pRate >= 80 ? 'var(--present)' : pRate >= 50 ? 'var(--gold)' : 'var(--crimson)';
    var behindLabel = pRate >= 80 ? 'ON TRACK' : 'BEHIND';
    var behindColor = pRate >= 80 ? 'var(--present)' : 'var(--crimson-600)';
    h += '<div class="eyebrow" style="margin-bottom:6px;font-size:9.5px">Probation</div>'
      +  '<div style="padding:14px 16px;background:var(--crimson-100);border-radius:10px;margin-bottom:14px">'
      +    '<div style="display:flex;justify-content:space-between;margin-bottom:8px">'
      +      '<span style="font-size:12.5px;font-weight:600;color:var(--crimson-600)">' + behindLabel + '</span>'
      +      '<span style="font-family:var(--f-mono);font-size:10px;font-weight:700;color:var(--crimson-600);letter-spacing:.1em">' + attended + ' / ' + maxSess + '</span>'
      +    '</div>'
      +    '<div style="height:6px;border-radius:4px;background:#fff;overflow:hidden;margin-bottom:10px">'
      +      '<div style="width:' + pRate + '%;height:100%;background:' + pColor + '"></div>'
      +    '</div>'
      +    '<div style="font-size:11.5px;color:var(--ink-700)">'
      +      (m.probationStart ? 'Started ' + esc(m.probationStart) + '. ' : '')
      +      'Needs ' + (Math.ceil(maxSess * 0.8) - attended) + ' of the next ' + remaining + ' sessions to remain in the chorale.'
      +    '</div>'
      + '</div>';
  } else if (m.probationPassed) {
    h += '<div class="eyebrow" style="margin-bottom:6px;font-size:9.5px">Probation</div>'
      +  '<div style="padding:14px 16px;background:var(--present-bg);border-radius:10px;margin-bottom:14px">'
      +    '<div style="display:flex;justify-content:space-between;align-items:center">'
      +      '<span style="font-size:12.5px;font-weight:600;color:var(--present)">Passed</span>'
      +      (m.probationPenalty < 0 ? '<span style="font-family:var(--f-mono);font-size:10px;color:var(--crimson-600);letter-spacing:.1em">PENALTY ' + m.probationPenalty + ' PTS</span>' : '')
      +    '</div>'
      +    (m.probationStart ? '<div style="font-size:12px;color:var(--ink-700);margin-top:6px">Started ' + esc(m.probationStart) + '</div>' : '')
      +    (m.probationEnd   ? '<div style="font-size:12px;color:var(--ink-700)">Completed ' + esc(m.probationEnd) + '</div>'  : '')
      + '</div>';
  } else if (m.probationFailed) {
    h += '<div class="eyebrow" style="margin-bottom:6px;font-size:9.5px">Probation</div>'
      +  '<div style="padding:14px 16px;background:var(--crimson-100);border-radius:10px;margin-bottom:14px">'
      +    '<div style="font-size:12.5px;font-weight:600;color:var(--crimson-600)">Did not pass</div>'
      +    (m.probationStart ? '<div style="font-size:12px;color:var(--ink-700);margin-top:6px">Started ' + esc(m.probationStart) + '</div>' : '')
      +    '<div style="font-size:12px;color:var(--ink-700);margin-top:4px">Below the minimum attendance requirement. Account deactivated.</div>'
      + '</div>';
  }

  // Actions — inactive members get the direct Reinstate route (admin / section admin);
  // active members keep Edit profile + Record offense.
  var safeNm = esc(m.name).replace(/'/g, "\\'");
  var canReinstate = (userRole === "admin" || userRole === "sectionAdmin");
  var actions = "";
  if (!m.active && canReinstate) {
    // Hiatus is a planned break — reactivation returns them to active with no
    // probation, so it must not use the returning-member reinstate route.
    actions += isOnHiatus(m)
      ? '<button class="btn btn-primary" style="flex:1;padding:9px 14px;font-size:12.5px" onclick="epReactivate(\'' + safeNm + '\')">Reactivate</button>'
      : '<button class="btn btn-primary" style="flex:1;padding:9px 14px;font-size:12.5px" onclick="adminReinstateMember(\'' + safeNm + '\')">Reinstate member</button>';
  }
  if (isFullAdmin()) {
    actions += '<button class="btn btn-secondary" style="flex:1;padding:9px 14px;font-size:12.5px" onclick="showEditProfile(\'' + safeNm + '\')">Edit profile</button>';
  }
  if (m.active) {
    actions += '<button class="btn btn-green" style="flex:1;padding:9px 14px;font-size:12.5px" onclick="prefillReward(\'' + safeNm + '\')">Award reward</button>';
    actions += '<button class="btn btn-crimson" style="flex:1;padding:9px 14px;font-size:12.5px" onclick="prefillOffense(\'' + safeNm + '\')">Record offense</button>';
  }
  if (isLocked()) actions = "";   // view-only / archived year: roster detail reports, never acts
  var info = memberInfoSection(m);
  h += info;
  if (actions) h += '<div style="display:flex;gap:8px' + (info ? ';margin-top:14px' : '') + '">' + actions + '</div>';
  h += '</div>';
  c.innerHTML = h;
  fitMemberDetailPane();
}

// ─── ADMIN EDIT PROFILE ───────────────────────────────────────────────────

function showEditProfile(name) {
  if (roBlock()) return;
  selectedMemberName = name;
  var isDesktop = window.matchMedia && window.matchMedia('(min-width: 1024px)').matches;
  if (!isDesktop) {
    var pane = document.getElementById('membersRosterPane');
    if (pane) pane.classList.add('detail-open');
    window.scrollTo(0, 0);
  }
  memberDetailMode = 'edit';
  resetMemberDetailScroll();
  var c = document.getElementById('memberDetailPane');
  if (c) c.innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading profile\u2026</div></div>';
  google.script.run
    .withSuccessHandler(function (m) {
      if (memberDetailMode !== 'edit' || selectedMemberName !== name) return;   // user moved on
      if (m) memberDetailsCache[name] = m.details || {};
      renderEditProfile(m);
    })
    .withFailureHandler(function(e) { showToast(serverError(e), 'error'); renderMemberDetail(); })
    .getMemberForEdit(name);
}

function closeEditProfile() { renderMemberDetail(); }

function epCheckNameChange() {
  var orig = document.getElementById('epOriginalName');
  var cur = document.getElementById('epName');
  var warn = document.getElementById('epNameWarning');
  if (!orig || !cur || !warn) return;
  warn.style.display = cur.value.trim() !== orig.value.trim() ? 'block' : 'none';
}

function epUpdateRoleSlots() {
  ['Choir','Band','Orchestra'].forEach(function(g) {
    var cb = document.getElementById('epGroup_' + g);
    var slot = document.getElementById('epRoleSlot_' + g);
    if (cb && slot) slot.style.display = cb.checked ? 'block' : 'none';
  });
}

function toggleEditProfileDetails() {
  var s = document.getElementById('epDetailSection');
  var b = document.getElementById('epDetailToggle');
  if (!s || !b) return;
  var open = s.style.display !== 'none';
  s.style.display = open ? 'none' : 'block';
  b.innerHTML = (open ? '\u25b8 Show detailed info' : '\u25be Hide detailed info');
}

function submitEditProfile() {
  if (roBlock()) return;
  var orig = document.getElementById('epOriginalName');
  if (!orig) return;
  var nameVal = (document.getElementById('epName') || {}).value || '';
  if (!nameVal.trim()) { showToast('Name is required.', 'error'); return; }
  var groups = [];
  ['Choir','Band','Orchestra'].forEach(function(g) {
    var cb = document.getElementById('epGroup_' + g);
    if (cb && cb.checked) groups.push(g);
  });
  if (groups.length === 0) { showToast('At least one group is required.', 'error'); return; }
  var payload = {
    originalName: orig.value,
    name:   nameVal.trim(),
    email:  (document.getElementById('epEmail') || {}).value || '',
    phone:  (document.getElementById('epPhone') || {}).value || '',
    admNo:  (document.getElementById('epAdmNo') || {}).value || '',
    groups: groups,
    choirPart:      (document.getElementById('epRole_Choir') || {}).value || '',
    bandRole:       (document.getElementById('epRole_Band') || {}).value || '',
    orchestraRole:  (document.getElementById('epRole_Orchestra') || {}).value || ''
  };
  // Include details if the detail section was opened (or always)
  var ds = document.getElementById('epDetailSection');
  payload.details = {
    courseFaculty:    (document.getElementById('epFaculty') || {}).value || '',
    courseName:       (document.getElementById('epCourse') || {}).value || '',
    nationality:      (document.getElementById('epNationality') || {}).value || '',
    residence:        (document.getElementById('epResidence') || {}).value || '',
    dateOfBirth:      (document.getElementById('epDob') || {}).value || '',
    gender:           (document.getElementById('epGender') || {}).value || '',

  };
  var btn = document.getElementById('btnSaveProfile');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving\u2026'; }
  google.script.run
    .withSuccessHandler(function(r) {
      showToast(r.name + ' updated.' + (r.renamed ? ' Name changed.' : ''), 'success');
      delete memberDetailsCache[payload.originalName]; delete memberDetailsCache[r.name];
      if (r.renamed) { delete memberAttCache[payload.originalName]; rosterRanks = null; }
      selectedMemberName = r.name;
      // Refresh member list then show the updated profile
      google.script.run.withSuccessHandler(function(list) {
        memberListData = list; renderMemberList(); renderMemberDetail();
      }).withFailureHandler(function() { renderMemberDetail(); }).getMemberList();
    })
    .withFailureHandler(function(e) {
      showToast('Error: ' + e.message, 'error');
      if (btn) { btn.disabled = false; btn.textContent = 'Save changes'; }
    })
    .adminUpdateMember(payload);
}

// ── Membership status (Edit Profile) ──
// Intent-based only: no raw status dropdown, because a direct status write would
// bypass the removal/rejoin machinery (probation reset, notices, request rows).
// Current state comes from the edit payload — Member Details status + Members.active.
function epMembershipSection(m, d) {
  // Driven entirely by the server's membership.availableActions — never inferred from
  // `active` or details.memberStatus. Inferring is what previously offered on-hiatus
  // members the returning-member probation choice; a hiatus is a planned break, so
  // reactivation always returns them straight to Active with no probation.
  var ms = m.membership || {};
  var state = ms.state || (m.active ? 'active' : 'removed');
  var acts = ms.availableActions || [];
  var can = {};
  for (var i = 0; i < acts.length; i++) can[acts[i]] = true;
  var detail = (ms.detailStatus || (d && d.memberStatus) || '').trim();
  var nm = esc(m.name).replace(/'/g, "\\'");

  var BADGE = {
    active:          ['prob-tag', 'background:var(--present-bg);color:var(--present)', 'ACTIVE'],
    rejoining:       ['prob-tag', 'background:var(--gold-100);color:var(--gold-700)', 'REJOINING'],
    hiatus:          ['prob-tag', 'background:var(--gold-100);color:var(--gold-700)', 'ON HIATUS'],
    failedProbation: ['inactive-tag', '', 'PROBATION FAILED'],
    removed:         ['inactive-tag', '', 'INACTIVE']
  };
  var b = BADGE[state] || BADGE.removed;
  var badge = '<span class="' + b[0] + '"' + (b[1] ? ' style="' + b[1] + '"' : '') + '>'
            + (state === 'removed' && detail ? esc(detail).toUpperCase() : b[2]) + '</span>';

  var h = '<div class="ep-ms">'
    +   '<div class="ms-head">'
    +     '<div><div class="eyebrow">Membership status</div>'
    +     '<span class="gold-rule" style="margin:6px 0 0;width:20px"></span></div>'
    +     '<div class="ms-now"><span class="lbl">CURRENTLY</span>' + badge + '</div>'
    +   '</div>';

  var hint = state === 'hiatus'
    ? 'On an approved break — absences aren’t counted against them. Reactivating returns them to active, <b>no probation</b>.'
    : (can.reinstateProbation || can.reinstateActive)
      ? (state === 'failedProbation'
          ? 'They didn’t complete their last probation round. Reinstating restores their banked history and points — choose whether a fresh probation applies.'
          : 'Membership is inactive. Reinstating restores their banked history and points — choose whether a re-entry probation applies.')
      : (state === 'rejoining' ? 'Active and serving a re-entry probation. ' : '')
        + 'A hiatus is an approved break — absences stop counting. Removal sets the membership inactive; history and points are kept.';
  h += '<div class="ms-hint">' + hint + '</div>';

  // A reason is only recorded on the two outgoing transitions.
  if (can.setHiatus || can.remove) {
    h += '<textarea id="epMsReason" placeholder="Reason (optional) — recorded with this change"></textarea>';
  }
  // The probation/active choice belongs to reinstatement only — a hiatus member has
  // exactly one action, so no radio group is rendered for them at all.
  if (can.reinstateProbation && can.reinstateActive) {
    h += '<div class="ms-modes">'
      +    '<label><input type="radio" name="epReinstateMode" value="probation" checked>'
      +      '<span><span class="mt">Fresh probation</span><span class="md">Returns as Rejoining, serving a re-entry probation period.</span></span></label>'
      +    '<label><input type="radio" name="epReinstateMode" value="active">'
      +      '<span><span class="mt">Straight to active</span><span class="md">No probation — for correcting an accidental removal.</span></span></label>'
      +  '</div>';
  }

  var btns = '';
  if (can.setHiatus)            btns += '<button class="btn btn-secondary" onclick="epSetHiatus(\'' + nm + '\')">Set on hiatus</button>';
  if (can.remove)               btns += '<button class="btn btn-crimson" onclick="epSetInactive(\'' + nm + '\')">Remove / set inactive</button>';
  if (can.reactivateFromHiatus) btns += '<button class="btn btn-primary" onclick="epReactivate(\'' + nm + '\')">Reactivate</button>';
  if (can.reinstateProbation || can.reinstateActive) {
    var only = (can.reinstateProbation && can.reinstateActive) ? '' : (can.reinstateActive ? 'active' : 'probation');
    btns += '<button class="btn btn-primary" onclick="epReinstate(\'' + nm + '\'' + (only ? ",'" + only + "'" : '') + ')">Reinstate</button>';
  }
  if (btns) h += '<div class="ms-acts">' + btns + '</div>';

  return h + '<div class="ms-foot">Takes effect immediately — separate from Save changes.</div></div>';
}

function epMsReason() {
  var t = document.getElementById('epMsReason');
  return t ? t.value.trim() : '';
}
// After any membership change, reload the edit screen so the status block reflects
// the new state, and refresh the roster behind it.
function epMsDone(name, msg) {
  showToast(msg, 'success');
  refreshMemberList();
  showEditProfile(name);
}
function epMsFail(e) { showToast('Failed: ' + ((e && e.message) || 'unknown error'), 'error'); }

function epSetHiatus(name) {
  if (roBlock()) return;
  if (!confirm('Set ' + name + ' on hiatus? Absences stop counting while they\'re on an approved break.')) return;
  google.script.run.withSuccessHandler(function () { epMsDone(name, name + ' set on hiatus.'); })
    .withFailureHandler(epMsFail).adminSetMemberOnHiatus(name, epMsReason());
}
function epReactivate(name) {
  if (roBlock()) return;
  if (!confirm('Reactivate ' + name + '? They return to active with no probation.')) return;
  google.script.run.withSuccessHandler(function () { epMsDone(name, name + ' reactivated.'); })
    .withFailureHandler(epMsFail).adminReactivateFromHiatus(name);
}
function epSetInactive(name) {
  if (roBlock()) return;
  if (!confirm('Set ' + name + ' inactive? They lose access and must rejoin to return. History and points are kept.')) return;
  google.script.run.withSuccessHandler(function () { epMsDone(name, name + ' set inactive.'); })
    .withFailureHandler(epMsFail).adminSetMemberInactive(name, epMsReason());
}
function epReinstate(name, forced) {
  if (roBlock()) return;
  var sel = document.querySelector('input[name="epReinstateMode"]:checked');
  var mode = forced || (sel ? sel.value : 'probation');
  var msg = mode === 'active'
    ? 'Reinstate ' + name + ' straight to active, with no probation?'
    : 'Reinstate ' + name + ' on a fresh re-entry probation?';
  if (!confirm(msg)) return;
  google.script.run.withSuccessHandler(function () {
    epMsDone(name, name + (mode === 'active' ? ' reinstated as active.' : ' reinstated \u2014 re-entry probation started.'));
  }).withFailureHandler(epMsFail).adminReinstateMember(name, mode);
}

function setMembersMode(mode) {
  // Scoreboard + the disciplinary log are management-only — reps land on the roster.
  if ((mode === 'scoreboard' || mode === 'offense') && !isManagement()) mode = 'roster';
  // Add / Record offense / Award reward are write-only panes — view-only lands on the roster.
  if (isReadOnly() && (mode === 'add' || mode === 'offense' || mode === 'reward')) mode = 'roster';
  // Past years keep standings and per-member history; the roster and the write panes are live.
  if (isArchiveView() && (mode === 'roster' || mode === 'add' || mode === 'offense' || mode === 'reward')) mode = isManagement() ? 'scoreboard' : 'member';
  var btns = document.querySelectorAll('#membersModeToggle button');
  for (var b = 0; b < btns.length; b++) btns[b].className = (btns[b].getAttribute('data-mode') === mode) ? 'active' : '';
  // Leaving the roster resets the mobile master-detail back to the list view.
  if (mode !== 'roster') {
    var rp = document.getElementById('membersRosterPane');
    if (rp) rp.classList.remove('detail-open');
  }
  var panes = { roster: 'membersRosterPane', member: 'membersMemberPane', scoreboard: 'membersScoreboardPane', add: 'membersAddPane', offense: 'membersOffensePane', reward: 'membersRewardPane' };
  for (var k in panes) { var pe = document.getElementById(panes[k]); if (pe) pe.style.display = (k === mode) ? 'block' : 'none'; }
  if (mode === 'add') renderAddMemberPreview();
  if (mode === 'roster') { initMemberFilters(); requestAnimationFrame(fitMemberDetailPane); }
  // By member + Scoreboard folded in from the old View & Edit — reuse the existing render fns.
  if (mode === 'member') {
    var mr = document.getElementById('memberHistoryRoot');
    if (mr && !membersMemberInit && typeof renderByMemberView === 'function') {
      mr.innerHTML = renderByMemberView(); membersMemberInit = true;
      if (typeof loadMemberNames === 'function') loadMemberNames();
    }
  }
  if (mode === 'scoreboard') {
    var sr = document.getElementById('scoreboardRoot');
    if (sr && !membersScoreboardInit && typeof renderScoreboardView === 'function') {
      sr.innerHTML = renderScoreboardView(); membersScoreboardInit = true;
      if (typeof loadScoreboard === 'function') loadScoreboard();
    }
  }
  if (mode === 'offense') {
    var od = document.getElementById('offDate'); if (od && !od.value) od.value = todayStr();
    // Populate datalist of member names. getMemberList() is the scoped source of
    // truth; fillNameDatalists() refills once it resolves, so the first open isn't empty.
    fillNameDatalists();
    // Build a recent-offense log from member offense data if available
    loadOffenseLog();
  }
  if (mode === 'reward') {
    var rd = document.getElementById('rwDate'); if (rd && !rd.value) rd.value = todayStr();
    fillNameDatalists();
    loadRewardCategories();
    loadRewardLog();
  }
}

// ─── AWARD / OFFENSE NAME PICKERS ─────────────────────────────────────────
// Both the offense and reward forms search the same list. getMemberList() is the
// scoped source of truth (the backend already filters it by role), so fetch it
// once and refill the datalists when it lands — reading a cache synchronously on
// open left the pickers empty the first time.
var awardNames = [];

function paintNameDatalists() {
  var opts = awardNames.map(function (n) { return '<option value="' + esc(n) + '"></option>'; }).join('');
  ['offNameList', 'rwNameList'].forEach(function (id) {
    var dl = document.getElementById(id);
    if (dl) dl.innerHTML = opts;
  });
}

function fillNameDatalists() {
  if (awardNames.length) { paintNameDatalists(); return; }
  // Seed from whatever is already loaded so the picker is never dead on arrival…
  if (memberListData && memberListData.length) {
    awardNames = memberListData.map(function (m) { return m.name; });
  } else if (memberNames && memberNames.length) {
    awardNames = memberNames.slice();
  }
  paintNameDatalists();
  // …then take the authoritative scoped list.
  if (!google.script.run || typeof google.script.run.getMemberList !== "function") return;
  google.script.run.withSuccessHandler(function (list) {
    if (!list || !list.length) return;
    memberListData = memberListData && memberListData.length ? memberListData : list;
    awardNames = list.map(function (m) { return m.name; }).filter(Boolean);
    paintNameDatalists();
  }).withFailureHandler(function () { /* keep the seeded list */ }).getMemberList();
}

function knownMemberName(v) {
  return awardNames.indexOf(v) !== -1;
}

// ─── REWARDS ──────────────────────────────────────────────────────────────
// The positive counterpart to offenses. Categories come from the Config sheet:
// a fixed category's value is not overridable (the backend ignores an override),
// so only variable categories get an editable points field.
var rewardCategories = [], rewardLog = [];

function loadRewardCategories() {
  if (!google.script.run || typeof google.script.run.getRewardCategories !== "function") return;
  google.script.run.withSuccessHandler(function (cats) {
    rewardCategories = cats || [];
    var sel = document.getElementById('rwCategory');
    if (!sel) return;
    sel.innerHTML = rewardCategories.map(function (c) {
      return '<option value="' + esc(c.category) + '">' + esc(c.category) + (c.variable ? '' : ' · +' + c.points) + '</option>';
    }).join('');
    onRewardCategoryChange();
  }).withFailureHandler(function () { rewardCategories = []; }).getRewardCategories();
}

function currentRewardCategory() {
  var sel = document.getElementById('rwCategory');
  var v = sel ? sel.value : '';
  for (var i = 0; i < rewardCategories.length; i++) {
    if (rewardCategories[i].category === v) return rewardCategories[i];
  }
  return null;
}

// Variable categories get the points input; fixed ones show their value read-only.
function onRewardCategoryChange() {
  var cat = currentRewardCategory();
  var inp = document.getElementById('rwPoints');
  var fixed = document.getElementById('rwPointsFixed');
  var hint = document.getElementById('rwPointsHint');
  var title = document.getElementById('rwEffectTitle');
  if (!inp || !fixed) return;
  if (cat && cat.variable) {
    inp.style.display = '';
    fixed.style.display = 'none';
    if (hint) hint.textContent = 'This category has no set value — you decide what it’s worth.';
  } else {
    var pts = cat ? cat.points : 1;
    inp.style.display = 'none';
    fixed.style.display = '';
    fixed.textContent = '+' + pts + ' PT' + (pts === 1 ? '' : 'S');
    if (hint) hint.textContent = 'Set by this category — not editable.';
  }
  updateRewardEffect();
}

function resolvedRewardPoints() {
  var cat = currentRewardCategory();
  if (cat && !cat.variable) return cat.points;
  var inp = document.getElementById('rwPoints');
  var v = inp ? Number(inp.value) : NaN;
  return (isNaN(v) || !inp || inp.value === '') ? 1 : v;
}

function updateRewardEffect() {
  var title = document.getElementById('rwEffectTitle');
  if (!title) return;
  var pts = resolvedRewardPoints();
  title.textContent = 'This will add ' + pts + ' point' + (pts === 1 ? '' : 's');
}

function onRewardNameInput() {
  var inp = document.getElementById("rwName");
  var warn = document.getElementById("rwNameWarn");
  if (!inp || !warn) return;
  var v = inp.value.trim();
  warn.style.display = (v && !knownMemberName(v)) ? 'block' : 'none';
}

function prefillReward(name) {
  if (roBlock()) return;
  setMembersMode('reward');
  var i = document.getElementById('rwName');
  if (i) i.value = name;
}

function loadRewardLog() {
  if (!google.script.run || typeof google.script.run.getRewardList !== "function") { renderRewardLog(); return; }
  google.script.run.withSuccessHandler(function (list) { rewardLog = list || []; renderRewardLog(); })
    .withFailureHandler(function () { rewardLog = []; renderRewardLog(); })
    .getRewardList();
}

// "[auto:perfect]" marks an automatic award — shown as a badge, never as raw text.
function rewardIsAuto(r) {
  return /\[auto:perfect\]/i.test(r.description || '') || (r.recordedBy || '') === 'System';
}
function rewardCleanDesc(r) {
  return String(r.description || '').replace(/\[auto:perfect\]/gi, '').trim();
}

function renderRewardLog() {
  var c = document.getElementById("rewardLogContent");
  if (!c) return;
  if (!rewardLog || rewardLog.length === 0) {
    c.innerHTML = '<p class="loading" style="font-size:12px">No rewards recorded yet.</p>';
    return;
  }
  var h = '<div style="background:var(--paper);border:1px solid var(--paper-200);border-radius:14px;overflow:hidden">';
  for (var i = 0; i < rewardLog.length; i++) {
    var r = rewardLog[i], auto = rewardIsAuto(r);
    h += '<div style="padding:14px 18px;border-bottom:' + (i < rewardLog.length - 1 ? '1px solid var(--paper-200)' : 'none') + '">'
      +    '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px">'
      +      '<span style="font-size:13px;font-weight:600;color:var(--ink)">' + esc(r.name) + '</span>'
      +      '<span style="font-family:var(--f-mono);font-size:10px;color:var(--ink-500);letter-spacing:.06em">' + esc(formatDateDisplay(r.date) || r.date || '') + '</span>'
      +    '</div>'
      +    '<div style="font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-500);margin-bottom:6px">' + esc(r.category || '').toUpperCase() + '</div>'
      +    (rewardCleanDesc(r) ? '<div style="font-size:12px;color:var(--ink-600);line-height:1.5;margin-bottom:8px">' + esc(rewardCleanDesc(r)) + '</div>' : '')
      +    '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
      +      '<span class="rw-pts">+' + r.points + ' PT' + (r.points === 1 ? '' : 'S') + '</span>'
      +      (auto ? '<span class="rw-auto">AUTOMATIC</span>' : '')
      +      '<span style="font-family:var(--f-mono);font-size:10px;color:var(--ink-400);letter-spacing:.08em">' + (auto ? 'AWARDED BY THE SYSTEM' : 'BY ' + esc(r.recordedBy || '—').toUpperCase()) + '</span>'
      +      '<span style="flex:1"></span>'
      +      '<button class="btn-export" onclick="removeReward(' + r.rowIndex + ',\'' + esc(r.name).replace(/'/g, "\\'") + '\')">Delete</button>'
      +    '</div>'
      + '</div>';
  }
  c.innerHTML = h + '</div>';
}

function removeReward(rowIndex, name) {
  if (roBlock()) return;
  if (!confirm("Delete this reward for " + name + "? Their points go back down.")) return;
  google.script.run.withSuccessHandler(function () {
    showToast("Reward deleted.", "success");
    loadRewardLog();
  }).withFailureHandler(function (e) { showToast("Failed: " + e.message, "error"); })
    .deleteReward(rowIndex);
}

function submitReward() {
  if (roBlock()) return;
  var name = document.getElementById("rwName").value.trim();
  var date = document.getElementById("rwDate").value;
  var desc = document.getElementById("rwDesc").value.trim();
  var sel = document.getElementById("rwCategory");
  var category = sel ? sel.value : "";
  if (!name || !date || !category || !desc) { showToast("Member, date, category and description are all needed.", "error"); return; }
  if (!knownMemberName(name)) { showToast("Pick a member from the list.", "error"); return; }
  var cat = currentRewardCategory();
  // A fixed category's value wins server-side, so only send points for variable ones.
  var points = (cat && cat.variable) ? resolvedRewardPoints() : "";
  var done = beginAction("reward", [document.getElementById("btnAddReward")], "Awarding…");
  if (!done) return;
  google.script.run.withSuccessHandler(function (r) {
    done();
    r = r || {};
    showToast(name + " awarded +" + (r.points || resolvedRewardPoints()) + " · " + category + ".", "success");
    document.getElementById("rwName").value = "";
    document.getElementById("rwDesc").value = "";
    document.getElementById("rwNameWarn").style.display = "none";
    loadRewardLog();
  }).withFailureHandler(function (e) {
    done();
    if (isDuplicateNotice(e)) { showToast(serverError(e), "info"); return; }
    showToast(serverError(e), "error");
  }).addReward(date, name, category, desc, points);
}

function loadOffenseLog() {
  // getOffenseList() is management-only — it throws for reps and members.
  if (!isManagement()) { offenseLog = []; renderOffenseLog(); return; }
  google.script.run.withSuccessHandler(function (log) { offenseLog = log || []; renderOffenseLog(); })
    .withFailureHandler(function () { offenseLog = []; renderOffenseLog(); })
    .getOffenseList();
}
var offenseLog = [];

function prefillOffense(name) {
  if (roBlock()) return;
  setMembersMode('offense');
  var i = document.getElementById('offName');
  if (i) i.value = name;
}

// ─── 1.4  MY ATTENDANCE TAB ───────────────────────────────────────────────

function renderMyAttendance(data) {
  var c = document.getElementById("myAttContent");
  myGroups = data.groups || [];
  var firstName = (data.name || "").split(" ")[0] || "there";

  // First-run / resume onboarding gate — load config + any saved data, then pre-fill.
  if (data.onboardingCompleted === false) {
    loadConfigLists(function () {
      google.script.run.withSuccessHandler(function (ob) {
        ob = ob || {};
        uploadedPassportUrl = ob.photoUrl || "";  // persist existing photo on submit
        c.innerHTML = renderOnboardingForm(data, ob);
        flagOnboardingRequired();
      }).withFailureHandler(function () {
        c.innerHTML = renderOnboardingForm(data, {});
        flagOnboardingRequired();
      }).getOnboardingData();
    });
    return;
  }

  // Compute totals across all groups
  var totalSessions = 0, hP = 0, hL = 0, hA = 0;
  if (data.history && data.history.stats) {
    for (var gk in data.history.stats) {
      var st = data.history.stats[gk];
      totalSessions += st.total;
      hP += (st.Present || 0);
      hL += (st["Late Excused"] || 0) + (st["Late Unexcused"] || 0);
      hA += (st["Absent Excused"] || 0) + (st["Absent Unexcused"] || 0);
    }
  }
  var attended = hP + hL;
  var overallRate = totalSessions ? Math.round(((hP + hL * 0.6) / totalSessions) * 100) : 0;

  // Eyebrow: TUESDAY · 26 MAY · ALTO · CHOIR
  var nowD = new Date();
  var dayFull = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var monFull = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var ebBits = [dayFull[nowD.getDay()], nowD.getDate() + " " + monFull[nowD.getMonth()]];
  if (data.roles) { for (var rk in data.roles) { if (data.roles[rk]) ebBits.push(data.roles[rk]); } }
  ebBits = ebBits.concat(data.groups || []);
  var hrNow = nowD.getHours();
  var greet = hrNow < 12 ? "Good morning" : hrNow < 17 ? "Good afternoon" : "Good evening";

  var h = '<div class="hero-greeting">'
        +   '<div class="eyebrow">' + esc(ebBits.join(" · ").toUpperCase()) + '</div>'
        +   '<span class="gold-rule"></span>'
        +   '<div class="display" style="font-size:36px">' + greet + ',<br>' + esc(firstName) + '.</div>';
  h +=   '</div>';

  // Probation outcome banner — passed
  if (data.probationPassed && !data.probationAcknowledged) {
    var hasPenalty = data.probationPenalty && data.probationPenalty < 0;
    h += '<div class="prob-card"' + (hasPenalty ? '' : ' style="border-color:var(--present);background:var(--present-bg)"') + '>'
      +   '<div class="prob-card-title"' + (hasPenalty ? '' : ' style="color:var(--present)"') + '>' + (hasPenalty ? 'PROBATION · PASSED CONDITIONALLY' : 'WELCOME TO THE CHORALE') + '</div>'
      +   '<div class="display" style="font-size:22px;margin-bottom:8px">' + (hasPenalty ? 'You’ve passed — with a note.' : 'You’ve passed your probation.') + '</div>'
      +   '<p style="font-size:13px;color:var(--ink-700);line-height:1.55;margin-bottom:10px">'
      +     (hasPenalty
                 ? 'You’re an official member of the Chorale. Attendance during probation fell below the 80% threshold, so your pass is recorded as conditional and a one-time adjustment has been noted on your record.'
                 : 'You’re an official member of the Chorale. Congratulations on completing your probation.')
      +   '</p>'
      +   '<div class="form-label" style="margin:10px 0 6px;color:var(--ink-700)">Next steps</div>'
      +   '<ol style="font-size:13px;color:var(--ink-700);line-height:1.65;padding-left:22px;margin-bottom:14px">'
      +     '<li>Reach out to the Vice Chairperson of your section to get oriented.</li>'
      +     '<li>Pay the subscription fee to complete your registration.</li>'
      +   '</ol>'
      +   '<button class="btn btn-primary" style="padding:9px 18px;font-size:12.5px" onclick="ackProbation()">Got it</button>'
      + '</div>';
  }

  // Probation outcome banner — failed (matches canvas: crimson card with ! badge, restart form embedded)
  if (data.probationFailed && !data.probationAcknowledged) {
    h += '<div class="prob-card danger" style="padding:16px 18px">'
      +    '<div style="display:flex;align-items:flex-start;gap:12px">'
      +      '<div style="width:32px;height:32px;border-radius:999px;background:var(--crimson);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:18px;flex-shrink:0">!</div>'
      +      '<div style="flex:1">'
      +        '<div class="prob-card-title">PROBATION · DID NOT PASS</div>'
      +        '<div class="display" style="font-size:22px;margin-bottom:8px;line-height:1.15">Your account has been<br>deactivated.</div>'
      +        '<p style="font-size:13px;color:var(--ink-700);line-height:1.55;margin-bottom:0">'
      +          'Your probation period concluded below the minimum attendance requirement. You may request to restart probation below.'
      +        '</p>'
      +        '<div style="margin-top:12px;padding:12px 14px;background:#fff;border-radius:10px">'
      +          '<div class="form-label" style="margin-bottom:8px">RESTART REASON</div>'
      +          '<input type="text" id="restartReason" placeholder="Why would you like to restart?" style="margin-bottom:10px;background:var(--paper-100)">'
      +          '<button class="btn btn-crimson" style="padding:9px 14px;font-size:12.5px" onclick="requestRestart()">Request restart</button>'
      +        '</div>'
      +      '</div>'
      +    '</div>'
      + '</div>';

  // ── Top row: this term · next session ────────────────────────────────
  h += '<div class="myatt-top-grid">';

  // 1 · This term (dark hero) — the single home for sessions, rate and breakdown.
  h += '<div class="hero-rank">'
    +   '<img class="watermark" src="https://drive.google.com/thumbnail?id=1_mYJ9YIiaaTmiBc5MhxMhddihLACoquj&sz=w400" onerror="this.style.display=&#39;none&#39;">'
    +   '<div class="hero-rank-inner">'
    +     '<div style="display:flex;justify-content:space-between;align-items:center">'

    +       '<div style="flex:1"><span class="rank-pts">of ' + totalSessions + '</span> <span style="font-family:var(--f-mono);font-size:11px;color:var(--ink-300);letter-spacing:.14em">SESSIONS</span>'
    +         '<div style="font-family:var(--f-sans);font-size:11.5px;color:var(--ink-300);margin-top:4px">' + (data.probation ? 'Probation in progress.' : 'Attended and on record.') + '</div>'
    +       '</div>'
    +       '<div style="text-align:right"><span class="hero-rate">' + overallRate + '<span>%</span></span>'
    +         '<div style="font-family:var(--f-mono);font-size:10px;color:var(--ink-300);letter-spacing:.14em">ATTENDANCE</div>'
    +       '</div>'
    +     '</div>'
    +     '<div class="hero-bar"><span style="width:' + overallRate + '%"></span></div>'
    +     '<div class="breakdown">'
    +       '<span><b>' + hP + '</b> present</span><span><b>' + hL + '</b> late</span><span><b>' + hA + '</b> absent</span>'
    +     '</div>'
    +   '</div>'
    + '</div>';

  // 2 · Next session (dashed card — filled by paintMyAttNextSession). The card and
  // the emergency door share one grid cell so the door tracks the card at every

  h += '<div class="next-session-cell">'
    +  '<div class="next-session-card" id="myAttNextSession">'
    +    '<div class="eyebrow" style="color:var(--ink-700)">Next session</div>'
    +    '<p style="font-size:12px;color:var(--ink-500);margin-top:12px">Checking the schedule…</p>'
    +  '</div>'
    +  '<div id="myAttEmergencyDoor" style="display:none"></div>'
    + '</div>';
  h += '</div>';

  // Probation progress (active)
  if (data.probation && data.probationInfo) {
    var pi = data.probationInfo;
    var pColor = pi.onTrack ? "var(--present)" : "var(--gold)";

      +      '<span style="font-size:13px;color:var(--ink-700)">Since ' + pi.probationStart + '</span>'
      +      '<span class="num" style="font-size:24px;color:' + pColor + '">' + pi.rate + '%</span>'
      +    '</div>'
      +    '<div class="stat-bar"><div class="stat-bar-fill" style="width:' + pPct + '%;background:' + pColor + '"></div></div>'
      +    (pi.remaining > 0 ? '<div style="font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-500);margin-top:8px">' + pi.remaining + ' SESSIONS REMAINING</div>' : '')

  // ── Lower row: recent sessions · my apologies ───────────────────────
  h += '<div class="myatt-lower-grid">';

  h += '<div>'
    +    '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">'
    +      '<div class="eyebrow">Recent sessions</div>'
    +      '<span style="font-size:12px;color:var(--ink-500)">This term</span>'
    +    '</div>';
  if (data.history && data.history.records && data.history.records.length > 0) {
    h += '<div style="background:var(--paper);border:1px solid var(--paper-200);border-radius:14px;overflow:hidden">';
    for (var i = 0; i < data.history.records.length; i++) {
      var r = data.history.records[i];
      var railColor = statusColor(r.status);
      var subLine = (r.kind && r.time) ? (esc(r.kind) + ' · ' + esc(r.time)) : (esc(r.group).toUpperCase() + ' · ' + esc(r.role).toUpperCase());
      h += '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:' + (i < data.history.records.length - 1 ? '1px solid var(--paper-200)' : 'none') + '">'

  // Right · My apologies (desktop — on mobile this lives in the Apology tab)

    +    '<div class="eyebrow" style="margin-bottom:10px">My apologies</div>'
    +    '<div style="background:var(--paper);border:1px solid var(--paper-200);border-radius:14px;padding:14px 16px">'
    +      '<div id="myApologiesContent">' + myApologiesHtml + '</div>'
    +    '</div>'
    +  '</div>';

  h += '</div>';

  c.innerHTML = h;
  paintMyAttNextSession();
}

// Short date — "Tue · 26 May" (no year)
function formatDateShort(ds) {
  if (!ds) return "";
  var p = String(ds).split("-");
  if (p.length < 3) return esc(String(ds));
  var d = new Date(p[0], p[1] - 1, p[2]);
  var dn = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var mn = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return dn[d.getDay()] + " · " + d.getDate() + " " + mn[d.getMonth()];
}

// "18:00" → "6:00 PM" (compact: "16:00" → "4 PM"). Pass-through for non-HH:MM strings.
function fmtTime12(t, compact) {
  if (!t) return "";
  var m = String(t).match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return esc(String(t));
  var hrs = parseInt(m[1], 10), mins = m[2];
  var ap = hrs >= 12 ? "PM" : "AM";
  hrs = hrs % 12 || 12;
  return (compact && mins === "00") ? (hrs + " " + ap) : (hrs + ":" + mins + " " + ap);
}

function statusShortLabel(st) {
  return st === "Late Excused"     ? "Late · Exc."
       : st === "Late Unexcused"   ? "Late · Unexc."
       : st === "Absent Excused"   ? "Absent · Exc."
       : st === "Absent Unexcused" ? "Absent"
       : esc(st);
}

// A session stays "current" for an hour after it starts, so the deadline-passed
// card holds on that session (and keeps offering the emergency route) instead of
// jumping to the next one the moment 6:00 PM ticks over.
// Next-session card on the My Attendance dashboard.
// Fed from getUpcomingSessions(), which keeps a session on the card for
// SESSION_GRACE_MINUTES (60) after it starts and marks those entries withinGrace /
// graceEndsAt. The server sends the session we should show, so the client does no
// grace arithmetic of its own — take the first dated entry.
var myAttNextInfo = null, myAttNextFetched = false;
function setMyAttNextSession(info) {
  if (info && info.length !== undefined) {
    var list = info;
    upcomingCache = list.slice();
    info = null;
    for (var i = 0; i < list.length; i++) {
      if (list[i] && list[i].date) { info = list[i]; break; }
    }
  }
  myAttNextInfo = info || null;
  myAttNextFetched = true;
  paintMyAttNextSession();
}
function paintMyAttNextSession() {
  var c = document.getElementById("myAttNextSession");
  if (!c || !myAttNextFetched) return;
  var info = myAttNextInfo;
  var h = '<div class="eyebrow" style="color:var(--ink-700)">Next session</div>';
  if (!info || !info.date) {
    h += '<p style="font-size:12px;color:var(--ink-500);margin-top:12px;line-height:1.5">No upcoming session on the schedule.</p>';
    c.innerHTML = h;
    paintEmergencyDoor();
    return;
  }
  var p = String(info.date).split("-");
  var mn = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var dateLine = p.length === 3 ? (parseInt(p[2], 10) + " " + mn[p[1] - 1]) : "";
  h += '<div class="display" style="font-size:24px;line-height:1.12;margin-top:8px">' + esc(info.dayName || "") + (dateLine ? '<br>' + dateLine : '') + '</div>'
    +  '<div style="font-size:12px;color:var(--ink-600);margin-top:10px;line-height:1.5">' + ((info.kind || info.type) ? esc(info.kind || info.type) + ' · ' : '') + fmtTime12(info.time)
    +    ((info.venue || info.title) ? '<br><span style="color:var(--ink-500)">' + esc(info.venue || info.title) + '</span>' : '')
    +  '</div>';
  if (info.myApology && !isReadOnly()) {
    // One apology per session: show where this one stands instead of the submit link.
    if (info.withinGrace) h += '<div style="margin-top:12px;font-size:11.5px;color:var(--ink-600);line-height:1.5">Underway now \u2014 started ' + fmtTime12(info.time) + '.</div>';
    h += myApologyStatusHtml(info.myApology);
  } else if (info.deadlinePassed) {
    // withinGrace means the session has actually begun — say so, rather than only
    // that the apology window shut.
    h += '<div style="margin-top:12px;font-size:11.5px;color:var(--crimson-600);line-height:1.5">'
      +    (info.withinGrace
            ? 'Underway now \u2014 started ' + fmtTime12(info.time) + '. The apology deadline has passed.'
            : 'The apology deadline for this session has passed.')
      + '</div>';
  } else if (isReadOnly()) {
    // View-only: the deadline is information, not an instruction — there is no apology to file.
    h += '<div style="margin-top:12px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;color:var(--ink-400)">APOLOGY DEADLINE \u00b7 ' + fmtTime12(info.deadline, true).toUpperCase() + '</div>';
  } else {
    h += '<div style="margin-top:12px;font-size:11.5px;color:var(--ink-500);line-height:1.5">Can’t make it? Submit an apology before ' + fmtTime12(info.deadline, true) + ' to be counted as excused.</div>'
      +  '<div style="margin-top:10px;font-size:12.5px;font-weight:600;color:var(--crimson);cursor:pointer" onclick="openApology()">Submit apology →</div>';
  }
  c.innerHTML = h;
  paintEmergencyDoor();
}

// The page can sit open past closesAt, so arm one timer for that moment: on expiry,
// re-ask the backend (which is authoritative) and repaint. Re-armed on every paint;
// cleared when there is nothing eligible to expire.
var emergencyExpiryTimer = null, emergencyLastBoundary = null;
function scheduleEmergencyExpiry(o) {
  if (emergencyExpiryTimer) { clearTimeout(emergencyExpiryTimer); emergencyExpiryTimer = null; }
  if (!o || !o.eligible) { emergencyLastBoundary = null; return; }
  // Two boundaries: "prominent" ends at promptUntil (door leaves the card, route
  // moves to the apology page); "hidden" ends at closesAt (route closes).
  var at = (o.phase === 'prominent' && o.promptUntil) ? o.promptUntil : o.closesAt;
  if (!at) return;
  var m = String(at).match(/^(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})/);
  if (!m) return;
  var ms = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]).getTime() - Date.now();
  // setTimeout caps at ~24.8 days; windows end the same day, but guard anyway.
  if (ms > 2147000000) return;
  // Already past on this clock: allow ONE immediate re-check per boundary. If the
  // server still answers with the same boundary (client clock ahead of server),
  // stop — otherwise this re-arms every 1.5 s forever.
  var key = (o.phase || '') + '|' + at;
  if (ms <= 0) {
    if (emergencyLastBoundary === key) return;
  }
  emergencyLastBoundary = key;
  emergencyExpiryTimer = setTimeout(function () {
    emergencyExpiryTimer = null;
    loadEmergencyApologyOption();
    // The card holds a session for SESSION_GRACE_MINUTES; refetch so it rolls over too.
    if (typeof myAttLoaded !== "undefined" && myAttLoaded) {
      google.script.run.withSuccessHandler(setMyAttNextSession)
        .withFailureHandler(function () {}).getUpcomingSessions();
    }
  }, Math.max(0, ms) + 1500);
}

// The emergency door on the card. getEmergencyApologyOption() returns a phase:
//   "prominent"  deadline → session start + 2 h  → door shows under the card
//   "hidden"     after that → midnight            → door gone; route stays on the
//                                                    apology page (syncEmergencyHint)
// The backend decides the phase; the client never computes it.
function paintEmergencyDoor() {
  var el = document.getElementById("myAttEmergencyDoor");
  if (!el) return;
  var o = emergencyOption;
  scheduleEmergencyExpiry(o);
  syncEmergencyHint();
  if (!o || !o.eligible || o.phase !== "prominent" || emergencyHasApology(o)) { el.style.display = "none"; el.innerHTML = ""; return; }
  var closes = o.closesAt ? String(o.closesAt).split(" ") : null;
  el.style.display = "block";
  el.innerHTML = '<div class="em-door" onclick="openApology(&#39;emergency&#39;)">'
    +   '<span class="em-door-mark">!</span>'
    +   '<div>'
    +     '<div style="font-size:12.5px;color:var(--ink-700);line-height:1.5">Kept away by a genuine emergency? You can still file for <b>'
    +       esc(formatDateShort(o.date)) + '</b> below</div>'
    +     '<div class="em-door-win">'
    +       (closes && closes.length === 2
              ? 'OPEN UNTIL ' + emClosesLabel(closes)
              : 'OPEN UNTIL MIDNIGHT')
    +     '</div>'
    +     '<div style="font-size:12.5px;font-weight:600;color:var(--crimson);margin-top:8px">File an emergency apology \u2192</div>'
    +   '</div>'
    + '</div>';
}

// Required onboarding fields (id → backend key). Role/part ids only count when present.
function obRequiredIds() {
  var ids = ['obFaculty','obCourse','obYearOfStudy','obNationality','obGender','obPhone','obResidence','obDOB','obPassport','obNokName','obNokPhone','obNokRel','obNokRes'];
  if (document.getElementById('obChoirPart'))     ids.push('obChoirPart');
  if (document.getElementById('obBandRole'))      ids.push('obBandRole');
  if (document.getElementById('obOrchestraRole')) ids.push('obOrchestraRole');
  return ids;
}

// Flag empty required fields so a resuming member sees exactly what’s missing.
function flagOnboardingRequired() {
  var ids = obRequiredIds();
  var missing = 0;
  for (var i = 0; i < ids.length; i++) {
    var el = document.getElementById(ids[i]);
    if (!el) continue;
    var empty = !el.value.trim();
    el.classList.toggle('needs-attention', empty);
    if (empty) missing++;
    if (!el.__obWired) {  // clear the flag as soon as they fill it
      el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', function () {
        this.classList.toggle('needs-attention', !this.value.trim());
        updateOnboardingMissingNote();
      });
      el.__obWired = true;
    }
  }
  // Photo counts as required unless one is already on file / uploaded.
  var photoMissing = !uploadedPassportUrl;
  var pv = document.getElementById('photoPreview');
  if (pv) pv.classList.toggle('needs-attention', photoMissing);
  if (photoMissing) missing++;
  setOnboardingMissingNote(missing);
}
function setOnboardingMissingNote(missing) {
  var note = document.getElementById('obMissingNote');
  if (!note) return;
  if (missing > 0) {
    note.textContent = missing + ' FIELD' + (missing === 1 ? '' : 'S') + ' STILL NEED ATTENTION';
    note.style.color = 'var(--crimson-600)';
  } else {
    note.textContent = 'ALL REQUIRED FIELDS COMPLETE \u2713';
    note.style.color = 'var(--present)';
  }
}
function updateOnboardingMissingNote() {
  var ids = obRequiredIds(), missing = 0;
  for (var i = 0; i < ids.length; i++) { var el = document.getElementById(ids[i]); if (el && !el.value.trim()) missing++; }
  if (!uploadedPassportUrl) missing++;
  setOnboardingMissingNote(missing);
}

function submitOnboarding() {
  if (roBlock()) return;
  var payload = {
    courseFaculty:    obVal("obFaculty"),
    courseName:       obVal("obCourse"),
    nationality:      obVal("obNationality"),
    phoneNumber:      obVal("obPhone"),
    residence:        obVal("obResidence"),
    dateOfBirth:      obVal("obDOB"),
    passportNumber:   obVal("obPassport"),
    nationalIdNumber: obVal("obNatID"),
    nokName:          obVal("obNokName"),
    nokPhone:         obVal("obNokPhone"),
    nokRelationship:  obVal("obNokRel"),
    nokResidence:     obVal("obNokRes"),
    gender:           obVal("obGender"),
    yearOfStudy:      obVal("obYearOfStudy"),
    photoUrl:         uploadedPassportUrl
  };
  var adm = obVal("obAdmNo");
  if (adm) payload.admissionNumber = adm;  // optional confirm
  // Role/part confirm fields — only present for the groups the member is in.
  if (document.getElementById("obChoirPart"))     payload.choirPart     = obVal("obChoirPart");
  if (document.getElementById("obBandRole"))      payload.bandRole      = obVal("obBandRole");
  if (document.getElementById("obOrchestraRole")) payload.orchestraRole = obVal("obOrchestraRole");

  // Required: every flagged field + applicable role/part + a photo on file.
  var ids = obRequiredIds(), missing = [];
  for (var i = 0; i < ids.length; i++) { var el = document.getElementById(ids[i]); if (el && !el.value.trim()) missing.push(el); }
  flagOnboardingRequired();
  if (missing.length || !uploadedPassportUrl) {
    showToast("Please complete the highlighted fields.", "error");
    if (missing[0] && missing[0].focus) missing[0].focus();
    return;
  }
  var btn = document.getElementById("btnOnboarding");
  btn.disabled = true; btn.textContent = "Submitting\u2026";
  google.script.run.withSuccessHandler(function () {
    showToast("Onboarding complete \u2014 welcome!", "success");
    myAttLoaded = false; loadMyAttendance();
  }).withFailureHandler(function (e) {
    btn.disabled = false; btn.textContent = "Complete onboarding";
    showToast("Failed: " + e.message, "error");
  }).submitOnboarding(payload);
}

// Shared photo-to-server helper (reads file, strips the data-URL prefix, sends base64)
var uploadedPassportUrl = "";  // captured Drive URL for the onboarding payload

function handlePhotoUpload(input, statusId, serverFn, previewId) {
  var f = input.files && input.files[0];
  var st = document.getElementById(statusId);
  if (!f) return;
  if (st) { st.textContent = "Uploading\u2026"; st.style.color = "var(--ink-500)"; }
  var reader = new FileReader();
  reader.onload = function () {
    var dataUrl = reader.result;
    if (previewId) { var pv = document.getElementById(previewId); if (pv) pv.innerHTML = '<img src="' + dataUrl + '" style="width:100%;height:100%;object-fit:cover">'; }
    var base64 = dataUrl.split(",")[1];
    google.script.run.withSuccessHandler(function (r) {
      if (st) { st.textContent = "Uploaded \u2713"; st.style.color = "var(--present)"; }
      if (serverFn === "uploadPassportPhoto" && r && r.url) {
        uploadedPassportUrl = r.url;
        var pv = document.getElementById("photoPreview");
        if (pv) pv.classList.remove("needs-attention");
        if (typeof updateOnboardingMissingNote === "function") updateOnboardingMissingNote();
      }
      if (serverFn === "uploadProfilePhoto" && r && r.url) { if (profileData) profileData.profilePhoto = r.url; applyAvatarPhoto(); }
    }).withFailureHandler(function () {
      if (st) { st.textContent = "Upload failed \u2014 try again"; st.style.color = "var(--crimson-600)"; }
    })[serverFn](base64, f.name, f.type);
  };
  reader.readAsDataURL(f);
}
function onPassportPhoto(input) { handlePhotoUpload(input, "obPhotoStatus", "uploadPassportPhoto", "photoPreview"); }
function onProfilePhoto(input) {
  handlePhotoUpload(input, "profPhotoStatus", "uploadProfilePhoto");
}

// Diff against the loaded profile and route each change to the right server call.
function saveProfileEdits() {
  if (roBlock()) return;
  if (!profileData) return;
  var p = profileData;
  var newName  = (document.getElementById("newNameInput").value || "").trim();
  var newPhone = (document.getElementById("profilePhone").value || "").trim();
  var reason   = (document.getElementById("profileEditReason").value || "").trim();
  var newGroups = [];
  ["Choir","Band","Orchestra"].forEach(function (g) { var el = document.getElementById("tf" + g); if (el && el.checked) newGroups.push(g); });

  var d = p.details || {};
  var newFaculty = (document.getElementById("profFaculty") || {}).value || "";
  var newCourse  = ((document.getElementById("profCourse") || {}).value || "").trim();
  var newYear    = (document.getElementById("profYear") || {}).value || "";

  var curGroups = (p.groups || []).slice().sort().join(",");
  var nameChanged   = newName && newName !== (p.name || userName);
  var phoneChanged  = newPhone !== (p.phone || "");
  var groupsChanged = newGroups.slice().sort().join(",") !== curGroups;
  var courseChanged = newFaculty !== (d.courseFaculty || "") || newCourse !== (d.courseName || "") || newYear !== (d.yearOfStudy || "");

  if (!nameChanged && !phoneChanged && !groupsChanged && !courseChanged) { showToast("Nothing changed.", "error"); return; }
  if (groupsChanged && newGroups.length === 0) { showToast("Pick at least one section.", "error"); return; }
  if ((nameChanged || groupsChanged || courseChanged) && !reason) { showToast("Add a reason — name, section and academic changes need admin approval.", "error"); return; }

  var btn = document.getElementById("btnSaveProfile");
  btn.disabled = true; btn.textContent = "Saving…";
  var pendingBits = [], doneCount = 0, total = (phoneChanged ? 1 : 0) + (nameChanged ? 1 : 0) + (groupsChanged ? 1 : 0) + (courseChanged ? 1 : 0);

  function finishOne() {
    doneCount++;
    if (doneCount < total) return;
    profilePendingMsg = pendingBits.length
      ? pendingBits.join(" · ") + " — awaiting admin approval."
      : "";
    profileMode = "view";
    renderProfile();
    showToast("Profile saved." + (pendingBits.length ? " Requests sent for approval." : ""), "success");
  }
  function fail(e) { btn.disabled = false; btn.textContent = "Save changes"; if (isDuplicateNotice(e)) { showToast(serverError(e), "info"); return; } showToast("Failed: " + e.message, "error"); }

  if (phoneChanged) {
    google.script.run.withSuccessHandler(function () { profileData.phone = newPhone; finishOne(); })
      .withFailureHandler(fail).updateMyPhone(newPhone);
  }
  if (nameChanged) {
    pendingBits.push("Name change to <b>" + esc(newName) + "</b>");
    google.script.run.withSuccessHandler(finishOne).withFailureHandler(fail)
      .requestNameChange(newName, reason);
  }
  if (groupsChanged) {
    pendingBits.push("Transfer to <b>" + newGroups.join(" · ") + "</b>");
    google.script.run.withSuccessHandler(finishOne).withFailureHandler(fail)
      .requestSectionTransfer(newGroups, reason);
  }
  if (courseChanged) {
    pendingBits.push("Academic details update");
    google.script.run.withSuccessHandler(finishOne).withFailureHandler(fail)
      .requestCourseDetailsChange({ courseFaculty: newFaculty, courseName: newCourse, yearOfStudy: newYear }, reason);
  }
}

// Request sub-line for the apology/requests queue (handles non-dated request types)
function apologySubLine(a) {
  if (a.type === "Section Transfer" || a.type === "Name Change" || a.type === "Course Details") return "REQUEST";
  if (a.endDate) return formatDateDisplay(a.date) + " \u2192 " + formatDateDisplay(a.endDate);
  return a.date ? formatDateDisplay(a.date) : "REQUEST";
}
// Inline group chips for a transfer consequence preview
function groupChipRow(arr, on) {
  var s = '<span style="display:flex;gap:6px;flex-wrap:wrap">';
  for (var i = 0; i < arr.length; i++) {
    s += '<span style="font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.08em;padding:5px 9px;border-radius:6px;background:' + (on ? 'var(--ink)' : 'var(--paper-200)') + ';color:' + (on ? 'var(--gold-300)' : 'var(--ink-600)') + ';border:1px solid ' + (on ? 'var(--ink)' : 'var(--paper-300)') + '">' + esc(arr[i]).toUpperCase() + '</span>';
  }
  return s + '</span>';
}

var apolNextInfo = null;

var myApologiesHtml = '<p class="loading" style="padding:8px 0">Loading…</p>';

// "2026-05-01" → "01 MAY"
function fmtDayMonUpper(ds) {
  if (!ds) return "";
  var p = String(ds).split("-");
  if (p.length < 3) return esc(String(ds)).toUpperCase();
  var mn = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  return String(parseInt(p[2], 10)).padStart(2, "0") + " " + (mn[p[1] - 1] || "");
}

function renderMyApologies(apols) {
  if (!apols || apols.length === 0) {
    myApologiesHtml = '<p style="font-size:12.5px;color:var(--ink-500);padding:10px 0">No apologies submitted yet.</p>';
    syncApologySlots();
    return;
  }
  var h = '';
  for (var i = 0; i < apols.length; i++) {
    var a = apols[i];
    var st = String(a.status || "");
    var pill = (st === "Applied" || st === "Approved" || st === "Accepted")
                 ? { bg: "var(--present-bg)",  c: "var(--present)" }
             : (st === "Rejected" || st === "Revoked" || st === "Expired")
                 ? { bg: "var(--crimson-100)", c: "var(--crimson-600)" }
             : (st === "Pending")
                 ? { bg: "var(--gold-100)",    c: "var(--gold-700)" }
             : { bg: "var(--paper-200)", c: "var(--ink-500)" };
    var isLong = a.kind === 'longterm' || (!a.kind && a.endDate);
    var typeLabel = isLong
      ? ('LONG-TERM ABSENCE · ' + fmtDayMonUpper(a.date) + ' → ' + fmtDayMonUpper(a.endDate))
      : apologyKindLabel(a).toUpperCase();
    var line = a.reason ? esc(a.reason) : (a.reviewNote ? esc(a.reviewNote) : "");
    h += '<div style="padding:' + (i === 0 ? '12px' : '13px') + ' 0 13px;border-top:' + (i === 0 ? 'none' : '1px solid var(--paper-200)') + '">'
      +    '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px">'
      +      '<span style="font-size:12.5px;font-weight:600;color:var(--ink)">' + formatDateShort(a.date) + '</span>'
      +      '<span style="font-family:var(--f-mono);font-size:9px;font-weight:700;letter-spacing:.12em;padding:3px 7px;border-radius:4px;background:' + pill.bg + ';color:' + pill.c + '">' + esc(st).toUpperCase() + '</span>'
      +    '</div>'
      +    (typeLabel ? '<div style="font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-500);margin-bottom:5px">' + typeLabel + '</div>' : '')
      +    (line ? '<div style="font-size:12px;color:var(--ink-600);font-style:italic;line-height:1.45">“' + line + '”</div>' : '')
      +  '</div>';
  }
  myApologiesHtml = h;
  syncApologySlots();
}

function syncApologySlots() {
  var ids = ["myApologiesContent", "myApologiesContentApol", "myApologiesContentMobile"];
  for (var i = 0; i < ids.length; i++) {

    if (el) el.innerHTML = myApologiesHtml;
  }
}

function renderTabNav() {
  var tabs = activeTabs();
  var current = activeTab || (tabs[0] && tabs[0].id);
  var nav = document.getElementById("tabNav");
  var navHtml = "";
  moreTabIds = [];

  // Mobile: more than 5 tabs → primary set + a "More" overflow sheet.
  var mobilePrimary = isReadOnly() ? ["sessions", "members", "dashboard"] : MOBILE_PRIMARY;
  if (userAccess.isAdminLike && tabs.length > 5) {
    var primary = tabs.filter(function (t) { return mobilePrimary.indexOf(t.id) !== -1; })
                      .sort(function (a, b) { return mobilePrimary.indexOf(a.id) - mobilePrimary.indexOf(b.id); });
    tabs.forEach(function (t) { if (mobilePrimary.indexOf(t.id) === -1) moreTabIds.push(t.id); });
    primary.forEach(function (t) { navHtml += navBtnHtml(t, t.id === current); });
    navHtml += '<button id="moreNavBtn" data-more="1" onclick="toggleMoreSheet()"'
            +    (moreTabIds.indexOf(current) !== -1 ? ' class="active"' : '') + '>'
            +    '<span class="glyph">\u22EF</span><span>More</span>'
            +  '</button>';
  } else {
    for (var i = 0; i < tabs.length; i++) navHtml += navBtnHtml(tabs[i], tabs[i].id === current);
  }
  nav.innerHTML = navHtml;
  renderMoreSheet();

  // Desktop sidebar — "Work" items, then a "Personal" group (My attendance), matching Chorale Design.
  function sideItemHtml(tt) {
    return '<div class="nav-item' + (tt.id === current ? ' active' : '') + '" data-tab="' + tt.id + '" onclick="switchTab(\'' + tt.id + '\')">'
         +   '<div>' + tt.label + '</div>'
         +   '<div class="hint">' + (NAV_HINTS[tt.id] || "") + '</div>'
         + '</div>';
  }
