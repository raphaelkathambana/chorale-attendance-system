// ─── IN-FLIGHT LOCKS ─────────────────────────────────────────────────────
// Sends, rewards and offenses are not de-duplicated server-side, so a double-click
// does them twice. beginAction() refuses a second start of the same key, disables
// the given buttons, and returns done() — call it in BOTH success and failure
// handlers. The key outlives a re-render, so a freshly drawn button is still guarded.
var inFlight = {};
function beginAction(key, els, busyLabel) {
  if (inFlight[key]) return null;
  inFlight[key] = true;
  var list = [];
  (els || []).forEach(function (el) { if (el) list.push({ el: el, text: el.textContent, dis: el.disabled }); });
  list.forEach(function (s) { s.el.disabled = true; s.el.setAttribute("aria-busy", "true"); });
  if (busyLabel && list[0]) list[0].el.textContent = busyLabel;
  return function done() {
    delete inFlight[key];
    list.forEach(function (s) { s.el.disabled = s.dis; s.el.removeAttribute("aria-busy"); s.el.textContent = s.text; });
  };
}
// The backend's own message, minus the "Exception: " prefix Apps Script adds.
function serverError(e) {
  var m = String((e && e.message) || e || "").replace(/^(Exception|Error):\s*/i, "").trim();
  return m || "The server didn\u2019t respond. Try again.";
}
// Every Approve / Reject / Decline / Revoke button for one queue row, so deciding
// a row locks all of its buttons, not just the one clicked.
function decisionButtons(rowIndex) {
  var re = new RegExp("^(nyApprove|nyReject|adminApprove|adminReject|adminRevoke|adminApproveRestart|approveRejoin|approveSectionTransfer|approveNameChange|approveCourseDetailsChange)\\((?:'(?:[^'\\\\]|\\\\.)*',)?" + rowIndex + "[,)]");
  return [].filter.call(document.querySelectorAll("button[onclick]"), function (b) { return re.test(b.getAttribute("onclick") || ""); });
}
function beginDecision(rowIndex) {
  var done = beginAction("decide:" + rowIndex, decisionButtons(rowIndex));
  if (!done) showToast("Still working on that request\u2026", "info");
  return done;
}

function showToast(m, t) {

  e.className = "toast " + t;

// True for the backend's duplicate-guard messages ("Already submitted ..." /
// "Still processing ..."). Show these as a neutral notice, not an error.
// (Also tolerates the "Exception: " prefix Apps Script can add to a server error.)
function isDuplicateNotice(err) {
  var m = (err && err.message) || String(err || "");

}

// admin + sectionAdmin. Elevated reps keep their register and dashboards but lose
// these (getScoreboard / getOffenseList throw for them server-side), and members
// never see points, rankings or standings at all.
function isManagement()   { return userRole === "admin" || userRole === "sectionAdmin" || userRole === "superAdmin"; }
function sectionAllowed(g) { return isFullAdmin() || userAccess.allowedSections.indexOf(g) !== -1; }

function activeTabs() {
  if (!userAccess.isAdminLike) return memberTabs;
  // Birthdays is full-admin only; elevated reps also lose Requests.
  return adminTabs.filter(function (t) {
    if (t.id === "birthdays") return isFullAdmin();
    if (t.id === "requests")  return userRole !== "elevated";
    // Activity log: full admins + Super Admin (getActivityLog requires admin level).
    if (t.id === "activity")  return userRole === "admin" || userRole === "superAdmin";
    // Chorale year: only while the backend says the new year can be started (from 1 November
    // until it's started). Full admins; Super Admin sees it preview-only.
    if (t.id === "year")      return typeof yearTabVisible === "function" && yearTabVisible();

    if (t.id === "record")    return !isReadOnly();

    // sends on an oversight account's behalf, under their own Signatures row.
    if (t.id === "communique") return !isReadOnly();

    if (btn) {
      btn.style.display = admin ? "" : "none";
      if (admin) {
        btn.href = "https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(admin)
                 + "&su=" + encodeURIComponent(subj) + "&body=" + encodeURIComponent(body);
      }
    }
    if (alt) {
      if (alt.parentNode) alt.parentNode.style.display = admin ? "" : "none";
      if (admin) alt.href = "mailto:" + admin + "?subject=" + encodeURIComponent(subj)
                          + "&body=" + encodeURIComponent(body);
    }
    return;
  }
  set("rejoinFormTitle", cfg.formTitle);

// One of "form" | "pending" | "hiatus"

  var kept = document.querySelector("#rejoinScreen .rejoin-kept");

function switchTab(tab) {
  activeTab = tab;
  // Editing state (View & Edit / Sessions) must not leak into other tabs.
  if (tab !== "view" && tab !== "sessions") { hideChangesBar(); }
  if (tab !== "sessions") { sessDetailActive = false; }
  // Apology is a sub-page of My attendance — keep "My attendance" lit in the nav.
  var navTab = (tab === "apology") ? "myatt" : tab;
  // Mobile tab buttons (primary + optional "More")
  var mBtns = document.querySelectorAll(".tab-nav button");
  for (var i = 0; i < mBtns.length; i++) {
    var b = mBtns[i];
    // toggle, not overwrite — other classes (e.g. the year tab's is-due marker) must survive
    if (b.getAttribute("data-more")) b.classList.toggle("active", moreTabIds.indexOf(navTab) !== -1);
    else b.classList.toggle("active", b.getAttribute("data-tab") === navTab);
  }
  // Sidebar items (matched by data-tab, not index)
  var sBtns = document.querySelectorAll("#sidebarNav .nav-item, #sidebarNavPersonal .nav-item");
  for (var j = 0; j < sBtns.length; j++) sBtns[j].classList.toggle("active", sBtns[j].getAttribute("data-tab") === navTab);

  // Hide all tab pages
  var allPages = ["record", "sessions", "dashboard", "probation", "requests", "view", "members", "communique", "birthdays", "activity", "myatt", "apology", "profile", "year", "yeargate"];
  for (var p = 0; p < allPages.length; p++) {
    var el = document.getElementById("tab-" + allPages[p]);
    if (el) el.classList.remove("active");
  }
  // Viewing a past year: only the views that exist per year open; the rest say why.
  var yearGated = isArchiveView() && YEAR_VIEW_TABS.indexOf(tab) === -1;
  document.getElementById("tab-" + (yearGated ? "yeargate" : tab)).classList.add("active");
  if (typeof placeYearSwitch === "function") {
    placeYearSwitch(); paintYearDue();
    // Leaving the "year has started" screen: the window has closed, so the tab goes.
    if (tab !== "year" && nyState.result) { nyState.result = null; renderTabNav(); }
  }

  // Submit area visibility (Record tab only)
  var sa = document.getElementById("submitArea");
  if (sa) {
    if (tab !== "record") sa.style.display = "none";
    else if (members.length > 0) sa.style.display = "block";
  }

  if (yearGated) { renderYearGate(tab); return; }
  if (tab === "communique"        && !communiqueLoaded) loadCommunique();
  if (tab === "birthdays"         && !birthdaysLoaded)  loadBirthdays();
  if (tab === "view"              && !viewInitialized)  initViewTab();
  if (tab === "sessions"          && !sessionsLoaded && typeof loadSessions === "function")        { sessionsLoaded = true; loadSessions(); }
  if (tab === "dashboard"         && !dashboardLoaded && typeof loadGroupDashboard === "function") { dashboardLoaded = true; loadGroupDashboard(); }
  if (tab === "probation"         && !probationTabLoaded) initProbationTab();
  if (tab === "requests"          && !requestsTabLoaded)  initRequestsTab();
  if (tab === "myatt"             && !myAttLoaded)     loadMyAttendance();
  if (tab === "apology"           && !apologyLoaded)   loadApologyTab();
  if (tab === "members")          { if (!isArchiveView() && (!memberListData || memberListData.length === 0)) refreshMemberList(); setMembersMode(activeMembersMode()); }
  if (tab === "activity"          && !activityLoaded)  loadActivityLog();
  if (tab === "year")             loadYearPage();
  if (tab === "profile")          { profileMode = "view"; loadProfile(); }
}

// "2026-06-10" → { dow:"WED", day:"10", mon:"JUN" }
function sessDateParts_(ds) {

  return {
    dow: ["SUN","MON","TUE","WED","THU","FRI","SAT"][dt.getDay()] || "",
    day: p[2] || "",
    mon: ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"][(p[1] || 1) - 1] || ""

}

function sessRoleTint(role, group) {

      || { Choir: '#F3E9CE', Band: '#F0E0CE', Orchestra: '#E1ECDF' }[group]
      || 'var(--paper-200)';

// Re-render the open session from current state (original + in-flight edits). Called on
// every status change so the tally, EDITED glow and changes-bar stay in sync.
function paintSessionDetail() {
  var d = sessCurrent;
  var mount = document.getElementById("sessionDetail");
  if (!d || !mount) return;
  var isDesktop = window.matchMedia && window.matchMedia('(min-width: 1024px)').matches;

  // Live tally from the current (possibly edited) statuses
  var counts = {}, attended = 0, total = viewRecords.length;
  for (var i = 0; i < viewRecords.length; i++) {
    var cur = viewEditedStatuses[viewRecords[i].rowIndex] || viewRecords[i].status;
    counts[cur] = (counts[cur] || 0) + 1;
    if (cur === "Present" || cur === "Late Excused" || cur === "Late Unexcused") attended++;
  }
  var rate = total ? Math.round(attended / total * 100) : 0;
  var cells = "";
  for (var s = 0; s < SESS_ORDER.length; s++) {
    var stt = SESS_ORDER[s];
    cells += '<div class="sess-tally-cell"><div class="lab"><span class="dot" style="background:' + SESS_VAR[stt] + '"></span><span class="ab">' + SESS_ABBR[stt] + '</span></div><div class="num">' + (counts[stt] || 0) + '</div></div>';
  }

  // Register grouped by ensemble → role, 2-col on desktop, with EDITED glow.
  // The Include filter narrows the rows by their saved status (so a row being corrected
  // doesn't vanish mid-edit); the tally above always covers the whole session.
  var whoSet = EXPORT_WHO_SETS[exportWho.session] || null, shown = 0;
  var byEns = {};
  for (var r = 0; r < viewRecords.length; r++) { var rc = viewRecords[r]; if (whoSet && whoSet.indexOf(rc.status) === -1) continue; shown++; (byEns[rc.group] = byEns[rc.group] || []).push(rc); }
  var ensKeys = Object.keys(byEns).sort();
  var multiEns = ensKeys.length > 1;
  var reg = isDesktop ? '<div class="view-detail-grid">' : '';
  for (var ei = 0; ei < ensKeys.length; ei++) {
    var en = ensKeys[ei];
    if (multiEns) reg += '<div class="ensemble-header"><span>' + esc(en) + '</span></div>';
    var rm = {};
    for (var k = 0; k < byEns[en].length; k++) { var rl = byEns[en][k].role || "Other"; (rm[rl] = rm[rl] || []).push(byEns[en][k]); }
    var rk = Object.keys(rm).sort(function (a, b) { return a === "Other" ? 1 : b === "Other" ? -1 : a.localeCompare(b); });
    for (var ki = 0; ki < rk.length; ki++) {
      var recs = rm[rk[ki]];
      reg += '<div class="role-group"><div class="role-group-header"><span>' + esc(rk[ki]) + '</span><span class="role-group-count">' + recs.length + '</span></div>';
      for (var mi = 0; mi < recs.length; mi++) {
        var rec = recs[mi];
        var cur2 = viewEditedStatuses[rec.rowIndex] || rec.status;
        var edited = viewEditedStatuses[rec.rowIndex] && viewEditedStatuses[rec.rowIndex] !== viewOriginalStatuses[rec.rowIndex];
        var initial = (rec.name || '\u00b7').trim().charAt(0).toUpperCase();
        var photo = (memberPhotoMap && memberPhotoMap[rec.name]) || rec.profilePhoto || "";
        reg += '<div class="member-row' + (edited ? ' row-edited' : '') + '">'
          +    '<span class="member-name">' + memberAvatar(photo, initial, { size: 26, font: 11, bg: sessRoleTint(rec.role, en) })
          +      esc(rec.name) + (edited ? ' <span class="edited-badge">EDITED</span>' : '') + '</span>'
          +    '<div class="status-five">'
          +      fiveBtn(rec.rowIndex, "P",  "Present",          cur2)
          +      fiveBtn(rec.rowIndex, "LE", "Late Excused",     cur2)
          +      fiveBtn(rec.rowIndex, "LU", "Late Unexcused",   cur2)
          +      fiveBtn(rec.rowIndex, "AE", "Absent Excused",   cur2)
          +      fiveBtn(rec.rowIndex, "AU", "Absent Unexcused", cur2)
          +    '</div>'
          + '</div>';
      }
      reg += '</div>';
    }
  }
  if (isDesktop) reg += '</div>';
  if (!shown) reg = '<div class="sess-filter-empty">No one in this register is ' + esc(EXPORT_WHO_EMPTY[exportWho.session] || "listed") + '.</div>';
  var groupsTxt = (d.groups || []).join(" \u00b7 ");
  mount.innerHTML = ''
    + '<button class="back-btn" onclick="closeSession()">\u2190 All sessions</button>'
    + '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px">'
    +   '<div><div class="eyebrow">' + esc(groupsTxt.toUpperCase()) + '</div><h2 style="margin-top:4px">' + formatDateDisplay(d.date) + '</h2>'
    +     '<div style="font-family:var(--f-mono);font-size:10.5px;color:var(--ink-500);letter-spacing:.08em;margin-top:6px">' + (d.recordedBy && d.recordedBy.length ? 'REC \u00b7 ' + esc(d.recordedBy.join(", ").toUpperCase()) : '') + '</div>' + sessScopeNoteHtml(d) + '</div>'
    +   exportControlsHtml('session', 'exportThisSession', true)
    + '</div>'
    + '<div class="sess-tally"><div><div class="sess-tally-rate-label">ATTENDANCE</div><div class="sess-tally-rate">' + rate + '%</div></div>'
    +   '<div class="sess-tally-div"></div><div class="sess-tally-counts">' + cells + '</div>'
    +   '<div style="flex:1"></div><div style="text-align:right"><div class="sess-tally-rate-label">APOLOGIES</div><div class="num" style="font-family:var(--f-display);font-size:28px;color:var(--paper);margin-top:4px">' + (d.apologyCount || 0) + '</div></div>'
    + '</div>'
    + sessWhoChipsHtml()
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><div class="eyebrow">Register \u00b7 ' + (whoSet ? shown + ' of ' + total : total) + ' members</div><span style="font-family:var(--f-mono);font-size:9.5px;color:var(--ink-400);letter-spacing:.1em">' + (canEditHistory() ? 'TAP A STATUS TO CORRECT' : 'READ-ONLY \u00b7 RECORD ACCESS') + '</span></div>'
    + reg;
  updateChangesBar();
}

// Leave the open session — drop any unsaved edits and return to the list.
function closeSession() {
  sessDetailActive = false;
  viewEditedStatuses = {};
  exportWho.session = "all";
  hideChangesBar();
  if (typeof sessShowList === "function") sessShowList();
}

// One session — CSV or PDF, filtered by the "Include" picker (statusFilter).
function exportThisSession(fmt) {
  if (!sessCurrent) return;
  var d = sessCurrent, who = exportWho.session;
  if (fmt === "pdf") {
    serverCall("exportSessionPDF", [d.date, d.sessionKey, who], openPrintHTML,
      function (e) { showToast("Export failed: " + serverError(e), "error"); });
    return;
  }
  serverCall("exportSessionCSV", [d.date, d.sessionKey, who],
    function (csv) { downloadCSV_(csv, "session-" + d.date + exportWhoSuffix("session") + ".csv"); },
    function (e) { showToast("Export failed: " + serverError(e), "error"); });
}

// The sessions list (summary rows, no status filter) — CSV or PDF.
function exportSessionsList(fmt) {
  var filters = (typeof sessGetFilters === "function") ? sessGetFilters() : { range: "month", section: "All", type: "all" };
  if (fmt === "pdf") {
    serverCall("exportSessionsListPDF", [filters], openPrintHTML,
      function (e) { showToast("Export failed: " + serverError(e), "error"); });
    return;
  }
  serverCall("exportSessionsListCSV", [filters],
    function (csv) { downloadCSV_(csv, (ACTIVE_YEAR ? "sessions-" + ACTIVE_YEAR.replace("/", "-") : "sessions") + ".csv"); },
    function (e) { showToast("Export failed: " + e.message, "error"); });
}

// ---------- GROUP DASHBOARD ----------
// Custom ranges load only once both ends are picked (and in order). Until then the
// last-rendered view stays and a quiet pill says what's missing. Used by the Group
// Dashboard, Sessions and the Activity log.
function customRangeWait(start, end) {
  if (!start || !end) return "Pick a start and end date";
  if (start > end) return "The end date is before the start date";
  return "";
}
function showRangeWait(busyId, msg) {
  var b = document.getElementById(busyId); if (!b) return;
  if (!msg) { b.hidden = true; return; }
  b.hidden = false;
  b.innerHTML = '<span class="dash-busy-pill dash-busy-wait">' + esc(msg) + '</span>';
}

function loadGroupDashboard() {
  var opts = (typeof dashGetOpts === "function") ? dashGetOpts() : { section: "All", range: "month" };
  var body = document.getElementById("dashboardBody");
  var busy = document.getElementById("dashBusy");
  function setBusy(on) {
    if (body) body.classList.toggle("is-busy", on);
    if (busy) busy.hidden = !on;
  }
  setBusy(true);
  // Custom needs both ends before it means anything — hold the last-rendered view
  // and wait rather than firing a half-specified range.
  var wait = opts.range === "custom" ? customRangeWait(opts.start, opts.end) : "";
  if (wait) { setBusy(false); showRangeWait("dashBusy", wait); return; }
  if (busy) busy.innerHTML = '<span class="dash-busy-pill"><span class="dash-busy-spin"></span>Loading</span>';
  serverCall("getGroupDashboard", [opts],
    function (d) { setBusy(false); renderGroupDashboard(d); },
    function (e) { setBusy(false); showToast("Dashboard error: " + e.message, "error"); });
}
function dashFiltersChanged() { loadGroupDashboard(); }

function dashStatCard_(label, n, total, color) {
  var pct = total ? Math.round(n / total * 100) : 0;
  return '<div class="dash-stat"><div class="dash-stat-head"><span class="dot" style="background:' + color + '"></span><span class="eyebrow" style="font-size:9.5px">' + label + '</span></div>'
       + '<div class="dash-stat-num">' + n + '</div><div class="dash-stat-sub">' + pct + '% OF RECORDS</div></div>';
}

function renderGroupDashboard(d) {
  var sc = d.statusCounts || {};
  var present = sc["Present"] || 0,
      late = (sc["Late Excused"] || 0) + (sc["Late Unexcused"] || 0);
  var total = d.totalRecords || 1;
  var sectionLabel = (d.section && d.section !== "All") ? d.section : "All sections";
  var sessN = (d.sessionsCount != null) ? d.sessionsCount : (d.trend ? d.trend.length : 0);

  // Hero (momentum tag filled by renderDashMomentum) + per-session averages
  // (renderDashAverages fills #dashAverages — averages REPLACE the raw totals).
  var rateEl = document.getElementById("dashRate");
  if (rateEl) rateEl.innerHTML =
      '<div class="dash-hero"><div class="dash-hero-eyebrow">' + esc(sectionLabel.toUpperCase()) + ' \u00b7 ATTENDANCE RATE</div>'
    +   '<div class="dash-hero-num">' + d.overallRate + '%</div>'
    +   '<div class="dash-hero-delta" id="dashMomentum"></div>'
    +   '<div class="dash-hero-sub">' + (present + late) + ' of ' + total + ' records present \u00b7 ' + sessN + ' sessions in range</div></div>'
    + '<div id="dashAverages" style="display:contents"></div>';

  // Trend chart (SVG) — data: d.trend = [{date, rate}]
  drawTrendChart(d.trend);

  // At-Risk panel
  var risk = document.getElementById("dashAtRisk");
  var sectionSel = (d.section && d.section !== "All") ? d.section : null;
  if (risk) {
    var rows = "";
    (d.nearAU || []).forEach(function (m) {
      var dots = (m.lastSessions || []).map(function (ls) {
        return '<span class="status-dot ' + statusDotClass_(ls.status) + '" title="' + esc(ls.date + ': ' + ls.status) + '"></span>';
      }).join("");
      rows += '<div class="atrisk-row"><div class="atrisk-info"><div class="atrisk-name">' + esc(m.name) + '</div>'
           +    '<div class="atrisk-meta">' + esc(dashGroupLabel_(m.groups, sectionSel)) + '</div></div>'
           +    '<div class="atrisk-dots">' + dots + '</div>'
           +    '<span class="atrisk-badge">' + m.consecutiveAU + '\u00d7 AU</span></div>';
    });
    if (!rows) rows = '<div class="atrisk-row" style="color:var(--ink-400);justify-content:center">No members at risk in this range.</div>';
    risk.innerHTML = '<div class="dash-panel-head"><div><div class="eyebrow" style="color:var(--crimson-600)">At risk \u00b7 early warning</div>'
      + '<div style="font-size:11.5px;color:var(--ink-500);margin-top:4px">2+ unexcused absences in a row \u2014 before the 3-AU penalty fires.</div></div>'
      + '<span class="big" style="color:var(--crimson-600)">' + ((d.nearAU || []).length) + '</span></div>' + rows;
  }

  // Probation panel
  var prob = document.getElementById("dashProbation");
  if (prob) {
    var fb = d.probationFallingBehind || [];
    var minis = '<div class="prob-summary"><div class="prob-mini gold"><div class="num">' + d.probationCount + '</div><div class="lab">On probation</div></div>'
              + '<div class="prob-mini ok"><div class="num">' + d.probationOnTrack + '</div><div class="lab">On track</div></div>'
              + '<div class="prob-mini bad"><div class="num">' + fb.length + '</div><div class="lab">Behind</div></div></div>';
    var list = "";
    if (fb.length) {
      list = '<div style="font-family:var(--f-mono);font-size:9.5px;color:var(--ink-400);letter-spacing:.1em;margin-bottom:8px">FALLING BEHIND</div>';
      fb.forEach(function (p) {
        // Segmented per-session bar (same design as the Probation tab) — probSegBar
        // falls back to plain fill when sessionSequence is absent.
        list += '<div class="prob-fall-row"><div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--ink)">' + esc(p.name) + '</div>'
             +    '<div style="font-family:var(--f-mono);font-size:9px;color:var(--ink-400);letter-spacing:.08em;margin-top:2px">' + probGroupsLabel(p) + '</div>'
             +    '<div class="prob-seg">' + probSegBar(p, 6) + '</div></div>'
             +    '<span style="font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--crimson-600)">' + p.rate + '%</span></div>';
      });
    }
    // scopedSection === null means the figures span every section the member belongs to
    // (probation is membership-level). It will name a section if scoping ever lands.
    var probScope = null;
    for (var si = 0; si < fb.length; si++) { if (fb[si] && fb[si].scopedSection) { probScope = fb[si].scopedSection; break; } }
    prob.innerHTML = '<div class="eyebrow" style="margin-bottom:4px">Probation \u00b7 ' + (sectionSel ? esc(sectionSel) + ' members' : 'all sections') + '</div>'
      + '<div class="panel-note">' + (probScope
          ? 'Progress counts ' + esc(probScope) + ' sessions only.'
          : 'Progress is membership-level \u2014 it counts every session the member was called to'
            + (sectionSel ? ', including any outside ' + esc(sectionSel) + '.' : '.')) + '</div>'
      + minis + list;
  }

  // v2 panels — averages strip, momentum indicator, apology analytics
  renderDashAverages(d);
  renderDashMomentum(d);
  renderDashApologies(d);

  // v3 panels — Where · Shape · When · Org state · Change
  renderDashParts(d);
  renderDashSections(d);
  renderDashDistribution(d);
  renderDashCompliance(d);
  renderDashBehaviour(d);
  renderDashTop(d);
  renderDashWhen(d);
  renderDashHealth(d);
  renderDashProbPerf(d);
  renderDashComparison(d);
  dashSyncGroups_();
}

// Group label for a dashboard row. When one section is selected, show just that
// section — a member's other groups aren't part of what's on screen, and reading
// "CHOIR · BAND" on the Choir view looks like the panel is mixing sections in.
function dashGroupLabel_(groups, sectionSel) {
  var g = groups || [];
  if (sectionSel && g.indexOf(sectionSel) !== -1) return sectionSel.toUpperCase();
  return g.join(" \u00b7 ").toUpperCase();
}

// green=Present, yellow=Late(both), grey=Absent Excused, red=Absent Unexcused → my CSS modifiers
function statusDotClass_(status) {
  if (status === "Present") return "present";
  if (status === "Late Excused" || status === "Late Unexcused") return "late";
  if (status === "Absent Excused") return "abs-exc";
  if (status === "Absent Unexcused") return "abs-unexc";
  return "abs-exc";
}

// ---------- v2: averages · momentum · apology analytics ----------
// Headcounts on an AVERAGE session — these replace the raw totals in the top stat cards.
// Backend sends 1-decimal averages; we round for display (whole people are easier to read).
function renderDashAverages(d) {
  var el = document.getElementById("dashAverages");
  if (!el) return;
  var a = d.avgPerSession || {};
  var rnd = function (v) { return Math.round(v || 0); };
  var absent = rnd((a.absentExcused || 0) + (a.absentUnexcused || 0));
  el.innerHTML =
      '<div class="dash-stat"><div class="dash-stat-head"><span class="dot" style="background:var(--present)"></span><span class="eyebrow" style="font-size:9.5px">Present</span></div>'
    +   '<div class="dash-stat-num">' + rnd(a.present) + '</div><div class="dash-stat-sub">AVG / SESSION \u00b7 ' + rnd(a.attended) + ' ATTENDED</div></div>'
    + '<div class="dash-stat"><div class="dash-stat-head"><span class="dot" style="background:var(--late-exc)"></span><span class="eyebrow" style="font-size:9.5px">Late</span></div>'
    +   '<div class="dash-stat-num">' + rnd(a.late) + '</div><div class="dash-stat-sub">AVG / SESSION</div></div>'
    + '<div class="dash-stat"><div class="dash-stat-head"><span class="dot" style="background:var(--absent-unexc)"></span><span class="eyebrow" style="font-size:9.5px">Absent</span></div>'
    +   '<div class="dash-stat-num">' + absent + '</div><div class="dash-stat-sub">' + rnd(a.absentExcused) + ' AE \u00b7 ' + rnd(a.absentUnexcused) + ' AU'
    +     (d.absenteeismRate != null ? ' \u00b7 ' + d.absenteeismRate + '% OF RECORDS' : '') + '</div></div>';
}

// "\u25b2 +6% improving / \u25bc declining / \u25ac flat" — second half of the range vs the first.
function renderDashMomentum(d) {
  var el = document.getElementById("dashMomentum");
  if (!el || !d.momentum) return;
  var m = d.momentum;
  var arrow = m.direction === "improving" ? "\u25b2" : (m.direction === "declining" ? "\u25bc" : "\u25ac");
  var cls = m.direction === "declining" ? " down" : (m.direction === "flat" ? " flat" : "");
  el.innerHTML = '<span class="tag' + cls + '">' + arrow + ' ' + (m.delta > 0 ? "+" : "") + m.delta + '%</span>'
    + '<span style="font-size:11px;color:var(--ink-300)">second half vs first (' + m.firstHalfRate + '% \u2192 ' + m.secondHalfRate + '%)</span>';
}

// Apology analytics for the range — dark card with a header (matches the tally-strip design).
function renderDashApologies(d) {
  var el = document.getElementById("dashApologies");
  if (!el) return;
  var s = d.apologyStats;
  // No apologies in range → hide, so an empty Org state group can collapse away
  // (dashSyncGroups_ counts this strip). Only innerHTML changes, so .span2 survives.
  if (!s || !s.total) { el.style.display = "none"; return; }
  el.style.display = "";
  el.innerHTML =
      '<div class="apol-head">APOLOGIES \u00b7 IN RANGE</div>'
    + '<div class="apol-row">'
    +   '<div class="apol-cell lead"><span class="num gold">' + s.total + '</span><span class="lab">Total received</span></div>'
    +   '<span class="apol-div"></span>'
    +   '<div class="apol-cell"><span class="num">' + s.absentType + '<span class="sep">/</span>' + s.lateType + '</span><span class="lab">Absence \u00b7 lateness</span></div>'
    +   '<span class="apol-div"></span>'
    +   '<div class="apol-cell"><span class="num">' + s.onTime + '<span class="sep">/</span>' + s.lateSubmission + '</span><span class="lab">On time \u00b7 late subm.</span></div>'
    +   '<span class="apol-div"></span>'
    +   '<div class="apol-cell"><span class="num ok">' + s.approved + '</span><span class="lab">Approved</span></div>'
    +   '<div class="apol-cell"><span class="num">' + s.pending + '</span><span class="lab">Pending</span></div>'
    +   '<div class="apol-cell"><span class="num bad">' + s.rejected + '</span><span class="lab">Rejected</span></div>'
    +   (s.notNeeded ? '<div class="apol-cell"><span class="num muted">' + s.notNeeded + '</span><span class="lab">Not needed</span></div>' : '')
    + '</div>';
}

// ---------- v3: grouped analytical panels ----------
// Contract: every v3 field is OPTIONAL. A panel with nothing to say hides itself,
// and dashSyncGroups_() hides a whole group once every card inside it is hidden —
// so a thin range degrades to the v2 dashboard instead of showing empty boxes.
function dashCard_(id, html) {
  var el = document.getElementById(id);
  if (!el) return;
  if (!html) { el.style.display = "none"; el.innerHTML = ""; return; }
  el.style.display = ""; el.innerHTML = html;
}
function dashHead_(title, note) {
  return '<div class="dash-card-head"><div class="eyebrow">' + title + '</div>'
    + (note ? '<span class="dash-card-note">' + note + '</span>' : '') + '</div>';
}
function dashFoot_(text) { return '<div class="dash-card-foot">' + text + '</div>'; }
function dashSyncGroups_() {
  var groups = document.querySelectorAll(".dash-group");
  for (var i = 0; i < groups.length; i++) {
    var cards = groups[i].querySelectorAll(".dash-card, .apol-strip"), shown = 0;
    for (var c = 0; c < cards.length; c++) { if (cards[c].style.display !== "none") shown++; }
    groups[i].style.display = shown ? "" : "none";
    // A [data-solo-flow] group down to one card drops its header and joins the flow,
    // so a single-section view doesn't pay a whole group header for one panel.
    if (groups[i].hasAttribute("data-solo-flow")) {
      var solo = shown === 1;
      groups[i].classList.toggle("solo", solo);
      if (solo) groups[i].classList.remove("collapsed");
    }
  }
}
function dashGroupToggle(btn) {
  var g = btn.parentNode;
  if (g && g.classList) g.classList.toggle("collapsed");
}

var DASH_MON = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
function dashDayMon_(ds) {
  var p = String(ds).split("-");
  if (p.length !== 3) return String(ds).toUpperCase();
  return parseInt(p[2], 10) + " " + (DASH_MON[parseInt(p[1], 10) - 1] || "");
}
function dashRangeLabel_(r) { return r ? (dashDayMon_(r.start) + " \u2192 " + dashDayMon_(r.end)) : ""; }
function dashMonLabel_(ym) {
  var p = String(ym).split("-");
  return DASH_MON[parseInt(p[1], 10) - 1] || String(ym).toUpperCase();
}

// WHERE · partBreakdown[] — worst rate first; the bar is the P/L/AE/AU mix behind the rate.
var DASH_MIX_C = { present: "var(--present)", late: "var(--late-exc)", ae: "var(--ink-300)", au: "var(--absent-unexc)" };
function dashMixBar_(r) {
  var t = r.total || 1, keys = ["present", "late", "ae", "au"], out = "";
  for (var i = 0; i < keys.length; i++) {
    var v = r[keys[i]] || 0;
    if (v) out += '<span style="width:' + (v / t * 100) + '%;background:' + DASH_MIX_C[keys[i]] + '"></span>';
  }
  return out;
}
function renderDashParts(d) {
  var rows = d.partBreakdown || [];
  if (!rows.length) return dashCard_("dashParts", "");
  var body = rows.map(function (r) {
    var skew = String(r.skew || "even").toLowerCase();
    return '<div class="pb-row"><div><div class="pb-name">' + esc(r.part || "\u2014") + '</div>'
      +    '<div class="pb-sec">' + esc(String(r.section || "").toUpperCase()) + ' \u00b7 ' + (r.total || 0) + ' RECORDS</div></div>'
      +  '<div class="pb-rate' + (r.rate < 75 ? ' warn' : '') + '">' + r.rate + '%</div>'
      +  '<div class="pb-bar">' + dashMixBar_(r) + '</div>'
      +  '<div class="pb-meta"><span class="skew-tag ' + esc(skew) + '">' + esc(skew) + '</span>'
      +    '<span>' + (r.present || 0) + ' P \u00b7 ' + (r.late || 0) + ' L \u00b7 ' + (r.ae || 0) + ' AE \u00b7 ' + (r.au || 0) + ' AU</span>'
      +    (skew === "clean" ? '' : '<span>' + (r.lateShare || 0) + '% OF MISSES WERE LATENESS</span>')
      +  '</div></div>';
  }).join("");
  dashCard_("dashParts", dashHead_("Part breakdown \u00b7 worst first", rows.length + ' PARTS \u00b7 % PRESENT + LATE') + body
    + dashFoot_("Rate is present + late over every record in range. The bar is the mix behind it."));
}

// Reusable measure row (section comparison · weekday · session type)
function dashMbars_(items, key) {
  return items.map(function (i) {
    var r = i.rate || 0;
    return '<div class="mbar-row"><span class="mbar-lab">' + esc(String(i[key])) + '</span>'
      + '<span class="mbar-track"><span class="mbar-fill' + (r < 75 ? ' low' : '') + '" style="width:' + Math.max(2, r) + '%"></span></span>'
      + '<span class="mbar-val">' + r + '%</span><span class="mbar-sub">' + (i.total || 0) + ' REC</span></div>';
  }).join("");
}
// Only worth showing when there is something to compare against (the All view).
function renderDashSections(d) {
  var s = d.sectionComparison || [];
  if (s.length < 2) return dashCard_("dashSections", "");
  dashCard_("dashSections", dashHead_("Section comparison", "RATE \u00b7 RECORDS") + dashMbars_(s, "section") + DASH_RATE_KEY);
}

// SHAPE · distribution — the shape a single average hides
function renderDashDistribution(d) {
  var dist = d.distribution;
  if (!dist || !dist.buckets || !dist.buckets.length || !dist.memberCount) return dashCard_("dashDistribution", "");
  var max = 1;
  dist.buckets.forEach(function (b) { if (b.count > max) max = b.count; });
  var cols = dist.buckets.map(function (b, i) {
    var cls = i === 0 ? " bad" : (i === dist.buckets.length - 1 ? " good" : "");
    var share = Math.round((b.count / dist.memberCount) * 100);
    // min-height in CSS keeps a count of 1 readable; a true zero gets no bar at all
    return '<div class="hist-col"><span class="hist-n">' + b.count + '</span>'
      + '<span class="hist-area"><span class="hist-bar' + cls + (b.count ? '' : ' zero') + '" style="height:' + Math.round(b.count / max * 100) + '%" title="' + share + '% of members"></span></span>'
      + '<span class="hist-lab">' + esc(b.label) + '</span></div>';
  }).join("");
  dashCard_("dashDistribution", dashHead_("Attendance distribution", dist.memberCount + " MEMBERS WITH RECORDS")
    + '<div class="hist">' + cols + '</div>'
    + dashFoot_("Each column counts members whose own rate falls in that band \u2014 a devoted core plus a tail reads very differently from everyone slightly absent."));
}

// SHAPE · apologyStats.complianceRate — the excused share of absences (AE / (AE + AU)).
// NOT the same as apologies filed: one long-term apology can cover several sessions,
// so the two numbers legitimately differ and the card says so.
function renderDashCompliance(d) {
  var s = d.apologyStats;
  if (!s || s.complianceRate == null) return dashCard_("dashCompliance", "");
  var sc = d.statusCounts || {}, ae = sc["Absent Excused"] || 0, au = sc["Absent Unexcused"] || 0;
  dashCard_("dashCompliance", dashHead_("Excused share", "OF ALL ABSENCES")
    + '<div class="dash-stat-num">' + s.complianceRate + '%</div>'
    + '<div class="dash-stat-sub">' + ae + ' AE \u00b7 ' + au + ' AU</div>'
    + dashFoot_("Absences that were excused." + (s.absentType
        ? " Separately, " + s.absentType + " " + (s.absentType === 1 ? "apology was" : "apologies were")
          + " filed in range \u2014 one apology can cover several sessions, so the two don\u2019t match."
        : "")));
}

// SHAPE · behaviour — this panel NAMES people, so the copy stays descriptive:
// a pattern inside one range, above a floor of chronicMin incidents. Never a verdict.
function dashBehItems_(list, kind, total) {
  if (!list.length) return '<div class="beh-item"><span class="beh-name" style="color:var(--ink-400)">None in this range.</span></div>';
  var out = list.map(function (m) {
    var n = kind === "late" ? m.late : m.absent;
    return '<div class="beh-item"><span class="beh-name">' + esc(m.name) + '</span>'
      + '<span class="beh-count ' + (kind === "late" ? "late" : "abs") + '">' + n + (kind === "late" ? " LATE" : " ABSENT") + '</span>'
      + '<span class="beh-rate">' + (m.rate != null ? m.rate + "%" : "") + '</span></div>';
  }).join("");
  if (total > list.length) out += '<div class="beh-more">+ ' + (total - list.length) + ' MORE</div>';
  return out;
}
function renderDashBehaviour(d) {
  var b = d.behaviour;
  if (!b) return dashCard_("dashBehaviour", "");
  var late = b.chronicLate || [], abs = b.chronicAbsent || [];
  var lateN = b.chronicLateCount != null ? b.chronicLateCount : late.length;
  var absN = b.chronicAbsentCount != null ? b.chronicAbsentCount : abs.length;
  if (!lateN && !absN && !b.mixed && !b.occasional && !b.spotless) return dashCard_("dashBehaviour", "");
  var cols = '<div class="beh-cols"><div><div class="beh-head"><span>Lateness-leaning</span><span>' + lateN + '</span></div>'
    + dashBehItems_(late, "late", lateN) + '</div>'
    + '<div><div class="beh-head"><span>Absence-leaning</span><span>' + absN + '</span></div>'
    + dashBehItems_(abs, "absent", absN) + '</div></div>';
  var min = b.chronicMin || 2;
  var mix = '<div class="beh-mix">'
    + '<div class="cell"><div class="num">' + (b.mixed || 0) + '</div><div class="lab">Both kinds</div>'
    +   '<div class="sub">Hit ' + min + '+ of each \u2014 neither dominant</div></div>'
    + '<div class="cell"><div class="num">' + (b.occasional || 0) + '</div><div class="lab">Below the threshold</div>'
    +   '<div class="sub">Missed something, under ' + min + '</div></div>'
    + '<div class="cell"><div class="num">' + (b.spotless || 0) + '</div><div class="lab">No incidents</div>'
    +   '<div class="sub">Never late, never absent</div></div></div>';
  dashCard_("dashBehaviour", dashHead_("Lateness vs absence", "PATTERN IN THIS RANGE") + cols + mix
    + dashFoot_("Counted from this range only, and only where the dominant kind reached " + min
      + " incidents. Every member sits in exactly one of the five \u2014 the two lists above, or one of the three counts here. A pattern to talk about, not a disciplinary record."));
}

// SHAPE · topAttenders[] — the floor is a footnote, not fine print
function renderDashTop(d) {

// WHEN · weekdayStats[] + sessionTypeStats[]

// ORG STATE · membershipHealth

// ORG STATE · probationPerformance
function renderDashProbPerf(d) {
  var p = d.probationPerformance;
  if (!p) return dashCard_("dashProbPerf", "");
  var ir = p.inRange || {}, months = p.byMonth || [];
  if (!ir.total && !months.length) return dashCard_("dashProbPerf", "");
  var minis = '<div class="prob-summary">'
    + '<div class="prob-mini ok"><div class="num">' + (ir.passed || 0) + '</div><div class="lab">Passed</div></div>'
    + '<div class="prob-mini gold"><div class="num">' + (ir.conditional || 0) + '</div><div class="lab">Conditional</div></div>'
    + '<div class="prob-mini bad"><div class="num">' + (ir.failed || 0) + '</div><div class="lab">Failed</div></div></div>';
  var byMonth = "";
  if (months.length) {
    var max = 1;
    months.forEach(function (m) { if ((m.total || 0) > max) max = m.total; });

      + months.map(function (m) {
        // Counts sit inside the segments so the by-month composition reads without hovering
        function seg(cls, n, lab) { return n ? '<div class="pp-seg ' + cls + '" style="height:' + (n / max * 100) + '%" title="' + n + ' ' + lab + '">' + n + '</div>' : ''; }
        return '<div class="pp-month"><span class="pp-n">' + (m.total || 0) + '</span><div class="pp-stack">'
          + seg("pass", m.passed, "passed") + seg("cond", m.conditional, "conditional") + seg("fail", m.failed, "failed")
          + '</div><div class="pp-lab">' + dashMonLabel_(m.month) + '</div></div>';
      }).join("") + '</div>'
      + '<div class="pp-legend"><span class="k"><i style="background:var(--present)"></i>Passed</span>'
      + '<span class="k"><i style="background:var(--gold-500)"></i>Conditional</span>'
      + '<span class="k"><i style="background:var(--crimson-500)"></i>Failed</span></div>';
  }
  dashCard_("dashProbPerf", dashHead_("Probation outcomes", ir.total ? (ir.total + " ENDED IN RANGE") : "") + minis + byMonth);
}

// CHANGE · comparison — null on custom/all ranges, and then the card (and its group) goes away.
// direction comes from the backend field verbatim; the client never re-derives it (the
// backend owns the threshold). Per-cell colour is just the sign of that cell's delta.
function dashCmpCell_(lab, now, prev, delta, suffix, goodUp) {
  var good = goodUp === false ? (delta < 0) : (delta > 0);
  var cls = !delta ? "" : (good ? " up" : " down");
  var arrow = !delta ? "\u25ac" : (delta > 0 ? "\u25b2" : "\u25bc");
  var mag = (delta > 0 ? "+" : (delta < 0 ? "\u2212" : "")) + Math.abs(delta) + (suffix === "%" ? " PTS" : "");
  return '<div class="cmp-cell"><div class="cmp-lab">' + lab + '</div><div class="cmp-now">' + now + suffix + '</div>'
    + '<div class="cmp-prev">WAS ' + prev + suffix + '</div><div><span class="cmp-delta' + cls + '">' + arrow + ' ' + mag + '</span></div></div>';
}
function renderDashComparison(d) {
  var c = d.comparison;
  if (!c) return dashCard_("dashComparison", "");
  var a = d.avgPerSession || {};
  var grid = '<div class="cmp-grid">'
    + dashCmpCell_("Attendance rate", d.overallRate, c.previousRate, c.rateDelta, "%", true)
    + dashCmpCell_("Sessions held", d.sessionsCount, c.previousSessions, c.sessionsDelta, "", true)
    + dashCmpCell_("Avg attended", (a.attended != null ? a.attended : "\u2014"), c.previousAvgAttended, c.avgAttendedDelta, "", true)
    + dashCmpCell_("Unexcused rate", d.auRate, c.previousAuRate, c.auRateDelta, "%", false)
    + '</div>';
  dashCard_("dashComparison", dashHead_("This period vs last",
    (c.direction ? String(c.direction).toUpperCase() + " \u00b7 " : "") + "PREVIOUS \u00b7 " + dashRangeLabel_(c.previousRange)) + grid);
}

// SVG area+line chart into #dashTrend (v2: hover any point for that session's full tally).
function trendXLabel_(ds) {
  var p = String(ds).split("-");
  if (p.length === 3) { var dp = sessDateParts_(ds); return dp.day + " " + dp.mon; }
  return String(ds).toUpperCase();
}
function drawTrendChart(trend) {
  var host = document.getElementById("dashTrend");
  if (!host) return;
  if (!trend || !trend.length) { host.innerHTML = '<div class="empty-pane">No data in range.</div>'; return; }
  host.style.position = "relative";
  var W = 760, H = 220, padL = 34, padR = 14, padT = 14, padB = 26, n = trend.length;
  var iw = W - padL - padR, ih = H - padT - padB;
  function x(i) { return padL + (n === 1 ? iw / 2 : i / (n - 1) * iw); }
  function y(r) { return padT + (1 - r / 100) * ih; }
  var line = trend.map(function (t, i) { return x(i) + "," + y(t.rate); }).join(" ");
  var area = "M " + x(0) + "," + y(trend[0].rate) + " " + trend.map(function (t, i) { return "L " + x(i) + "," + y(t.rate); }).join(" ") + " L " + x(n - 1) + "," + (padT + ih) + " L " + x(0) + "," + (padT + ih) + " Z";
  var grid = [0, 25, 50, 75, 100].map(function (g) {
    return '<line x1="' + padL + '" y1="' + y(g) + '" x2="' + (W - padR) + '" y2="' + y(g) + '" stroke="#E8DEC6" stroke-width="1"' + (g ? ' stroke-dasharray="3 4"' : '') + '></line>'
         + ((g % 50 === 0) ? '<text x="' + (padL - 8) + '" y="' + (y(g) + 3) + '" text-anchor="end" font-family="monospace" font-size="9" fill="#8C8478">' + g + '</text>' : '');
  }).join("");
  var dots = trend.map(function (t, i) {
    var lastp = i === n - 1;
    return '<circle cx="' + x(i) + '" cy="' + y(t.rate) + '" r="' + (lastp ? 4.5 : 2.8) + '" fill="' + (lastp ? '#B08538' : '#FBF7EE') + '" stroke="#B08538" stroke-width="2"></circle>';
  }).join("");
  // invisible, larger hover targets carrying the point index (v2 tooltip)
  var hits = trend.map(function (t, i) {
    return '<circle cx="' + x(i) + '" cy="' + y(t.rate) + '" r="11" fill="transparent" style="cursor:pointer" data-i="' + i + '" class="trend-hit"></circle>';
  }).join("");
  var xlabels = trend.map(function (t, i) {
    return (i % 2 === 0 || i === n - 1) ? '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#8C8478">' + esc(trendXLabel_(t.date)) + '</text>' : '';
  }).join("");
  var last = trend[n - 1];
  host.innerHTML = '<svg class="trend-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">'
    + '<defs><linearGradient id="trendFillLive" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#B08538" stop-opacity="0.22"></stop><stop offset="100%" stop-color="#B08538" stop-opacity="0"></stop></linearGradient></defs>'
    + grid
    + '<path d="' + area + '" fill="url(#trendFillLive)"></path>'
    + '<polyline points="' + line + '" fill="none" stroke="#B08538" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>'
    + dots + hits + xlabels
    + '<text x="' + x(n - 1) + '" y="' + (y(last.rate) - 12) + '" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#14110F">' + last.rate + '%</text>'
    + '</svg>'
    + '<div id="trendTip" class="trend-tip" style="display:none;position:absolute;pointer-events:none;z-index:5;"></div>';

  var tip = document.getElementById("trendTip");
  var hitEls = host.querySelectorAll(".trend-hit");
  function fmtDate(ds) {
    try { var p = String(ds).split("-"); if (p.length === 3) return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }); return ds; }
    catch (e) { return ds; }
  }
  for (var h = 0; h < hitEls.length; h++) {
    hitEls[h].addEventListener("mouseenter", function (ev) {
      var t = trend[parseInt(this.getAttribute("data-i"), 10)];
      tip.innerHTML =
        '<div class="tip-date">' + fmtDate(t.date) + '</div>' +
        '<div class="tip-rate">' + t.rate + '% attendance</div>' +
        '<div class="tip-count">' + (t.attended || 0) + ' of ' + (t.total || 0) + ' attended</div>' +
        '<div class="tip-break">' +
          '<span class="tip-p">' + (t.present || 0) + ' P</span> \u00b7 ' +
          '<span class="tip-l">' + (t.late || 0) + ' L</span> \u00b7 ' +
          '<span class="tip-ae">' + (t.ae || 0) + ' AE</span> \u00b7 ' +
          '<span class="tip-au">' + (t.au || 0) + ' AU</span>' +
        '</div>';
      tip.style.display = "block";
      // position near the hovered point; flip to the LEFT of the pointer for
      // right-edge points so the box never covers what's plotted at the edge
      var rect = host.getBoundingClientRect();
      var cx = ev.clientX - rect.left, cy = ev.clientY - rect.top;
      var tw = tip.offsetWidth || 150;
      var left = cx + 12;
      if (left + tw > rect.width - 4) left = cx - 12 - tw;
      left = Math.max(left, 4);
      var top = Math.max(cy - 70, 4);
      tip.style.left = left + "px"; tip.style.top = top + "px";
    });
    hitEls[h].addEventListener("mouseleave", function () { tip.style.display = "none"; });
  }
}

// ---------- shared helpers (esc + showToast already exist in Scripts) ----------
function jsAttr(s) { return String(s).replace(/'/g, "\\'").replace(/"/g, "&quot;"); }
function downloadCSV_(csv, filename) {
  var blob = new Blob([csv], { type: "text/csv" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

var members = [], attendance = {}, selectedGroups = [], sessionApologies = {};

function getSelectedGroups() {
  var result = [];
  if (document.getElementById("grpChoir").checked)     result.push("Choir");
  if (document.getElementById("grpBand").checked)      result.push("Band");
  if (document.getElementById("grpOrchestra").checked) result.push("Orchestra");
  return result;
}

function onDateChange()      { refreshSessionTime(); }
function onGroupCheckChange(){ refreshSessionTime(); }
function onSessionTypeChange() {
  var isMeeting = document.getElementById("sessionType").value === "meeting";
  var wrap = document.getElementById("meetingPickerWrap");
  if (wrap) wrap.style.display = isMeeting ? "block" : "none";
  if (isMeeting) loadMeetingPicker();
  refreshSessionTime();
}

// Record tab — meeting picker dropdown. Lists upcoming scheduled meetings;
// picking one loads the whole session (date, groups, time, members).
function loadMeetingPicker() {
  var sel = document.getElementById("meetingPicker");
  if (!sel) return;
  sel.innerHTML = '<option value="">Loading meetings…</option>';
  google.script.run.withSuccessHandler(function (meetings) {
    if (!meetings || !meetings.length) {
      sel.innerHTML = '<option value="">No upcoming meetings — enter details manually</option>';
      return;
    }
    window._meetingCache = {};
    var h = '<option value="">Select a scheduled meeting…</option>';
    for (var i = 0; i < meetings.length; i++) {
      var m = meetings[i];
      var key = (m.id != null ? m.id : i);
      window._meetingCache[key] = m;
      var grps = (m.groups && m.groups.length) ? " (" + m.groups.join(", ") + ")" : "";
      h += '<option value="' + esc(String(key)) + '">'
         + esc(m.title || "Meeting") + ' — ' + esc(fmtDayMon(m.date)) + ' ' + esc(fmtTime12(m.time)) + grps
         + '</option>';
    }
    sel.innerHTML = h;
  }).withFailureHandler(function () {
    sel.innerHTML = '<option value="">Couldn\u2019t load meetings</option>';
  }).getMeetings();
}

// Picking a meeting auto-fills date, groups, time + note, then loads the member list.
function onMeetingPicked() {
  var sel = document.getElementById("meetingPicker");
  var key = sel.value;
  if (!key || !window._meetingCache || !window._meetingCache[key]) return;
  var m = window._meetingCache[key];

  document.getElementById("attendanceDate").value = m.date || "";

  var mg = m.groups || [];
  // Scoped roles: never auto-check a section outside the caller's scope
  document.getElementById("grpChoir").checked     = mg.indexOf("Choir") !== -1 && sectionAllowed("Choir");
  document.getElementById("grpBand").checked      = mg.indexOf("Band") !== -1 && sectionAllowed("Band");
  document.getElementById("grpOrchestra").checked = mg.indexOf("Orchestra") !== -1 && sectionAllowed("Orchestra");

  var timeEl = document.getElementById("sessionTime");
  if (timeEl) timeEl.value = m.time || "";
  var noteEl = document.getElementById("timeNote");
  if (noteEl) noteEl.textContent = "MEETING · " + String(m.title || "").toUpperCase();

  // Load the member list for the chosen groups (reuses the Record-tab flow).
  if (getSelectedGroups().length) onGroupChange();
}

// Route the time field to the right source for the chosen session type.
function refreshSessionTime() {
  var st = document.getElementById("sessionType");
  if (st && st.value === "meeting") applyMeetingAutofill();
  else lookupScheduleTime();
}

function lookupScheduleTime() {
  var ds = document.getElementById("attendanceDate").value;
  var grps = getSelectedGroups();
  var isMeeting = document.getElementById("sessionType").value === "meeting";
  if (isMeeting || !ds || grps.length === 0) return;
  google.script.run.withSuccessHandler(function (info) {
    if (info.found) {
      document.getElementById("sessionTime").value = info.time;
      document.getElementById("timeNote").textContent = "FROM SCHEDULE · " + info.dayName.toUpperCase();
    } else {
      document.getElementById("sessionTime").value = "";
      document.getElementById("timeNote").textContent = "NO SCHEDULE FOR " + info.dayName.toUpperCase();
    }
  }).withFailureHandler(function () {}).getSessionTime(ds, grps);
}

// ── Meetings (one-off sessions) ───────────────────────────────────────────
var scheduledMeetings = [];

// Find a scheduled meeting for a date that overlaps the chosen groups (any if none chosen).
function findScheduledMeeting(ds, grps) {
  for (var i = 0; i < scheduledMeetings.length; i++) {
    var m = scheduledMeetings[i];
    if (m.date !== ds) continue;
    if (!grps || !grps.length) return m;
    var mg = m.groups || [];
    for (var j = 0; j < grps.length; j++) if (mg.indexOf(grps[j]) !== -1) return m;
  }
  return null;
}

// Record tab “Meeting” auto-fill — time + note come from a matching scheduled meeting.
function applyMeetingAutofill() {
  var timeEl = document.getElementById("sessionTime");
  var noteEl = document.getElementById("timeNote");
  if (!timeEl || !noteEl) return;
  var ds = document.getElementById("attendanceDate").value;
  var m = ds ? findScheduledMeeting(ds, getSelectedGroups()) : null;
  if (m) {
    timeEl.value = m.time || "";
    noteEl.textContent = "MEETING · " + String(m.title || "").toUpperCase();
  } else {
    if (!timeEl.value) timeEl.value = "";
    noteEl.textContent = "ENTER MEETING TIME";
  }
}

function onMeetingPanelToggle() {
  var p = document.getElementById("meetingPanel");
  if (p && p.open) loadMeetings();
}

function loadMeetings() {
  var c = document.getElementById("meetingsList");
  if (c && !scheduledMeetings.length) c.innerHTML = '<p class="loading" style="padding:10px 0">Loading meetings…</p>';
  google.script.run.withSuccessHandler(function (list) {
    scheduledMeetings = list || [];
    renderMeetingsList(scheduledMeetings);
    var st = document.getElementById("sessionType");
    if (st && st.value === "meeting") applyMeetingAutofill();
  }).withFailureHandler(function () {
    if (c) c.innerHTML = '<p class="loading" style="padding:10px 0">Couldn\u2019t load meetings.</p>';
  }).getMeetings();
}

function renderMeetingsList(list) {
  var c = document.getElementById("meetingsList");
  if (!c) return;
  if (!list || !list.length) {
    c.innerHTML = '<p style="font-size:12.5px;color:var(--ink-500);padding:10px 0">No meetings scheduled yet.</p>';
    return;
  }
  var h = "";
  // An open edit survives reloads; it closes on save, cancel, or when its meeting is gone.
  if (meetingEditId != null && !list.some(function (x) { return String(x.id) === String(meetingEditId); })) meetingEditId = null;
  for (var i = 0; i < list.length; i++) {
    var m = list[i];
    if (meetingEditId != null && String(m.id) === String(meetingEditId)) { h += meetingEditFormHtml(m); continue; }
    var grpStr = (m.groups && m.groups.length) ? " · " + esc(m.groups.join(" / ")).toUpperCase() : "";
    h += '<div class="meeting-item">'
      +    '<div class="meeting-item-info">'
      +      '<div class="meeting-item-title">' + esc(m.title || "Meeting") + '</div>'
      +      '<div class="meeting-item-meta">' + esc(m.dayName ? m.dayName + " · " : "") + fmtDayMon(m.date) + " · " + fmtTime12(m.time) + grpStr + '</div>'
      +    '</div>'
      +    '<div class="meeting-acts">'
      +      (meetingInScope(m) ? '<button class="meeting-edit" data-write onclick="editMeeting(\'' + jsStr(m.id) + '\')">Edit</button>' : '')
      +      '<button class="meeting-del" onclick="deleteMeeting(\'' + jsStr(m.id) + '\')">Delete</button>'
      +    '</div>'
      + '</div>';
  }
  c.innerHTML = h;
  if (meetingEditId != null) lockMeetingGroups(c);
}

function scheduleMeeting() {
  if (roBlock()) return;
  var date  = document.getElementById("mtgDate").value;
  var time  = document.getElementById("mtgTime").value;
  var title = document.getElementById("mtgTitle").value.trim();
  var boxes = document.querySelectorAll(".mtgGroup");
  var groups = [];
  for (var i = 0; i < boxes.length; i++) if (boxes[i].checked) groups.push(boxes[i].value);
  if (!date)          { showToast("Pick a date.", "error"); return; }
  if (!time)          { showToast("Pick a time.", "error"); return; }
  if (!title)         { showToast("Enter a meeting title.", "error"); return; }

// "2026-06-18" → "18 Jun"
function fmtDayMon(ds) {
  if (!ds) return "";
  var p = String(ds).split("-");
  if (p.length < 3) return esc(String(ds));
  var mn = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return parseInt(p[2], 10) + " " + (mn[p[1] - 1] || "");
}

// Escape a value for safe inlining inside a single-quoted onclick attribute.
function jsStr(s) {
  return String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/"/g, "&quot;");
}

function applyApologyDefaults() {
  var changed = false;
  for (var i = 0; i < members.length; i++) {
    var name = members[i].name;
    var apol = sessionApologies[name];
    if (!apol) continue;
    var shouldApply = (apol.status === "Approved") || (apol.status === "Pending" && apol.onTime);
    if (shouldApply) {
      if      (apol.type === "Late")   attendance[name] = "Late Excused";
      else if (apol.type === "Absent") attendance[name] = "Absent Excused";
      changed = true;
    }
  }
  if (changed) { renderMembers(); updateSummary(); snapshotRecordBaseline(); }
}

function showPostSubmit(r) {
  // Tally string from r.summary
  var totals = {};
  for (var g in r.summary) {
    for (var k in r.summary[g]) totals[k] = (totals[k] || 0) + r.summary[g][k];
  }
  var grandTotal = 0, attended = 0;
  for (var s in totals) { grandTotal += totals[s]; if (s === "Present" || s === "Late Excused" || s === "Late Unexcused") attended += totals[s]; }
  var rate = grandTotal ? Math.round((attended / grandTotal) * 100) : 0;

  var body = '<div style="background:var(--ink);color:var(--paper);border-radius:12px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">'
    +   '<div><div style="font-family:var(--f-mono);font-size:9.5px;color:var(--gold-300);letter-spacing:.14em">TALLY</div><div style="display:flex;gap:12px;margin-top:6px;font-size:12px">';
  var order = ["Present","Late Excused","Late Unexcused","Absent Excused","Absent Unexcused"];
  for (var oi = 0; oi < order.length; oi++) {
    if (!totals[order[oi]]) continue;
    body += '<span><span class="num" style="font-size:18px;color:var(--paper)">' + totals[order[oi]] + '</span> <span style="color:var(--ink-300)">' + getStatusAbbrev(order[oi]) + '</span></span>';
  }
  body += '</div></div>'
    +   '<div style="text-align:right"><div style="font-family:var(--f-mono);font-size:9.5px;color:var(--gold-300);letter-spacing:.14em">RATE</div><div class="num" style="font-size:22px;color:var(--paper);margin-top:4px">' + rate + '%</div></div>'
    + '</div>';

  // Probation evals
  if (r.probationEvals && r.probationEvals.length > 0) {
    body += '<div class="eyebrow" style="margin:18px 0 10px">Probation evaluations · ' + r.probationEvals.length + ' completed</div>';
    for (var i = 0; i < r.probationEvals.length; i++) {
      var e = r.probationEvals[i];
      var passed = e.result === "Passed" || e.result === "passed_clean" || e.result === "passed_conditional";
      var palBg = passed ? 'var(--present-bg)' : 'var(--crimson-100)';
      var palC  = passed ? 'var(--present)' : 'var(--crimson-600)';
      var label = e.result === "passed_conditional" ? 'PASSED · CONDITIONAL' : (passed ? 'PASSED' : 'FAILED');
      body += '<div style="padding:12px 14px;border-radius:10px;margin-bottom:8px;background:' + palBg + ';display:flex;align-items:center;justify-content:space-between">'
        +    '<div><div style="font-size:13px;font-weight:600;color:var(--ink)">' + esc(e.name) + '</div>'
        +    '<div style="font-size:11.5px;color:var(--ink-600);margin-top:3px">' + e.attended + ' of 10 · ' + e.rate + '%' + (e.penalty ? ' · ' + e.penalty + ' pts' : '') + '</div></div>'
        +    '<span style="font-family:var(--f-mono);font-size:9.5px;font-weight:700;letter-spacing:.12em;color:' + palC + ';padding:4px 8px;border-radius:4px;background:#fff">' + label + '</span>'
        + '</div>';
    }
    body += '<div style="font-size:11.5px;color:var(--ink-500);margin-top:6px">Members and CC\u2019d admins have been notified by email.</div>';
  }

  document.getElementById("postSubmitEyebrow").textContent = (selectedGroups.join(" \u00b7 ") || "Attendance") + " \u00b7 recorded";
  document.getElementById("postSubmitBody").innerHTML = body;
  document.getElementById("postSubmitDialog").style.display = "flex";
}

}

// Changes bar (batch edit)
function getChangeCount() {
  var c = 0;
  for (var ri in viewEditedStatuses) if (viewEditedStatuses[ri] !== viewOriginalStatuses[ri]) c++;
  return c;
}
function hideChangesBar() { var b = document.getElementById("changesBar"); if (b) b.remove(); }
function discardChanges() { viewEditedStatuses = {}; hideChangesBar(); if (sessDetailActive) paintSessionDetail(); else renderViewTab(); }
function saveChanges() {
  if (roBlock()) return;
  var u = [];
  // Each change carries who/when/where it belongs to, so the backend verifies the row
  // it targets (rows move after an overwrite or a dedupe) and refuses to overwrite a
  // record someone else changed in the meantime (oldStatus).
  var viewDate = (sessDetailActive && sessCurrent) ? sessCurrent.date : viewCurrentDate;
  var viewSession = (sessDetailActive && sessCurrent) ? (sessCurrent.sessionKey || "") : "";
  for (var ri in viewEditedStatuses) {
    if (viewEditedStatuses[ri] !== viewOriginalStatuses[ri]) {
      var rec = null;
      for (var k = 0; k < viewRecords.length; k++) if (viewRecords[k].rowIndex === parseInt(ri)) { rec = viewRecords[k]; break; }
      u.push({ rowIndex: parseInt(ri), newStatus: viewEditedStatuses[ri],
               name: rec ? rec.name : "", date: rec ? (rec.date || viewDate) : "", group: rec ? rec.group : "",
               session: rec ? (rec.session || viewSession) : "", oldStatus: viewOriginalStatuses[ri] });
    }
  }
  if (u.length === 0) return;
  var done = beginAction("saveAttendance", [document.getElementById("btnSaveChanges")], "Saving…");
  if (!done) return;
  google.script.run.withSuccessHandler(function (r) {
    done();
    r = r || {};
    // A save can break a 3-AU set (offense removed) and change a concluded
    // probation result (flagged, never applied here). Say both.
    var parts = ["Saved", (r.changed || 0) + " record" + (r.changed === 1 ? "" : "s") + " updated"];
    if (r.offensesRemoved) parts.push(r.offensesRemoved + " offense" + (r.offensesRemoved === 1 ? "" : "s") + " removed");
    if (r.historyUpdated)  parts.push(r.historyUpdated + " probation history row" + (r.historyUpdated === 1 ? "" : "s") + " refreshed");
    var pNote = probationFlagToastPart(r.probationFlags);
    if (pNote) parts.push(pNote);
    var skipped = r.skipped || [];
    if (skipped.length) {
      showToast((r.changed ? parts.join(" \u00b7 ") + ". " : "") + skipped.length + " change(s) not saved: " + skipped.map(function (s) { return s.reason; }).join(" \u00b7 "), "warning");
    } else showToast(parts.join(" \u00b7 ") + ".", "success");
    if (pNote || r.offensesRemoved) { loadProbationOutcomeFlags(); loadReinstatementFlags(); }
    if (skipped.length) {
      // Reload so the register shows what is actually stored.
      viewEditedStatuses = {}; hideChangesBar();
      if (sessDetailActive && sessCurrent) openSession(sessCurrent.date, sessCurrent.sessionKey);
      else if (viewCurrentDate) loadDateDetail(viewCurrentDate);
      return;
    }
    for (var ri2 in viewEditedStatuses) {
      viewOriginalStatuses[ri2] = viewEditedStatuses[ri2];
      for (var i = 0; i < viewRecords.length; i++) {
        if (viewRecords[i].rowIndex === parseInt(ri2)) { viewRecords[i].status = viewEditedStatuses[ri2]; break; }
      }
    }
    viewEditedStatuses = {}; hideChangesBar(); if (sessDetailActive) paintSessionDetail(); else renderViewTab();
  }).withFailureHandler(function (e) {
    done();
    showToast(serverError(e), "error");
  }).batchUpdateAttendance(u);
}

// ─── Member filters ───────────────────────────────────────────────
// One set of filters drives both the roster list and the two exports. Every list
// comes from getMemberFilterOptions() — real values out of the sheet, never a
// hard-coded set. The count shown is the backend's own count, so what the list
// shows is what the export contains.
var MFILTER_FIELDS = ["sections", "roles", "genders", "faculties", "yearsOfStudy", "probationStatuses", "memberStatuses"];
var memberFilterOptions = null, memberFilterOpen = false, memberCountTimer = null;
var memberFilters = { sections: [], roles: [], genders: [], faculties: [], yearsOfStudy: [], probationStatuses: [], memberStatuses: [] };

// The roster list is filtered SERVER-SIDE: getFilteredMemberNames(filters) runs the
// same filterMembers_ as the count and both exports, so list, count and files agree.
// While a request is out the list shows a loading state.
var memberFilterNames = null, memberFilterBusy = false, memberFilterSeq = 0, memberFilterTimer = null;
function memberPassesFilter(m) {
  return memberFilterNames ? !!memberFilterNames[m.name] : memberFilterMatch(m);
}

// FALLBACK only (backend without getFilteredMemberNames): a client mirror of
// filterMembers_. getMemberList() rows carry no gender / faculty / year / member
// status, so those facets are skipped per row rather than dropping the member.
function memberFilterMatch(m) {
  var f = memberFilters;
  function has(l) { return l && l.length; }
  if (has(f.sections) && !(m.groups || []).some(function (g) { return f.sections.indexOf(g) !== -1; })) return false;
  if (has(f.roles)) {
    var match = false;
    for (var g in (m.roles || {})) {
      var r = m.roles[g] ? String(m.roles[g]).trim() : "";
      if (r && f.roles.indexOf(r) !== -1) match = true;
    }
    if (!match) return false;
  }
  if (has(f.genders) && m.gender && f.genders.indexOf(m.gender) === -1) return false;
  if (has(f.faculties) && m.courseFaculty && f.faculties.indexOf(m.courseFaculty) === -1) return false;
  if (has(f.yearsOfStudy) && m.yearOfStudy && f.yearsOfStudy.indexOf(m.yearOfStudy) === -1) return false;
  if (has(f.memberStatuses) && m.memberStatus && f.memberStatuses.indexOf(m.memberStatus) === -1) return false;
  if (has(f.probationStatuses)) {
    var st = m.probationFailed ? "Failed" : m.probationPassed ? "Passed" : m.probation ? "On probation" : "Not on probation";
    if (f.probationStatuses.indexOf(st) === -1) return false;
  }
  return true;
}

function initMemberFilters() {
  var bar = document.getElementById("memberFilter");
  // Exports are management-only server-side — don't offer reps a button that throws.
  if (typeof isManagement === "function" && !isManagement()) { if (bar) bar.style.display = "none"; return; }
  if (memberFilterOptions) return;
  google.script.run.withSuccessHandler(function (o) {
    memberFilterOptions = o || {};
    renderMemberFilterPanel();
    refreshFilteredMemberCount();
  }).withFailureHandler(function (e) {
    var p = document.getElementById("mfilterPanel");
    if (p) p.innerHTML = '<p class="loading">Filters unavailable: ' + esc(e.message) + '</p>';
  }).getMemberFilterOptions();
}

function toggleMemberFilterPanel() {
  memberFilterOpen = !memberFilterOpen;
  var p = document.getElementById("mfilterPanel");
  var caret = document.getElementById("mfilterCaret");
  if (p) p.style.display = memberFilterOpen ? "grid" : "none";
  if (caret) caret.textContent = memberFilterOpen ? "\u25be" : "\u25b8";
}

function mfChips(field, values) {
  var s = '<div class="mfilter-chips">';
  for (var i = 0; i < values.length; i++) {
    var v = String(values[i]);
    var on = memberFilters[field].indexOf(v) !== -1;
    s += '<button class="filter-chip' + (on ? ' active' : '') + '" onclick="toggleMemberFilter(&#39;' + field + '&#39;,&#39;' + jsAttr(v) + '&#39;)">' + esc(v) + '</button>';
  }
  return s + '</div>';
}
function mfFacet(field, label, values, span) {
  if (!values || !values.length) return '';
  return '<div class="mfilter-facet' + (span ? ' span-2' : '') + '">'
       +   '<div class="mfilter-facet-head"><span class="eyebrow">' + label + '</span></div>'
       +   mfChips(field, values)
       + '</div>';
}

function renderMemberFilterPanel() {
  var p = document.getElementById("mfilterPanel");
  if (!p) return;
  var o = memberFilterOptions || {};
  var h = mfFacet("sections", "Sections", o.sections || []);

  // Roles are keyed by section server-side; show them grouped, filter on one flat list.
  var roleKeys = o.roles ? Object.keys(o.roles) : [];
  var roleBlocks = "";
  for (var r = 0; r < roleKeys.length; r++) {
    var list = o.roles[roleKeys[r]] || [];
    if (!list.length) continue;
    roleBlocks += '<div class="mfilter-sub">' + esc(roleKeys[r]) + '</div>' + mfChips("roles", list);
  }
  if (roleBlocks) {
    h += '<div class="mfilter-facet span-2">'
      +    '<div class="mfilter-facet-head"><span class="eyebrow">Roles &amp; parts</span></div>'
      +    roleBlocks
      + '</div>';
  }
  h += mfFacet("genders", "Gender", o.genders || []);
  h += mfFacet("yearsOfStudy", "Year of study", o.yearsOfStudy || []);
  h += mfFacet("faculties", "Course faculty", o.faculties || [], true);
  h += mfFacet("probationStatuses", "Probation", o.probationStatuses || []);
  h += mfFacet("memberStatuses", "Member status", o.memberStatuses || []);
  h += '<div class="mfilter-facet span-2" style="align-items:flex-start"><button class="mfilter-clear" onclick="clearMemberFilters()">Clear all filters</button></div>';
  p.innerHTML = h || '<p class="loading">No filterable data yet.</p>';
  syncMemberFilterBar();
}

function activeMemberFilterCount() {
  var n = 0;
  for (var i = 0; i < MFILTER_FIELDS.length; i++) n += memberFilters[MFILTER_FIELDS[i]].length;
  return n;
}
function syncMemberFilterBar() {
  var badge = document.getElementById("mfilterOnCount");
  var n = activeMemberFilterCount();
  if (badge) { badge.textContent = n; badge.style.display = n ? "inline-block" : "none"; }
}

function toggleMemberFilter(field, value) {
  if (!memberFilters[field]) return;
  var i = memberFilters[field].indexOf(value);
  if (i === -1) memberFilters[field].push(value); else memberFilters[field].splice(i, 1);
  renderMemberFilterPanel();
  applyMemberFilters();
}
function clearMemberFilters() {
  for (var i = 0; i < MFILTER_FIELDS.length; i++) memberFilters[MFILTER_FIELDS[i]] = [];
  renderMemberFilterPanel();
  applyMemberFilters();
}

// Filters changed: show the list loading, fetch the matching names (debounced),
// then re-render. Stale responses are dropped by sequence number.
function applyMemberFilters() {
  var seq = ++memberFilterSeq;
  if (memberFilterTimer) { clearTimeout(memberFilterTimer); memberFilterTimer = null; }
  if (!activeMemberFilterCount() || !hasServerFn("getFilteredMemberNames")) {
    memberFilterNames = null; memberFilterBusy = false;
    settleMemberFilter();
    refreshFilteredMemberCount();
    return;
  }
  if (memberCountTimer) { clearTimeout(memberCountTimer); memberCountTimer = null; }
  memberFilterBusy = true;
  renderMemberList();
  var el = document.getElementById("mfilterCount");
  if (el) el.innerHTML = '<b>\u2026</b> filtering';
  memberFilterTimer = setTimeout(function () {
    memberFilterTimer = null;
    google.script.run.withSuccessHandler(function (names) {
      if (seq !== memberFilterSeq) return;
      names = names || [];
      memberFilterBusy = false;
      memberFilterNames = {};
      for (var i = 0; i < names.length; i++) memberFilterNames[names[i]] = true;
      paintMemberCount(names.length);
      settleMemberFilter();
    }).withFailureHandler(function (e) {
      if (seq !== memberFilterSeq) return;
      memberFilterBusy = false; memberFilterNames = null;
      showToast("Couldn\u2019t filter the roster: " + serverError(e), "error");
      settleMemberFilter();
      refreshFilteredMemberCount();
    }).getFilteredMemberNames(memberFilterPayload());
  }, 220);
}
// Re-render the list; drop a selection that no longer qualifies (never an open edit form).
function settleMemberFilter() {
  if (selectedMemberName && memberDetailMode === "view") {
    var still = memberListData.some(function (m) { return m.name === selectedMemberName && memberPassesFilter(m); });
    if (!still) {
      selectedMemberName = null;
      var rp = document.getElementById("membersRosterPane");
      if (rp) rp.classList.remove("detail-open");
      renderMemberDetail();
    }
  }
  renderMemberList();
}
function paintMemberCount(n) {
  n = Number(n) || 0;
  var e2 = document.getElementById("mfilterCount");
  if (e2) e2.innerHTML = '<b>' + n + '</b> member' + (n === 1 ? '' : 's') + ' match' + (n === 1 ? 'es' : '');
  var csv = document.getElementById("mfilterCsv"), pdf = document.getElementById("mfilterPdf");
  if (csv) csv.disabled = (n === 0);
  if (pdf) pdf.disabled = (n === 0);
}

// Omitted or empty means "no filter on that field" — send only what is set.
function memberFilterPayload() {
  var out = {};
  for (var i = 0; i < MFILTER_FIELDS.length; i++) {
    var f = MFILTER_FIELDS[i];
    if (memberFilters[f].length) out[f] = memberFilters[f].slice();
  }
  return out;
}

function refreshFilteredMemberCount() {
  var el = document.getElementById("mfilterCount");
  if (el) el.innerHTML = '<b>\u2026</b> counting';
  if (memberCountTimer) clearTimeout(memberCountTimer);
  memberCountTimer = setTimeout(function () {
    google.script.run.withSuccessHandler(paintMemberCount).withFailureHandler(function () {
      var e3 = document.getElementById("mfilterCount");
      if (e3) e3.innerHTML = '<b>\u2014</b> members match';
    }).countFilteredMembers(memberFilterPayload());
  }, 220);
}

function exportFilteredMembersCSV() {
  var btn = document.getElementById("mfilterCsv");
  if (btn) { btn.disabled = true; btn.textContent = "Exporting\u2026"; }
  google.script.run.withSuccessHandler(function (csv) {
    if (btn) { btn.disabled = false; btn.textContent = "Export \u00b7 CSV"; }

  }).withFailureHandler(function (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Export \u00b7 CSV"; }

}

function exportFilteredMembersPDF() {
  var btn = document.getElementById("mfilterPdf");
  if (btn) { btn.disabled = true; btn.textContent = "Preparing\u2026"; }

  }).withFailureHandler(function (e) {
